[Timer]
# Недельный ритм, решение владельца 2026-10-04.
#
# aptekonline — единственный из трёх сайтов, который нельзя собрать бесплатно:
# прямой доступ с прод-хоста даёт 403 Cloudflare (замерено 0/18), нужен платный
# выход. И он дорогой: у ScraperAPI обход Cloudflare тарифицируется 10
# кредитами за запрос вместо 1, то есть полный сбор ≈12 000 кредитов, и
# ежедневный ритм стоит $149/мес против $49 за недельный.
#
# aloe и pharmonline собираются напрямую и бесплатно — их ритм этим файлом не
# затрагивается.
#
# Пустой OnCalendar= сбрасывает ежедневное расписание базового юнита; без него
# два значения сложились бы, а не заменили друг друга.
OnCalendar=
OnCalendar=Mon *-*-* 02:00:00
RandomizedDelaySec=300
Persistent=true
