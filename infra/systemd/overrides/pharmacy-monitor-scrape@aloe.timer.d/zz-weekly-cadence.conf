[Timer]
# Недельный ритм, решение владельца 2026-10-06: все три сайта собираются полным
# каталогом раз в неделю, по понедельникам. Часы разнесены, чтобы тяжёлые
# прогоны не наложились: pharmonline 01:00, aptekonline 02:00, aloe 03:00.
#
# Это НЕ отключает частичные тики: pharmacy-monitor-intraday (13 раз в день) и
# pharmacy-monitor-watchlist (каждые 3 часа) остаются суточными — они обновляют
# приоритетные товары и кормят мгновенные ценовые алерты.
#
# Ритм продублирован в src/cadence.py — пороги «данные устарели» выводятся
# оттуда. Меняешь расписание здесь — меняй и там, иначе дашборд снова начнёт
# красить штатный сбор красным.
#
# Пустой OnCalendar= сбрасывает ежедневное расписание базового юнита; без него
# два значения сложились бы, а не заменили друг друга.
OnCalendar=
OnCalendar=Mon *-*-* 03:00:00
RandomizedDelaySec=300
Persistent=true
