[project]
name = "pharmacy-monitor"
version = "0.1.0"
description = "Daily competitive monitoring for pharmonline.az vs aptekonline.az and aloe.az"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tenacity>=9.0",
    "structlog>=24.4",
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
    "watchdog>=6.0.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    # === Production stack (Week 1+) ===
    "alembic>=1.13",            # schema migrations
    "psycopg[binary]>=3.2",     # PostgreSQL driver (replaces sqlite for prod)
    "redis>=5.0",               # cache + rate-limit backend
    "slowapi>=0.1.9",           # FastAPI rate-limiting
    "python-jose[cryptography]>=3.3",  # JWT for magic-link auth
    "sentry-sdk[fastapi]>=2.0", # error tracking
    "httpx>=0.27",              # used by tests + Resend SMTP (if API mode)
    "prometheus-client>=0.21",  # /metrics endpoint
    "bcrypt>=5.0",              # password login
    "openai>=1.50",             # AI crawler — default LLM provider
    "anthropic>=0.40",          # AI crawler — alternative provider
    "websockets>=13.0",         # Meteor DDP scraper для pharmonline (Phase 1c)
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
pharmacy-monitor = "src.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/dashboard.py",
    "src/api.py",
    "src/scrapers/*.py",
    "src/_time.py",
    "src/auth.py",
    "src/telegram_bot.py",
]

[tool.coverage.report]
precision = 1
show_missing = false
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
