; Alembic configuration for pharmacy-monitor
;
; Migrations sit in `migrations/versions/`. Database URL is read from env
; via env.py (DATABASE_URL), so you don't have to edit this file per env.
;
; Common commands:
;   alembic upgrade head                    # apply all migrations
;   alembic revision --autogenerate -m msg  # create new migration from model diff
;   alembic downgrade -1                    # rollback one
;   alembic history                         # show migration tree
;   alembic current                         # show current revision

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

; Auto-format generated migrations with ruff
[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
