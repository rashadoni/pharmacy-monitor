name: Preflight full Pharmonline public API recovery (no persistence)

# This is intentionally a proof-only workflow.  It does not invoke the scrape
# CLI and therefore cannot create a Run, Product, price snapshot, alert, or
# report.  Before a manual recovery is allowed, it proves that the public API
# is a complete, stable, DDP-identity-compatible source for the current
# Pharmonline catalog.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PREFLIGHT to run the read-only full-catalog proof"
        required: true
        default: ""

permissions:
  contents: read

# A subsequent public-API recovery should use this same group.  It must not
# overlap this proof, otherwise the source could change between its two passes.
concurrency:
  group: pharmonline-public-api-recovery
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    # Two complete 96-page passes plus the product sitemaps need more time than
    # the short API probe, while still keeping a bounded manual operation.
    timeout-minutes: 45
    steps:
      - name: Require explicit read-only preflight confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PREFLIGHT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preflight dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Open read-only production Postgres tunnel
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -N -L 5433:localhost:5432 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 &
          echo "TUNNEL_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if nc -z localhost 5433 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "production Postgres tunnel did not come up" >&2
          exit 1

      - name: Prove full public catalog, sitemap, and DDP identity without writes
        env:
          DATABASE_URL: postgresql+psycopg://pm:${{ secrets.PG_PASS }}@localhost:5433/pharmacy_monitor
          CRAWLBASE_JS_TOKEN: ${{ secrets.CRAWLBASE_JS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CRAWLBASE_JS_TOKEN"
          python - <<'PY'
          import asyncio
          import hashlib
          import html
          import json
          import math
          import os
          import re
          import secrets
          from collections.abc import Iterable
          from dataclasses import dataclass
          from urllib.parse import quote, urlencode, unquote, urljoin, urlsplit
          from xml.etree import ElementTree

          import httpx
          from sqlalchemy import create_engine, text


          BASE_URL = "https://pharmonline.az"
          PAGE_SIZE = 100
          SORT_BY = "name_asc"
          MAX_PAGES = 200
          METEOR_ID_RE = re.compile(r"^[A-Za-z0-9]{17}$")
          PRODUCT_SITEMAP_RE = re.compile(r"/sitemap-products-\d+\.xml$", re.I)
          DDP_AVAILABILITY_SOURCE = "pharmonline_ddp_total_count"
          MIN_TRUSTED_COVERAGE = 0.98
          MAX_CRAWLBASE_ATTEMPTS = 2
          # Long Crawlbase browser contexts have empirically degraded after
          # dozens of product pages. Keep each bounded group sticky, while the
          # exact full-catalog/sitemap/DB proofs below reject any mixed result.
          CATALOG_SESSION_PAGE_SPAN = 20
          SITEMAP_SESSION = secrets.token_hex(16)
          ORIGIN_CONTEXT_HEADERS = (
              "cache-control",
              "vary",
              "cf-cache-status",
              "x-cache",
          )
          ORIGIN_CONTEXTS: dict[str, set[str]] = {}
          TRANSIENT_TRANSPORT_RETRIES = 0


          @dataclass(frozen=True)
          class CatalogPass:
              total: int
              pages: int
              # Each page keeps both identity and canonical URL so a source
              # shuffle or a changed path cannot be hidden by an ID-only set.
              page_records: tuple[tuple[tuple[str, str], ...], ...]
              ids: frozenset[str]
              urls: frozenset[str]
              session_chunks: int


          def origin_context_evidence() -> str:
              if not ORIGIN_CONTEXTS:
                  return "none"
              return ",".join(
                  f"{resource}:{len(fingerprints)}"
                  for resource, fingerprints in sorted(ORIGIN_CONTEXTS.items())
              )


          def fail(message: str) -> None:
              raise SystemExit(
                  "Pharmonline public API full preflight failed: "
                  f"{message}; crawlbase_sessions=short_chunks, "
                  f"origin_contexts={origin_context_evidence()}, "
                  f"transport_retries={TRANSIENT_TRANSPORT_RETRIES}"
              )


          def text_value(value: object) -> str | None:
              if value is None:
                  return None
              result = str(value).strip()
              return result or None


          def record_origin_context(target_url: str, envelope: dict) -> None:
              """Record only hashed cache-context evidence, never cookies."""
              raw_headers = envelope.get("original_headers")
              if not isinstance(raw_headers, dict):
                  return
              headers = {
                  str(name).lower(): text_value(value)
                  for name, value in raw_headers.items()
              }
              selected = tuple(
                  (name, headers[name])
                  for name in ORIGIN_CONTEXT_HEADERS
                  if headers.get(name) is not None
              )
              if not selected:
                  return
              fingerprint = hashlib.sha256(repr(selected).encode("utf-8")).hexdigest()[:12]
              resource = urlsplit(target_url).path
              ORIGIN_CONTEXTS.setdefault(resource, set()).add(fingerprint)


          def canonical_product_url(value: object, *, source_is_path: bool) -> str | None:
              """Match the recovery scraper's locale-free product URL key."""
              raw = text_value(value)
              if raw is None:
                  return None
              parsed = urlsplit(raw)
              if source_is_path:
                  if parsed.scheme or parsed.netloc or parsed.query or parsed.fragment:
                      return None
                  path = parsed.path
              else:
                  host = parsed.netloc.lower().removeprefix("www.")
                  if host not in {"", "pharmonline.az"} or parsed.query or parsed.fragment:
                      return None
                  path = parsed.path

              decoded_path = unquote(path).strip().rstrip("/")
              for locale in ("az", "en", "ru"):
                  prefix = f"/{locale}/product/"
                  if decoded_path.startswith(prefix):
                      decoded_path = "/product/" + decoded_path[len(prefix) :]
                      break
              if source_is_path:
                  decoded_path = "/product/" + decoded_path.lstrip("/")
              if not decoded_path.startswith("/product/"):
                  return None
              slug = decoded_path[len("/product/") :].strip("/")
              if not slug or "/" in slug:
                  return None
              return f"{BASE_URL}/product/{quote(slug, safe='-._~')}"


          def canonical_stored_product_url(value: object) -> str | None:
              """Match the runtime identity guard for historical DDP rows.

              Historic records may preserve a locale query or fragment. Those
              do not identify a different product, so normalize them exactly
              as the recovery command does before comparing a trusted DDP row
              with the public API path.
              """
              raw = text_value(value)
              if raw is None:
                  return None
              parsed = urlsplit(raw)
              host = parsed.netloc.lower().removeprefix("www.")
              if host not in {"", "pharmonline.az"}:
                  return None
              decoded_path = unquote(parsed.path).strip().rstrip("/")
              for locale in ("az", "en", "ru"):
                  prefix = f"/{locale}/product/"
                  if decoded_path.startswith(prefix):
                      decoded_path = "/product/" + decoded_path[len(prefix) :]
                      break
              if not decoded_path.startswith("/product/"):
                  return None
              slug = decoded_path[len("/product/") :].strip("/")
              if not slug or "/" in slug:
                  return None
              return f"{BASE_URL}/product/{quote(slug, safe='-._~')}"


          def xml_locs(document: str) -> Iterable[str]:
              try:
                  root = ElementTree.fromstring(document)
              except ElementTree.ParseError as exc:
                  fail(f"invalid sitemap XML: {exc}")
              for element in root.iter():
                  if element.tag.rsplit("}", 1)[-1] != "loc":
                      continue
                  location = text_value(element.text)
                  if location is not None:
                      yield location


          def same_origin_sitemap_url(value: object) -> str | None:
              raw = text_value(value)
              if raw is None:
                  return None
              resolved = urljoin(f"{BASE_URL}/", raw)
              parsed = urlsplit(resolved)
              host = parsed.netloc.lower().removeprefix("www.")
              if (
                  parsed.scheme != "https"
                  or host != "pharmonline.az"
                  or parsed.query
                  or parsed.fragment
              ):
                  return None
              return f"{BASE_URL}{parsed.path}"


          def json_from_body(body: object, *, target_url: str) -> dict | list:
              if isinstance(body, (dict, list)):
                  return body
              if not isinstance(body, str):
                  fail(f"Crawlbase returned no JSON body for {target_url}")
              raw_body = body
              pre_match = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I | re.S)
              if pre_match:
                  raw_body = html.unescape(pre_match.group(1))
              try:
                  payload = json.loads(raw_body)
              except json.JSONDecodeError as exc:
                  fail(
                      "Crawlbase body is not JSON for "
                      f"{target_url}: {exc.msg}; prefix={raw_body[:120]!r}"
                  )
              if not isinstance(payload, (dict, list)):
                  fail(f"unsupported JSON shape for {target_url}: {type(payload).__name__}")
              return payload


          async def crawlbase_body(
              client: httpx.AsyncClient,
              target_url: str,
              *,
              accept: str,
              crawlbase_session: str,
          ) -> object:
              params = {
                  "token": os.environ["CRAWLBASE_JS_TOKEN"],
                  "url": target_url,
                  "request_headers": f"accept:{accept}",
                  # Transport retries preserve the exact same page-group
                  # session. Only the enumerator may create a new session at
                  # a bounded catalog page-group boundary.
                  "cookies_session": crawlbase_session,
                  "get_headers": "true",
                  "format": "json",
              }
              global TRANSIENT_TRANSPORT_RETRIES
              for attempt in range(1, MAX_CRAWLBASE_ATTEMPTS + 1):
                  try:
                      response = await client.get("https://api.crawlbase.com/", params=params)
                      break
                  except (httpx.TimeoutException, httpx.NetworkError) as exc:
                      if attempt == MAX_CRAWLBASE_ATTEMPTS:
                          fail(
                              "Crawlbase transient request failed after "
                              f"{attempt} attempts for {target_url}: {type(exc).__name__}"
                          )
                      TRANSIENT_TRANSPORT_RETRIES += 1
                      # Retry exactly once with the same sticky session. The
                      # full two-pass and sitemap proofs below still reject
                      # a partial or mixed catalog.
                      await asyncio.sleep(1)
                  except httpx.HTTPError as exc:
                      fail(f"Crawlbase request failed for {target_url}: {type(exc).__name__}")
              if response.status_code != 200:
                  fail(f"Crawlbase HTTP {response.status_code} for {target_url}")
              try:
                  envelope = response.json()
              except json.JSONDecodeError as exc:
                  fail(
                      "Crawlbase did not return a JSON envelope for "
                      f"{target_url}: {exc.msg}; prefix={response.text[:120]!r}"
                  )
              if not isinstance(envelope, dict):
                  fail(f"Crawlbase envelope is not an object for {target_url}")
              cb_status = str(envelope.get("cb_status") or "")
              original_status = str(envelope.get("original_status") or "")
              if cb_status != "200" or original_status != "200":
                  fail(
                      "Crawlbase/source status is not successful for "
                      f"{target_url}: cb_status={cb_status or '<missing>'}, "
                      f"original_status={original_status or '<missing>'}"
                  )
              if "body" not in envelope:
                  fail(f"Crawlbase envelope has no body for {target_url}")
              record_origin_context(target_url, envelope)
              return envelope["body"]


          async def crawlbase_json(
              client: httpx.AsyncClient,
              target_url: str,
              *,
              crawlbase_session: str,
          ) -> dict | list:
              return json_from_body(
                  await crawlbase_body(
                      client,
                      target_url,
                      accept="application/json",
                      crawlbase_session=crawlbase_session,
                  ),
                  target_url=target_url,
              )


          async def crawlbase_xml(
              client: httpx.AsyncClient,
              target_url: str,
              *,
              crawlbase_session: str,
          ) -> str:
              body = await crawlbase_body(
                  client,
                  target_url,
                  accept="application/xml,text/xml;q=0.9,*/*;q=0.8",
                  crawlbase_session=crawlbase_session,
              )
              if not isinstance(body, str):
                  fail(f"Crawlbase returned a non-text sitemap body for {target_url}")
              pre_match = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I | re.S)
              return html.unescape(pre_match.group(1)) if pre_match else body


          def product_api_url(page: int) -> str:
              query = urlencode(
                  {
                      "lng": "az",
                      "page": str(page),
                      "limit": str(PAGE_SIZE),
                      "sortBy": SORT_BY,
                  }
              )
              return f"{BASE_URL}/api/products?{query}"


          def parse_page(payload: object, *, page: int) -> tuple[list[dict], int, int]:
              if not isinstance(payload, dict):
                  fail(f"page {page} payload is not an object")
              rows = payload.get("data")
              if not isinstance(rows, list) or not all(isinstance(row, dict) for row in rows):
                  fail(f"page {page} has invalid data rows")
              try:
                  total = int(payload["total"])
                  pages = int(payload["pages"])
              except (KeyError, TypeError, ValueError) as exc:
                  fail(f"page {page} has invalid total/pages metadata: {type(exc).__name__}")
              if total < 1 or pages < 1:
                  fail(f"page {page} has non-positive total/pages metadata")
              return rows, total, pages


          def page_identity_records(
              rows: list[dict],
              *,
              pass_name: str,
              page: int,
          ) -> tuple[tuple[str, str], ...]:
              records: list[tuple[str, str]] = []
              for position, row in enumerate(rows, start=1):
                  external_id = text_value(row.get("_id"))
                  canonical_url = canonical_product_url(row.get("path"), source_is_path=True)
                  if external_id is None or METEOR_ID_RE.fullmatch(external_id) is None:
                      fail(
                          f"{pass_name}: page {page} item {position} has no direct 17-character ID"
                      )
                  if canonical_url is None:
                      fail(
                          f"{pass_name}: page {page} item {position} has an invalid product path"
                      )
                  records.append((external_id, canonical_url))
              if len({external_id for external_id, _ in records}) != len(records):
                  fail(f"{pass_name}: duplicate product ID on page {page}")
              if len({canonical_url for _, canonical_url in records}) != len(records):
                  fail(f"{pass_name}: duplicate canonical product URL on page {page}")
              return tuple(records)


          async def enumerate_catalog(
              client: httpx.AsyncClient,
              *,
              pass_name: str,
          ) -> CatalogPass:
              catalog_sessions: dict[int, str] = {}

              def session_for_page(page: int) -> str:
                  if page < 1:
                      fail(f"{pass_name}: invalid page number {page}")
                  chunk = (page - 1) // CATALOG_SESSION_PAGE_SPAN
                  return catalog_sessions.setdefault(chunk, secrets.token_hex(16))

              first_payload = await crawlbase_json(
                  client,
                  product_api_url(1),
                  crawlbase_session=session_for_page(1),
              )
              first_rows, expected_total, expected_pages = parse_page(first_payload, page=1)
              first_page_records = page_identity_records(
                  first_rows,
                  pass_name=pass_name,
                  page=1,
              )
              if expected_pages > MAX_PAGES:
                  fail(
                      f"{pass_name}: page count {expected_pages} exceeds safety limit {MAX_PAGES}"
                  )
              if expected_pages != math.ceil(expected_total / PAGE_SIZE):
                  fail(
                      f"{pass_name}: total/pages mismatch "
                      f"total={expected_total}, pages={expected_pages}, page_size={PAGE_SIZE}"
                  )

              seen_ids: set[str] = set()
              seen_urls: set[str] = set()
              page_records: list[tuple[tuple[str, str], ...]] = []
              for page in range(1, expected_pages + 1):
                  page_session = session_for_page(page)
                  if page > 1 and (page - 1) % CATALOG_SESSION_PAGE_SPAN == 0:
                      anchor_payload = await crawlbase_json(
                          client,
                          product_api_url(1),
                          crawlbase_session=page_session,
                      )
                      anchor_rows, anchor_total, anchor_pages = parse_page(anchor_payload, page=1)
                      if anchor_total != expected_total or anchor_pages != expected_pages:
                          fail(
                              f"{pass_name}: chunk anchor metadata changed before page {page}: "
                              f"got total={anchor_total},pages={anchor_pages}; "
                              f"expected total={expected_total},pages={expected_pages}"
                          )
                      if (
                          page_identity_records(
                              anchor_rows,
                              pass_name=pass_name,
                              page=1,
                          )
                          != first_page_records
                      ):
                          fail(f"{pass_name}: chunk anchor changed before page {page}")
                  payload = (
                      first_payload
                      if page == 1
                      else await crawlbase_json(
                          client,
                          product_api_url(page),
                          crawlbase_session=page_session,
                      )
                  )
                  rows, total, pages = parse_page(payload, page=page)
                  if total != expected_total or pages != expected_pages:
                      fail(
                          f"{pass_name}: metadata changed on page {page}: "
                          f"got total={total},pages={pages}; "
                          f"expected total={expected_total},pages={expected_pages}"
                      )
                  expected_items = (
                      PAGE_SIZE
                      if page < expected_pages
                      else expected_total - PAGE_SIZE * (expected_pages - 1)
                  )
                  if len(rows) != expected_items:
                      fail(
                          f"{pass_name}: page {page} size {len(rows)} does not equal "
                          f"expected {expected_items}"
                      )

                  records = page_identity_records(rows, pass_name=pass_name, page=page)
                  for external_id, canonical_url in records:
                      if external_id in seen_ids:
                          fail(f"{pass_name}: duplicate product ID on page {page}")
                      if canonical_url in seen_urls:
                          fail(f"{pass_name}: duplicate canonical product URL on page {page}")
                      seen_ids.add(external_id)
                      seen_urls.add(canonical_url)
                  page_records.append(records)

              if len(seen_ids) != expected_total or len(seen_urls) != expected_total:
                  fail(
                      f"{pass_name}: unique coverage is incomplete: "
                      f"ids={len(seen_ids)}, urls={len(seen_urls)}, total={expected_total}"
                  )
              return CatalogPass(
                  total=expected_total,
                  pages=expected_pages,
                  page_records=tuple(page_records),
                  ids=frozenset(seen_ids),
                  urls=frozenset(seen_urls),
                  session_chunks=len(catalog_sessions),
              )


          async def sitemap_product_urls(
              client: httpx.AsyncClient,
              *,
              crawlbase_session: str,
          ) -> tuple[frozenset[str], int]:
              index_url = f"{BASE_URL}/sitemap.xml"
              index_locs = list(
                  xml_locs(
                      await crawlbase_xml(
                          client,
                          index_url,
                          crawlbase_session=crawlbase_session,
                      )
                  )
              )
              child_maps: set[str] = set()
              for location in index_locs:
                  child_map = same_origin_sitemap_url(location)
                  if child_map is None:
                      fail(f"sitemap index points outside canonical site: {location!r}")
                  if PRODUCT_SITEMAP_RE.search(urlsplit(child_map).path):
                      child_maps.add(child_map)
              if not child_maps:
                  fail("product sitemap index contains no product child maps")

              product_urls: set[str] = set()
              duplicate_product_url_entries = 0
              for child_map in sorted(child_maps):
                  locations = list(
                      xml_locs(
                          await crawlbase_xml(
                              client,
                              child_map,
                              crawlbase_session=crawlbase_session,
                          )
                      )
                  )
                  if not locations:
                      fail(f"empty product child sitemap: {child_map}")
                  for location in locations:
                      canonical_url = canonical_product_url(location, source_is_path=False)
                      if canonical_url is None:
                          fail(
                              f"invalid product URL in product child sitemap {child_map}: {location!r}"
                          )
                      if canonical_url in product_urls:
                          # Pharmonline can repeat an unchanged canonical
                          # product URL in multiple child sitemap files. The
                          # exact API-versus-sitemap set comparison below is
                          # still the coverage proof; this only ignores a
                          # duplicate source entry.
                          duplicate_product_url_entries += 1
                          continue
                      product_urls.add(canonical_url)
              if not product_urls:
                  fail("product sitemaps contain no canonical product URLs")
              return frozenset(product_urls), duplicate_product_url_entries


          def verify_read_only_database_identity(
              catalog: CatalogPass,
          ) -> tuple[int, int, float, int]:
              """Prove all current API ID→URL pairs are trusted DDP lineage.

              A deterministic sample cannot safely establish that thousands of
              public IDs still belong to the same records. Read every current
              Pharmonline product under a read-only transaction and apply the
              same fail-closed set proof as the write-enabled recovery command.
              Current DDP fields and immutable DDP offer observations both
              establish lineage, so a retry remains safe after a previous
              public-API write updated the mutable current source. DDP-only
              history is allowed as a delisting, but coverage must remain at
              least 98 percent.
              """
              api_by_id = {
                  external_id: canonical_url
                  for page in catalog.page_records
                  for external_id, canonical_url in page
              }
              if (
                  len(api_by_id) != catalog.total
                  or len(set(api_by_id.values())) != catalog.total
              ):
                  fail("internal preflight API identity coverage mismatch")
              engine = create_engine(
                  os.environ["DATABASE_URL"],
                  # The session setting protects this connection even if a
                  # future edit accidentally adds a mutating SQL statement.
                  connect_args={"options": "-c default_transaction_read_only=on"},
              )
              try:
                  with engine.connect() as connection:
                      transaction = connection.begin()
                      try:
                          connection.execute(text("SET TRANSACTION READ ONLY"))
                          read_only = connection.execute(
                              text("SHOW transaction_read_only")
                          ).scalar_one()
                          if str(read_only).lower() not in {"on", "true", "1"}:
                              fail("database transaction did not enter read-only mode")
                          rows = connection.execute(
                              text(
                                  """
                                  SELECT p.id, p.external_id, p.url,
                                         p.availability_source,
                                         EXISTS (
                                             SELECT 1
                                             FROM offer_observations AS oo
                                             WHERE oo.tenant_id = p.tenant_id
                                               AND oo.product_id = p.id
                                               AND oo.availability_source = :ddp_source
                                         ) AS has_ddp_history
                                  FROM products AS p
                                  WHERE p.tenant_id = :tenant_id
                                    AND p.site = 'pharmonline'
                                  """
                              ),
                              {
                                  "tenant_id": 1,
                                  "ddp_source": DDP_AVAILABILITY_SOURCE,
                              },
                          ).mappings().all()
                      finally:
                          # Explicitly roll back the read-only transaction;
                          # this workflow never commits a database change.
                          transaction.rollback()
              finally:
                  engine.dispose()

              trusted_by_id: dict[str, dict] = {}
              all_by_id: dict[str, list[dict]] = {}
              all_by_url: dict[str, list[dict]] = {}
              invalid_trusted = 0
              duplicate_trusted_ids = 0
              trusted_history_products = 0
              for row in rows:
                  external_id = text_value(row["external_id"])
                  canonical_url = canonical_stored_product_url(row["url"])
                  if external_id is not None:
                      all_by_id.setdefault(external_id, []).append(row)
                  if canonical_url is not None:
                      all_by_url.setdefault(canonical_url, []).append(row)
                  has_ddp_history = bool(row["has_ddp_history"])
                  if has_ddp_history:
                      trusted_history_products += 1
                  if (
                      row["availability_source"] != DDP_AVAILABILITY_SOURCE
                      and not has_ddp_history
                  ):
                      continue
                  if (
                      external_id is None
                      or METEOR_ID_RE.fullmatch(external_id) is None
                      or canonical_url is None
                  ):
                      invalid_trusted += 1
                      continue
                  if external_id in trusted_by_id:
                      duplicate_trusted_ids += 1
                      continue
                  trusted_by_id[external_id] = row

              api_ids = set(api_by_id)
              trusted_ids = set(trusted_by_id)
              missing_trusted_ids = api_ids - trusted_ids
              retired_trusted_ids = trusted_ids - api_ids
              mismatched_urls = 0
              id_collisions = 0
              url_collisions = 0
              for external_id, canonical_url in api_by_id.items():
                  trusted = trusted_by_id.get(external_id)
                  if trusted is not None and (
                      canonical_stored_product_url(trusted["url"]) != canonical_url
                  ):
                      mismatched_urls += 1
                  id_rows = all_by_id.get(external_id, [])
                  if (
                      trusted is None
                      or len(id_rows) != 1
                      or id_rows[0]["id"] != trusted["id"]
                  ):
                      id_collisions += 1
                  url_rows = all_by_url.get(canonical_url, [])
                  if (
                      trusted is None
                      or len(url_rows) != 1
                      or url_rows[0]["id"] != trusted["id"]
                  ):
                      url_collisions += 1

              trusted_coverage = len(api_ids) / len(trusted_ids) if trusted_ids else 0.0
              if (
                  invalid_trusted
                  or duplicate_trusted_ids
                  or missing_trusted_ids
                  or mismatched_urls
                  or id_collisions
                  or url_collisions
                  or trusted_coverage < MIN_TRUSTED_COVERAGE
              ):
                  fail(
                      "public API does not map exactly to existing DDP identities: "
                      f"api_ids={len(api_ids)}, trusted_ids={len(trusted_ids)}, "
                      f"invalid_trusted={invalid_trusted}, "
                      f"duplicate_trusted_ids={duplicate_trusted_ids}, "
                      f"missing_trusted_ids={len(missing_trusted_ids)}, "
                      f"retired_trusted_ids={len(retired_trusted_ids)}, "
                      f"trusted_coverage={trusted_coverage:.4f}, "
                      f"mismatched_urls={mismatched_urls}, "
                      f"id_collisions={id_collisions}, url_collisions={url_collisions}"
                  )
              return (
                  len(api_ids),
                  len(trusted_ids),
                  trusted_coverage,
                  trusted_history_products,
              )


          async def main() -> None:
              timeout = httpx.Timeout(120.0, connect=20.0)
              async with httpx.AsyncClient(timeout=timeout) as client:
                  first_pass = await enumerate_catalog(client, pass_name="first pass")
                  second_pass = await enumerate_catalog(client, pass_name="second pass")
                  if (
                      first_pass.total != second_pass.total
                      or first_pass.pages != second_pass.pages
                      or first_pass.page_records != second_pass.page_records
                      or first_pass.ids != second_pass.ids
                      or first_pass.urls != second_pass.urls
                  ):
                      fail(
                          "two complete name_asc enumerations are not identical page-by-page; "
                          "the source is not stable enough to recover"
                      )

                  sitemap_urls, sitemap_duplicate_entries = await sitemap_product_urls(
                      client,
                      crawlbase_session=SITEMAP_SESSION,
                  )
              if sitemap_urls != first_pass.urls:
                  fail(
                      "public API and product sitemap URL sets differ: "
                      f"api={len(first_pass.urls)}, sitemap={len(sitemap_urls)}, "
                      f"api_only={len(first_pass.urls - sitemap_urls)}, "
                      f"sitemap_only={len(sitemap_urls - first_pass.urls)}"
                  )

              (
                  api_identity_count,
                  trusted_identity_count,
                  trusted_coverage,
                  trusted_history_products,
              ) = verify_read_only_database_identity(first_pass)
              print(
                  "Pharmonline public API full preflight OK: "
                  f"sort_by={SORT_BY}, total={first_pass.total}, pages={first_pass.pages}, "
                  f"page_size={PAGE_SIZE}, two_passes=identical, "
                  f"sitemap_urls={len(sitemap_urls)}, "
                  f"sitemap_duplicate_entries={sitemap_duplicate_entries}, "
                  f"api_identities={api_identity_count}, "
                  f"trusted_ddp_identities={trusted_identity_count}, "
                  f"trusted_ddp_history_products={trusted_history_products}, "
                  f"trusted_coverage={trusted_coverage:.4f}, "
                  "crawlbase_sessions=short_chunks, "
                  f"catalog_session_page_span={CATALOG_SESSION_PAGE_SPAN}, "
                  f"catalog_session_chunks_per_pass={first_pass.session_chunks}, "
                  f"origin_contexts={origin_context_evidence()}, "
                  f"transport_retries={TRANSIENT_TRANSPORT_RETRIES}, "
                  "database_transaction=read_only, persistence=none"
              )


          asyncio.run(main())
          PY

      - name: Close SSH tunnel
        if: always()
        run: |
          if [ -n "${TUNNEL_PID:-}" ]; then
            kill "$TUNNEL_PID" 2>/dev/null || true
          fi
