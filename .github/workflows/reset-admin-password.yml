name: Reset production admin password

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Exact admin email to update"
        type: string
        required: true

permissions:
  contents: read

jobs:
  reset:
    name: Update one active admin password hash
    runs-on: ubuntu-latest
    concurrency:
      group: reset-prod-admin-password
      cancel-in-progress: false
    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::secret SSH_PRIVATE_KEY is empty/unset"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Reset admin password hash
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          PASSWORD_HASH: ${{ secrets.TEMP_ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          if [ -z "$PASSWORD_HASH" ]; then
            echo "::error::secret TEMP_ADMIN_PASSWORD_HASH is empty/unset"
            exit 1
          fi
          echo "::add-mask::$PASSWORD_HASH"
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            'bash -s' -- "$ADMIN_EMAIL" "$PASSWORD_HASH" <<'REMOTE'
          set -euo pipefail
          export ADMIN_EMAIL="$1"
          export PASSWORD_HASH="$2"
          cd /opt/pharmacy-monitor
          /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          admin_email = os.environ["ADMIN_EMAIL"].strip().lower()
          password_hash = os.environ["PASSWORD_HASH"].strip()
          if not admin_email or "@" not in admin_email:
              raise SystemExit("invalid admin email")
          if not password_hash.startswith(("$2a$", "$2b$", "$2y$")):
              raise SystemExit("invalid bcrypt hash")

          with open("/etc/pharmacy-monitor/env") as env_file:
              for line in env_file:
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  os.environ.setdefault(key, value.strip().strip('"').strip("'"))

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              rows = conn.execute(
                  text(
                      """
                      update tenant_users
                         set password_hash = :password_hash
                       where lower(email) = :admin_email
                         and role = 'admin'
                         and is_active is true
                      returning id, email
                      """
                  ),
                  {"password_hash": password_hash, "admin_email": admin_email},
              ).fetchall()
              if len(rows) != 1:
                  raise SystemExit(f"expected exactly one active admin, updated {len(rows)}")
              row = rows[0]
              print(f"updated admin user #{row.id}: {row.email}")
          PY
          REMOTE
