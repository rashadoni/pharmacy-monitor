name: Probe Pharmonline via Crawlbase (no persistence)

# This probe exercises the live fallback route and verifies a handful of
# rendered URLs against the existing DDP catalog in a read-only transaction.
# It never creates a Run, Product or snapshot.
on:
  workflow_dispatch:
    inputs:
      category:
        description: "Pharmonline category slug for the small source probe"
        required: true
        default: "sinir-sistemi-xestelikeri"

permissions:
  contents: read

concurrency:
  group: pharmonline-crawlbase-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          playwright install chromium --with-deps

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 13.140.186.143 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Open read-only production Postgres tunnel
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -N -L 5433:localhost:5432 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 &
          echo "TUNNEL_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if nc -z localhost 5433 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "production Postgres tunnel did not come up" >&2
          exit 1

      - name: Fetch and parse a few cards without persisting anything
        env:
          DATABASE_URL: postgresql+psycopg://pm:${{ secrets.PG_PASS }}@localhost:5433/pharmacy_monitor
          CRAWLBASE_JS_TOKEN: ${{ secrets.CRAWLBASE_JS_TOKEN }}
          CRAWLBASE_API_SITES: pharmonline
          CRAWLBASE_PAGE_WAIT_MS: "4000"
          PHARMONLINE_USE_DDP: "0"
          PHARMONLINE_LEGACY_ID_BRIDGE: "required"
          PROBE_CATEGORY: ${{ inputs.category }}
        run: |
          set -euo pipefail
          test -n "$CRAWLBASE_JS_TOKEN"
          python - <<'PY'
          import asyncio
          import os
          import re
          from urllib.parse import quote, urljoin

          import httpx
          from sqlalchemy import select, text
          from src import storage
          from src.main import (
              _PHARMONLINE_DDP_AVAILABILITY_SOURCE,
              _PHARMONLINE_METEOR_ID_RE,
              _bridge_pharmonline_legacy_ids,
              _canonical_pharmonline_product_url,
          )
          from src.scrapers.pharmonline import PharmonlineScraper


          async def main() -> None:
              category = os.environ["PROBE_CATEGORY"]
              target_url = f"https://pharmonline.az/products?category={quote(category, safe='')}"
              async def fetch_rendered(url: str, **render_options):
                  request_params = {
                      "token": os.environ["CRAWLBASE_JS_TOKEN"],
                      "url": url,
                      "page_wait": "4000",
                      "ajax_wait": "true",
                  }
                  request_params.update(render_options)
                  async with httpx.AsyncClient(timeout=120.0) as client:
                      return await client.get("https://api.crawlbase.com/", params=request_params)

              response = await fetch_rendered(target_url)
              html = response.text
              title_match = re.search(r"<title[^>]*>\s*(.*?)\s*</title>", html, re.I | re.S)
              title = re.sub(r"\s+", " ", title_match.group(1)).strip()[:120] if title_match else "<none>"
              lower_html = html.lower()
              signals = [
                  signal
                  for signal in ("cloudflare", "captcha", "access denied", "rate limit", "crawlbase error")
                  if signal in lower_html
              ]
              class_values = re.findall(r'\bclass=["\']([^"\']+)["\']', html, re.I)
              legacy_card_markers = sum(
                  "product_box_v2" in raw_classes.split() for raw_classes in class_values
              )
              current_card_markers = sum(
                  "product_box" in raw_classes.split() for raw_classes in class_values
              )
              card_markers = legacy_card_markers + current_card_markers
              class_tokens = sorted(
                  {
                      token
                      for raw_classes in re.findall(r'\bclass=["\']([^"\']+)["\']', html, re.I)
                      for token in raw_classes.split()
                      if any(
                          word in token.lower()
                          for word in ("product", "card", "basket", "favorite", "price")
                      )
                  }
              )
              data_attributes = sorted(set(re.findall(r'\b(data-[\w-]+)=', html, re.I)))
              print(
                  "Crawlbase response profile: "
                  f"http={response.status_code}, bytes={len(html)}, title={title!r}, "
                  f"card_markers={card_markers} (legacy={legacy_card_markers}, current={current_card_markers}), "
                  f"product_hrefs={html.count('/product/')}, "
                  f"data_id_count={html.count('data-id=')}, signals={signals or ['none']}"
              )
              print(f"Crawlbase structural classes: {class_tokens[:80]}")
              print(f"Crawlbase data attributes: {data_attributes[:80]}")
              if response.status_code != 200 or card_markers == 0:
                  raise SystemExit("Crawlbase did not return a rendered Pharmonline category page")

              # The current React storefront no longer follows the old
              # ``?page=N`` contract reliably.  Keep this as a bounded,
              # public-only diagnostic: it reveals pagination evidence and
              # whether a requested second page has a different item set,
              # without storing an item or creating a Run.
              page_two_url = f"{target_url}&page=2"
              page_two_response = await fetch_rendered(page_two_url)
              page_two_html = page_two_response.text
              scroll_response = await fetch_rendered(
                  target_url,
                  scroll="true",
                  scroll_interval="20",
              )
              scroll_html = scroll_response.text

              def product_urls(document: str) -> list[str]:
                  values = re.findall(
                      r'''href=["']([^"']*(?:/|^)product/[^"'#?]+)[^"']*["']''',
                      document,
                      re.I,
                  )
                  return sorted(set(values))

              def pagination_hints(document: str) -> list[str]:
                  hints: list[str] = []
                  for key in (
                      "currentPage",
                      "lastPage",
                      "totalPages",
                      "pageCount",
                      "totalItems",
                      "perPage",
                      "pageSize",
                  ):
                      match = re.search(
                          rf'''["']?{key}["']?\s*[:=]\s*["']?(\d+)["']?''',
                          document,
                          re.I,
                      )
                      if match:
                          hints.append(f"{key}={match.group(1)}")
                  return hints

              page_one_urls = product_urls(html)
              page_two_urls = product_urls(page_two_html)
              scroll_urls = product_urls(scroll_html)
              script_sources = sorted(
                  {
                      urljoin(target_url, src)
                      for src in re.findall(
                          r'''<script[^>]+\bsrc=["']([^"']+)["']''',
                          html,
                          re.I,
                      )
                  }
              )
              route_script_sources = [
                  source
                  for source in script_sources
                  if "/_next/static/chunks/app/" in source
              ]
              page_two_card_markers = len(
                  re.findall(
                      r'''\bclass=["']([^"']*\bproduct_box\b[^"']*)["']''',
                      page_two_html,
                      re.I,
                  )
              )
              page_links = sorted(
                  set(
                      re.findall(
                          r'''href=["']([^"']*[?&](?:page|pageNumber|page_num)=[^"']+)["']''',
                          html,
                          re.I,
                      )
                  )
              )
              button_hints = []
              for attrs, body in re.findall(
                  r"<button\b([^>]*)>(.*?)</button>", html, re.I | re.S
              ):
                  button_text = re.sub(r"<[^>]+>", " ", body)
                  button_text = re.sub(r"\s+", " ", button_text).strip()
                  class_match = re.search(r'''\bclass=["']([^"']+)''', attrs, re.I)
                  aria_match = re.search(r'''\baria-label=["']([^"']+)''', attrs, re.I)
                  if button_text or aria_match:
                      button_hints.append(
                          {
                              "text": button_text[:80],
                              "class": class_match.group(1)[:120] if class_match else None,
                              "aria": aria_match.group(1)[:80] if aria_match else None,
                          }
                      )
              print(
                  "Crawlbase pagination diagnostic: "
                  f"page1_cards={card_markers}, page1_urls={len(page_one_urls)}, "
                  f"page2_http={page_two_response.status_code}, "
                  f"page2_cards={page_two_card_markers}, "
                  f"page2_urls={len(page_two_urls)}, "
                  f"overlap={len(set(page_one_urls) & set(page_two_urls))}, "
                  f"page1_hints={pagination_hints(html)}, "
                  f"page2_hints={pagination_hints(page_two_html)}, "
                  f"page_links={page_links[:20]}, "
                  f"scroll_http={scroll_response.status_code}, "
                  f"scroll_urls={len(scroll_urls)}, "
                  f"scroll_added={len(set(scroll_urls) - set(page_one_urls))}, "
                  f"buttons={button_hints[:20]}, "
                  f"route_scripts={route_script_sources[:30]}"
              )

              async with PharmonlineScraper() as scraper:
                  async def render_prefetched_html(page, _url, check_captcha=True):
                      # Exercise the real card/pagination parser against the one
                      # rendered response above without issuing another request.
                      await page.set_content(html, wait_until="domcontentloaded")

                  scraper.goto = render_prefetched_html
                  # The limit keeps this to one rendered page in normal cases.
                  # This invokes no storage code and cannot alter production data.
                  result = await scraper.scrape([category], limit_per_category=5)

              raw_product_ids = [product.external_id for product in result.products]
              if result.errors:
                  raise SystemExit(f"Crawlbase probe errors: {result.errors[:3]}")
              if len(raw_product_ids) < 3:
                  raise SystemExit(f"Crawlbase probe returned too few products: {len(raw_product_ids)}")
              if len(set(raw_product_ids)) != len(raw_product_ids):
                  raise SystemExit("Crawlbase probe returned duplicate product IDs")

              route = result.route_statuses.get(category)
              if route is None or route.abort_reason != "requested_limit_reached":
                  raise SystemExit("Crawlbase probe did not record the bounded-route guard")

              # The bridge uses only SELECTs and updates only in-memory
              # ScrapedProduct objects. Postgres additionally refuses any
              # accidental write in this probe's transaction.
              Session = storage.make_session()
              with Session() as session:
                  session.execute(text("SET TRANSACTION READ ONLY"))
                  try:
                      existing = session.scalars(
                          select(storage.Product).where(
                              storage.Product.site == "pharmonline",
                              storage.Product.tenant_id == 1,
                          )
                      ).all()
                      for product in result.products:
                          canonical_url = _canonical_pharmonline_product_url(product.url)
                          url_matches = [
                              row
                              for row in existing
                              if _canonical_pharmonline_product_url(row.url) == canonical_url
                              and _PHARMONLINE_METEOR_ID_RE.fullmatch(str(row.external_id))
                          ]
                          confirmed_ids = sorted(
                              {
                                  str(row.external_id)
                                  for row in url_matches
                                  if row.availability_source
                                  == _PHARMONLINE_DDP_AVAILABILITY_SOURCE
                              }
                          )
                          print(
                              "Crawlbase bridge diagnostic: "
                              f"raw_url={product.url}, canonical_url={canonical_url}, "
                              f"meteor_url_matches={len(url_matches)}, "
                              f"ddp_confirmed_matches={len(confirmed_ids)}"
                          )
                      bridged = _bridge_pharmonline_legacy_ids(
                          session,
                          [result],
                          tenant_id=1,
                      )
                  finally:
                      session.rollback()

              product_ids = [product.external_id for product in result.products]
              if bridged != len(product_ids):
                  raise SystemExit("Crawlbase probe did not bridge every rendered card")
              if not all(re.fullmatch(r"[A-Za-z0-9]{17}", product_id) for product_id in product_ids):
                  raise SystemExit("Crawlbase bridge returned a non-Meteor product ID")
              identity_source = (
                  "rendered_meteor_id"
                  if all(re.fullmatch(r"[A-Za-z0-9]{17}", product_id) for product_id in raw_product_ids)
                  else "url_to_existing_ddp_id"
              )
              print(
                  f"Crawlbase source probe OK: category={category}, "
                  f"products={len(product_ids)}, identity_source={identity_source}, "
                  "database_transaction=read_only"
              )


          asyncio.run(main())
          PY

      - name: Close SSH tunnel
        if: always()
        run: |
          if [ -n "${TUNNEL_PID:-}" ]; then
            kill "$TUNNEL_PID" 2>/dev/null || true
          fi
