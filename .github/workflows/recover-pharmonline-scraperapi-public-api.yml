name: Recover Pharmonline catalog via verified ScraperAPI public API

# The write-enabled ScraperAPI recovery is deliberately separate from the
# regular production source tree. It may run only after the matching exact-SHA
# no-write proof and executes that exact, fully staged source in a temporary
# directory, leaving the running service code untouched.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECOVER to start the verified ScraperAPI recovery"
        required: true
        default: ""
      preflight_run_id:
        description: "Successful ScraperAPI no-write preflight run ID for this commit"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: pharmonline-scraperapi-public-api-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require explicit recovery confirmation and matching preflight
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RECOVER"
          case "$PREFLIGHT_RUN_ID" in
            ''|*[!0-9]*)
              echo "preflight_run_id must be a numeric GitHub Actions run ID" >&2
              exit 1
              ;;
          esac
          metadata=$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,workflowName,headSha \
            --jq '[.conclusion, .workflowName, .headSha] | @tsv')
          IFS=$'\t' read -r conclusion workflow_name head_sha <<EOF
          $metadata
          EOF
          test "$conclusion" = "success"
          test "$workflow_name" = \
            "Preflight full Pharmonline ScraperAPI public API recovery (no persistence)"
          test "$head_sha" = "$GITHUB_SHA"
          ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          case "$ci_run_id" in
            ''|*[!0-9]*)
              echo "a successful Pharmacy Monitor CI run is required for this commit" >&2
              exit 1
              ;;
          esac
          echo "matching_ci_run_id=$ci_run_id"

      - uses: actions/checkout@v4

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDVrem8NrMZMjV9cDiB8/8wOwOn1wrfSU7S5vfaLHM+R' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:Hx7TYOZC2diIb6ZwI9LRv4bybasYCijb+lKnQQmGk/I'

      - name: Check production capacity and scraper state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          for unit in \
            pharmacy-monitor-scrape@pharmonline.service \
            pharmacy-monitor-health.service
          do
            if systemctl is-active --quiet "$unit"; then
              echo "refusing recovery: $unit is active" >&2
              exit 1
            fi
          done
          REMOTE

      - name: Stage exact source and run verified ScraperAPI recovery
        run: |
          set -euo pipefail
          source_manifest=$(mktemp)
          trap 'rm -f "$source_manifest"' EXIT
          git ls-files -z -- src |
            xargs -0 sha256sum | LC_ALL=C sort > "$source_manifest"
          test -s "$source_manifest"
          source_manifest_sha=$(sha256sum "$source_manifest" | awk '{print $1}')
          remote_work_dir=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          work_dir=$(mktemp -d /opt/pharmacy-monitor/.codex-scraperapi-recovery.XXXXXX)
          mkdir -p "$work_dir/incoming" "$work_dir/runtime/src"
          printf '%s' "$work_dir"
          REMOTE
          )
          case "$remote_work_dir" in
            /opt/pharmacy-monitor/.codex-scraperapi-recovery.*) ;;
            *)
              echo "unexpected remote ScraperAPI recovery path" >&2
              exit 1
              ;;
          esac
          echo "REMOTE_WORK_DIR=$remote_work_dir" >> "$GITHUB_ENV"
          echo "REMOTE_SOURCE_MANIFEST_SHA=$source_manifest_sha" >> "$GITHUB_ENV"

          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            src/ "pm@13.140.186.143:$remote_work_dir/runtime/src/"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            "$source_manifest" "pm@13.140.186.143:$remote_work_dir/incoming/source-manifest"

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            "bash -s -- '$remote_work_dir' '$source_manifest_sha'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          source_manifest_sha=$2
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-scraperapi-recovery.*) ;;
            *)
              echo "unexpected remote ScraperAPI recovery path" >&2
              exit 1
              ;;
          esac

          runtime_dir="$work_dir/runtime"
          test "$(sha256sum "$work_dir/incoming/source-manifest" | awk '{print $1}')" = \
            "$source_manifest_sha"
          (cd "$runtime_dir" && sha256sum -c "$work_dir/incoming/source-manifest" >/dev/null)
          echo "exact staged source manifest verified"

          cd "$runtime_dir"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<PY
          from pathlib import Path

          import src.main
          import src.scrapers.base
          from src.main import _verify_pharmonline_public_api_identities
          from src.scrapers.pharmonline_public_api import PharmonlinePublicAPIScraper

          runtime = Path("$runtime_dir").resolve()
          assert Path(src.main.__file__).resolve().is_relative_to(runtime)
          assert Path(src.scrapers.base.__file__).resolve().is_relative_to(runtime)
          assert callable(_verify_pharmonline_public_api_identities)
          assert PharmonlinePublicAPIScraper.__name__ == "PharmonlinePublicAPIScraper"
          print("isolated ScraperAPI recovery source imported")
          PY

          # EnvironmentFile values are literal systemd values, not shell code.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          before_run_id=$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          from sqlalchemy import text

          from src import storage

          Session = storage.make_session()
          with Session() as session:
              print(
                  session.execute(
                      text("SELECT COALESCE(MAX(id), 0) FROM runs WHERE tenant_id = 1")
                  ).scalar_one()
              )
          PY
          )
          case "$before_run_id" in
            ''|*[!0-9]*)
              echo "could not determine prior production run ID" >&2
              exit 1
              ;;
          esac

          PHARMONLINE_PUBLIC_API=required \
          PHARMONLINE_PUBLIC_API_TRANSPORT=scraperapi \
          PHARMONLINE_USE_DDP=0 \
          AI_FALLBACK_ENABLED=0 \
          SCRAPE_REPORT_EMAIL=0 \
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH="$runtime_dir" \
          /opt/pharmacy-monitor/.venv/bin/pharmacy-monitor run \
            --site pharmonline \
            --mode public_api \
            --dry-run \
            --no-alerts

          BEFORE_RUN_ID="$before_run_id" PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          import json
          import os

          from sqlalchemy import text

          from src import storage

          before_run_id = int(os.environ["BEFORE_RUN_ID"])
          Session = storage.make_session()
          with Session() as session:
              row = session.execute(
                  text(
                      """
                      SELECT id, status, catalog_scope, catalog_verified,
                             catalog_verification_reason, products_scraped,
                             products_per_site, run_quality
                      FROM runs
                      WHERE tenant_id = 1
                        AND full_catalog_sites = 'pharmonline'
                        AND id > :before_run_id
                      ORDER BY id DESC
                      LIMIT 1
                      """
                  ),
                  {"before_run_id": before_run_id},
              ).mappings().one_or_none()

          if row is None:
              raise SystemExit("no Pharmonline full-catalog run was created")
          quality = row["run_quality"] or {}
          site_quality = (quality.get("sites") or {}).get("pharmonline") or {}
          evidence = {
              "run_id": row["id"],
              "status": row["status"],
              "catalog_scope": row["catalog_scope"],
              "catalog_verified": bool(row["catalog_verified"]),
              "catalog_verification_reason": row["catalog_verification_reason"],
              "products_scraped": row["products_scraped"],
              "pharmonline_products": (row["products_per_site"] or {}).get("pharmonline"),
              "quality_status": site_quality.get("status"),
              "full_catalog_verified": quality.get("full_catalog_verified"),
          }
          print("Recovered Pharmonline ScraperAPI run evidence: " + json.dumps(evidence, sort_keys=True))
          if (
              row["status"] != "ok"
              or row["catalog_scope"] != "full"
              or not row["catalog_verified"]
              or quality.get("full_catalog_verified") is not True
              or site_quality.get("status") != "ok"
              or int(row["products_scraped"] or 0) < 1
          ):
              raise SystemExit("recovery did not produce a verified successful Pharmonline catalog")
          PY

          : > "$work_dir/recovered_catalog_verified"
          echo "verified ScraperAPI recovery completed from isolated source"
          REMOTE

      - name: Confirm isolated recovery evidence
        if: ${{ always() && env.REMOTE_WORK_DIR != '' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            "bash -s -- '$REMOTE_WORK_DIR' '$REMOTE_SOURCE_MANIFEST_SHA'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          source_manifest_sha=$2
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-scraperapi-recovery.*) ;;
            *)
              echo "unexpected remote ScraperAPI recovery path" >&2
              exit 1
              ;;
          esac
          test "$(sha256sum "$work_dir/incoming/source-manifest" | awk '{print $1}')" = \
            "$source_manifest_sha"
          if [ -f "$work_dir/recovered_catalog_verified" ]; then
            echo "isolated ScraperAPI recovery evidence retained"
          else
            echo "recovery did not complete; isolated source retained for audit" >&2
          fi
          REMOTE
