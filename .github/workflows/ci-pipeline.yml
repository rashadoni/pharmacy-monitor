name: Pharmacy Monitor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check (new Python files)
        env:
          # Formatter-debt baseline: files that existed here may still need a
          # one-off cleanup. Every Python file added after this SHA is checked
          # on every CI run, including follow-up commits and workflow_dispatch.
          FORMAT_BASE_SHA: 52825fe4df57718fed382931c41e8501f878ab45
        run: |
          set -euo pipefail
          git cat-file -e "$FORMAT_BASE_SHA^{commit}"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          git diff --name-only -z --diff-filter=A "$FORMAT_BASE_SHA" HEAD -- '*.py' > "$tmp"
          if [ ! -s "$tmp" ]; then
            echo "No new Python files to format-check (legacy formatter debt is tracked separately)."
            exit 0
          fi
          printf 'Format-checking new Python files:\n'
          xargs -0 -n1 printf ' - %s\n' < "$tmp"
          xargs -0 uv run ruff format --check -- < "$tmp"

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm
          POSTGRES_DB: pharmacy_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pm:pm@localhost:5432/pharmacy_monitor_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-very-long-not-for-prod
      PHARMACY_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (with dev)
        run: uv sync --frozen --all-groups
      - name: Install Playwright Chromium (for test_scrapers_snapshot.py)
        run: uv run playwright install chromium --with-deps
      - name: Run alembic migrations
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck
      - name: Build
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm build
