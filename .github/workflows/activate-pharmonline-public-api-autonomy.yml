name: Activate autonomous Pharmonline public API dispatch

# One guarded activation for the root-owned legacy timer.  The production
# service command cannot be edited by the deployment user, so this writes an
# explicit marker only after the current, CI-verified source has been copied
# with a retained rollback snapshot.  The generic systemd command then enters
# public_api mode only for its single-site auto invocation.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pharmonline-decodo-public-api-recovery
  cancel-in-progress: false

jobs:
  activate:
    name: Activate verified public API for the Pharmonline timer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Require successful CI for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ci_run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          case "$ci_run_id" in
            ''|null|*[!0-9]*)
              echo 'no successful CI run exists for this exact source revision' >&2
              exit 1
              ;;
          esac
          echo "verified_ci_run_id=$ci_run_id"

      - name: Set up pinned production SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Check production capacity and inactive writers
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))
          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')
          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          for unit in \
            pharmacy-monitor-scrape@pharmonline.service \
            pharmacy-monitor-health.service
          do
            active=$(systemctl show "$unit" -p ActiveState --value)
            case "$active" in
              inactive|failed) ;;
              *) echo "refusing activation: $unit state=$active" >&2; exit 1 ;;
            esac
          done
          test -w /opt/pharmacy-monitor/src
          test -w /opt/pharmacy-monitor/data
          REMOTE

      - name: Stage checksum-verified activation source
        id: stage
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          git ls-files -z -- src migrations templates alembic.ini |
            xargs -0 sha256sum | LC_ALL=C sort > "$manifest"
          test -s "$manifest"

          work_dir=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'mktemp -d /opt/pharmacy-monitor/.codex-pharmonline-activate.XXXXXX')
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-pharmonline-activate.*) ;;
            *) echo 'unexpected remote staging path' >&2; exit 1 ;;
          esac
          echo "work_dir=$work_dir" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            "mkdir -p '$work_dir/runtime/src' '$work_dir/runtime/migrations' '$work_dir/runtime/templates' '$work_dir/incoming'"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            src/ "pm@13.140.186.143:$work_dir/runtime/src/"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            migrations/ "pm@13.140.186.143:$work_dir/runtime/migrations/"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            templates/ "pm@13.140.186.143:$work_dir/runtime/templates/"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            alembic.ini "pm@13.140.186.143:$work_dir/runtime/alembic.ini"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            "$manifest" "pm@13.140.186.143:$work_dir/incoming/source-manifest"

      - name: Back up source, activate marker, and verify the dispatch
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            "bash -s -- '$WORK_DIR' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'" <<'REMOTE'
          set -Eeuo pipefail
          work_dir=$1
          run_id=$2
          run_attempt=$3
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-pharmonline-activate.*) ;;
            *) echo 'unexpected remote staging path' >&2; exit 1 ;;
          esac
          case "$run_id:$run_attempt" in
            *[!0-9:]*|:) echo 'invalid activation run identity' >&2; exit 1 ;;
          esac

          runtime_dir="$work_dir/runtime"
          backup_dir="/opt/pharmacy-monitor/data/hotfix-backups/pharmonline-public-api-$run_id-$run_attempt"
          marker=/opt/pharmacy-monitor/data/pharmonline-public-api-autonomous-v1
          marker_backup="$backup_dir/marker.before"
          marker_existed=0
          rollback() {
            status=$?
            trap - ERR INT TERM
            set +e
            if [ -d "$backup_dir/src" ]; then
              rsync -a --delete --exclude='__pycache__/' "$backup_dir/src/" /opt/pharmacy-monitor/src/
              rsync -a --delete --exclude='__pycache__/' "$backup_dir/migrations/" /opt/pharmacy-monitor/migrations/
              rsync -a --delete --exclude='__pycache__/' "$backup_dir/templates/" /opt/pharmacy-monitor/templates/
              cp -p "$backup_dir/alembic.ini" /opt/pharmacy-monitor/alembic.ini
            fi
            if [ "$marker_existed" -eq 1 ] && [ -f "$marker_backup" ]; then
              cp -p "$marker_backup" "$marker"
            elif [ "$marker_existed" -eq 0 ]; then
              rm -f -- "$marker"
            fi
            exit "$status"
          }
          trap rollback ERR INT TERM

          test -s "$work_dir/incoming/source-manifest"
          cd "$runtime_dir"
          sha256sum -c "$work_dir/incoming/source-manifest"

          mkdir -p "$backup_dir"
          rsync -a --delete --exclude='__pycache__/' /opt/pharmacy-monitor/src/ "$backup_dir/src/"
          rsync -a --delete --exclude='__pycache__/' /opt/pharmacy-monitor/migrations/ "$backup_dir/migrations/"
          rsync -a --delete --exclude='__pycache__/' /opt/pharmacy-monitor/templates/ "$backup_dir/templates/"
          cp -p /opt/pharmacy-monitor/alembic.ini "$backup_dir/alembic.ini"
          if [ -f "$marker" ]; then
            marker_existed=1
            cp -p "$marker" "$marker_backup"
          fi

          # The normal deploy intentionally does not delete unknown live
          # source files.  This preserves operator-owned additions while
          # replacing every tracked runtime module as one delayed update set.
          rsync -a --checksum --delay-updates --exclude='__pycache__/' \
            "$runtime_dir/src/" /opt/pharmacy-monitor/src/
          rsync -a --checksum --delay-updates --exclude='__pycache__/' \
            "$runtime_dir/migrations/" /opt/pharmacy-monitor/migrations/
          rsync -a --checksum --delay-updates --exclude='__pycache__/' \
            "$runtime_dir/templates/" /opt/pharmacy-monitor/templates/
          cp -p "$runtime_dir/alembic.ini" /opt/pharmacy-monitor/alembic.ini

          cd /opt/pharmacy-monitor
          sha256sum -c "$work_dir/incoming/source-manifest"
          /opt/pharmacy-monitor/.venv/bin/python -m py_compile \
            src/main.py \
            src/storage.py \
            src/scrapers/pharmonline_public_api.py

          probe_marker="$work_dir/dispatch-probe-marker"
          printf '%s\n' 'pharmonline_public_api_autonomous_v1' > "$probe_marker"
          PHARMONLINE_PUBLIC_API_AUTONOMOUS_MARKER="$probe_marker" \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          import os
          from src.main import (
              _enable_pharmonline_public_api_autonomous_mode,
              _pharmonline_public_api_autonomous_mode_requested,
              _pharmonline_public_api_enabled,
          )

          assert _pharmonline_public_api_autonomous_mode_requested(
              ["pharmonline"], "auto"
          )
          assert not _pharmonline_public_api_autonomous_mode_requested(
              ["pharmonline", "aloe"], "auto"
          )
          _enable_pharmonline_public_api_autonomous_mode()
          assert _pharmonline_public_api_enabled()
          assert os.environ["PHARMONLINE_PUBLIC_API_TRANSPORT"] == "decodo"
          assert os.environ["PHARMONLINE_USE_DDP"] == "0"
          assert os.environ["AI_FALLBACK_ENABLED"] == "0"
          PY

          marker_tmp=$(mktemp "${marker}.tmp.XXXXXX")
          printf '%s\n' 'pharmonline_public_api_autonomous_v1' > "$marker_tmp"
          chmod 600 "$marker_tmp"
          mv -f "$marker_tmp" "$marker"
          test "$(cat "$marker")" = 'pharmonline_public_api_autonomous_v1'

          # Verify the exact source that systemd resolves from its documented
          # WorkingDirectory and the real, default marker path.  This prevents
          # a marker left behind by a future deployment from silently reviving
          # the legacy DDP mode.
          cd /opt/pharmacy-monitor
          env -u PYTHONPATH -u PHARMONLINE_PUBLIC_API_AUTONOMOUS_MARKER \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          from pathlib import Path

          from src import main

          expected = Path('/opt/pharmacy-monitor/src/main.py').resolve()
          actual = Path(main.__file__).resolve()
          assert actual == expected, f'expected deployed main.py {expected}, got {actual}'
          assert main._pharmonline_public_api_autonomous_mode_requested(
              ['pharmonline'], 'auto'
          )
          PY
          echo "autonomous_public_api_marker=$marker"
          echo "retained_rollback_backup=$backup_dir"
          trap - ERR INT TERM
          REMOTE

      - name: Remove isolated activation staging
        if: ${{ always() && steps.stage.outputs.work_dir != '' }}
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 "bash -s -- '$WORK_DIR'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-pharmonline-activate.*) ;;
            *) echo 'unexpected remote staging path' >&2; exit 1 ;;
          esac
          if [ -d "$work_dir" ]; then
            rm -rf -- "$work_dir"
          fi
          REMOTE
