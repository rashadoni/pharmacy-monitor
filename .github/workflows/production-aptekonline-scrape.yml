name: Production aptekonline full scrape

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: production-aptekonline-scrape
      cancel-in-progress: false
    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDVrem8NrMZMjV9cDiB8/8wOwOn1wrfSU7S5vfaLHM+R' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = \
            'SHA256:Hx7TYOZC2diIb6ZwI9LRv4bybasYCijb+lKnQQmGk/I'

      - name: Run full aptekonline scrape on production
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'set -euo pipefail
            cd /opt/pharmacy-monitor
            if systemctl is-active --quiet pharmacy-monitor-scrape@aptekonline.service; then
              echo "an aptekonline systemd scrape is already running; waiting for it"
              while systemctl is-active --quiet pharmacy-monitor-scrape@aptekonline.service; do
                sleep 30
              done
              test "$(systemctl show -p Result --value pharmacy-monitor-scrape@aptekonline.service)" = success
              exit 0
            fi
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ""|\#*) continue ;;
              esac
              key=${line%%=*}
              value=${line#*=}
              export "$key=$value"
            done < /etc/pharmacy-monitor/env
            # --force: ручной запуск — явная просьба. Без него гвард недельного
            # ритма пропустил бы сбор, если aptekonline на этой неделе уже
            # собран, а шаг проверки ниже прошёл бы по старому прогону.
            .venv/bin/pharmacy-monitor run \
              --site aptekonline \
              --mode category \
              --no-alerts \
              --force'

      - name: Verify latest aptekonline catalog attempt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("https://leaddrive.cloud/health", timeout=30) as response:
              health = json.load(response)

          sites = health.get("product_policy", {}).get("sites", [])
          aptek = next((row for row in sites if row.get("site") == "aptekonline"), None)
          if aptek is None:
              raise SystemExit("aptekonline is absent from product_policy health")

          print(
              "aptekonline latest attempt:",
              aptek.get("latest_full_attempt_id"),
              aptek.get("latest_full_attempt_status"),
              aptek.get("latest_full_attempt_reason"),
          )
          if not aptek.get("latest_full_attempt_verified"):
              raise SystemExit("latest aptekonline full catalog attempt is not verified")
          PY
