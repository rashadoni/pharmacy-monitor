name: Preflight full Pharmonline Decodo public API recovery (no persistence)

# The Decodo transport runs only on production because its credentials remain
# in the production EnvironmentFile. This workflow stages the exact guarded
# source without restarting any service, executes two full read-only passes,
# and restores the previous source after every outcome.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PREFLIGHT to run the full read-only Decodo proof"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: pharmonline-decodo-public-api-recovery
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require explicit confirmation and matching CI
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PREFLIGHT"
          ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          case "$ci_run_id" in
            ''|*[!0-9]*)
              echo "a successful Pharmacy Monitor CI run is required for this commit" >&2
              exit 1
              ;;
          esac
          echo "matching_ci_run_id=$ci_run_id"

      - uses: actions/checkout@v4

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Check production capacity and scraper state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          if systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service; then
            echo "refusing preflight: a Pharmonline scrape is already active" >&2
            exit 1
          fi
          REMOTE

      - name: Back up and upload exact guarded source off-path
        run: |
          set -euo pipefail
          remote_backup=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/pharmacy-monitor
          backup_dir=$(mktemp -d /opt/pharmacy-monitor/.codex-decodo-preflight.XXXXXX)
          mkdir -p "$backup_dir/original/src/scrapers" \
            "$backup_dir/original/scripts" \
            "$backup_dir/staged/src/scrapers" \
            "$backup_dir/staged/scripts"

          backup_one() {
            relative_path=$1
            marker=$2
            target="/opt/pharmacy-monitor/$relative_path"
            original="$backup_dir/original/$relative_path"
            if [ -f "$target" ]; then
              cp -p -- "$target" "$original"
              : > "$backup_dir/$marker"
            fi
          }

          backup_one src/main.py src_main_py.preexisting
          backup_one src/scrapers/pharmonline_public_api.py public_api_py.preexisting
          backup_one scripts/preflight_pharmonline_public_api.py preflight_script_py.preexisting
          printf '%s' "$backup_dir"
          REMOTE
          )
          case "$remote_backup" in
            /opt/pharmacy-monitor/.codex-decodo-preflight.*) ;;
            *)
              echo "unexpected remote Decodo backup path" >&2
              exit 1
              ;;
          esac
          echo "REMOTE_BACKUP_DIR=$remote_backup" >> "$GITHUB_ENV"

          for file in \
            src/main.py \
            src/scrapers/pharmonline_public_api.py \
            scripts/preflight_pharmonline_public_api.py
          do
            local_sha=$(sha256sum "$file" | awk '{print $1}')
            remote_stage="$remote_backup/staged/$file"
            rsync -z --checksum --no-perms --no-owner --no-group \
              -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
              "$file" "pm@46.225.149.52:$remote_stage"
            remote_sha=$(ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              pm@46.225.149.52 "sha256sum '$remote_stage'" | awk '{print $1}')
            test "$local_sha" = "$remote_sha"
          done
          echo "REMOTE_MAIN_SHA=$(sha256sum src/main.py | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "REMOTE_PUBLIC_API_SHA=$(sha256sum src/scrapers/pharmonline_public_api.py | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "REMOTE_PREFLIGHT_SCRIPT_SHA=$(sha256sum scripts/preflight_pharmonline_public_api.py | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Atomically activate, prove, and restore source without persistence
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            "bash -s -- '$REMOTE_BACKUP_DIR' '$REMOTE_MAIN_SHA' '$REMOTE_PUBLIC_API_SHA' '$REMOTE_PREFLIGHT_SCRIPT_SHA'" <<'REMOTE'
          set -euo pipefail
          backup_dir=$1
          main_sha=$2
          public_api_sha=$3
          preflight_script_sha=$4
          case "$backup_dir" in
            /opt/pharmacy-monitor/.codex-decodo-preflight.*) ;;
            *)
              echo "unexpected remote Decodo backup path" >&2
              exit 1
              ;;
          esac

          restore_one() {
            target=$1
            original=$2
            marker=$3
            staged_sha=$4
            label=$5
            if [ -f "$backup_dir/$marker" ]; then
              if [ -f "$target" ] && cmp -s -- "$original" "$target"; then
                return 0
              fi
              if [ -f "$target" ] && \
                [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
                echo "refusing to overwrite divergent $label during rollback" >&2
                return 1
              fi
              rollback_tmp=$(mktemp "$(dirname "$target")/.${label}.rollback.XXXXXX") || return 1
              if ! cp -p -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! cmp -s -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! mv -f -- "$rollback_tmp" "$target"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              cmp -s -- "$original" "$target"
              return
            fi
            if [ ! -e "$target" ]; then
              return 0
            fi
            if [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
              echo "refusing to delete divergent $label during rollback" >&2
              return 1
            fi
            rm -f -- "$target"
            test ! -e "$target"
          }

          cleanup() {
            original_status=$?
            trap - EXIT HUP INT TERM
            set +e
            restore_status=0
            restore_one /opt/pharmacy-monitor/src/main.py \
              "$backup_dir/original/src/main.py" src_main_py.preexisting "$main_sha" main \
              || restore_status=1
            restore_one /opt/pharmacy-monitor/src/scrapers/pharmonline_public_api.py \
              "$backup_dir/original/src/scrapers/pharmonline_public_api.py" \
              public_api_py.preexisting "$public_api_sha" pharmonline_public_api \
              || restore_status=1
            restore_one /opt/pharmacy-monitor/scripts/preflight_pharmonline_public_api.py \
              "$backup_dir/original/scripts/preflight_pharmonline_public_api.py" \
              preflight_script_py.preexisting "$preflight_script_sha" preflight_script \
              || restore_status=1
            if [ "$restore_status" -eq 0 ]; then
              : > "$backup_dir/cleanup_complete"
            fi
            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            exit "$restore_status"
          }
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap cleanup EXIT

          for unit in \
            pharmacy-monitor-scrape@pharmonline.service \
            pharmacy-monitor-health.service
          do
            if systemctl is-active --quiet "$unit"; then
              echo "refusing preflight: $unit is active" >&2
              exit 1
            fi
          done

          activate_one() {
            staged=$1
            target=$2
            expected_sha=$3
            test -f "$staged"
            test "$(sha256sum "$staged" | awk '{print $1}')" = "$expected_sha"
            test "$(stat -c '%d' "$(dirname "$staged")")" = \
              "$(stat -c '%d' "$(dirname "$target")")"
            mv -f -- "$staged" "$target"
            test "$(sha256sum "$target" | awk '{print $1}')" = "$expected_sha"
          }

          activate_one "$backup_dir/staged/src/main.py" \
            /opt/pharmacy-monitor/src/main.py "$main_sha"
          activate_one "$backup_dir/staged/src/scrapers/pharmonline_public_api.py" \
            /opt/pharmacy-monitor/src/scrapers/pharmonline_public_api.py "$public_api_sha"
          activate_one "$backup_dir/staged/scripts/preflight_pharmonline_public_api.py" \
            /opt/pharmacy-monitor/scripts/preflight_pharmonline_public_api.py "$preflight_script_sha"

          cd /opt/pharmacy-monitor
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
          from src.main import _verify_pharmonline_public_api_identities
          from src.scrapers.pharmonline_public_api import PharmonlinePublicAPIScraper

          assert callable(_verify_pharmonline_public_api_identities)
          assert PharmonlinePublicAPIScraper.__name__ == "PharmonlinePublicAPIScraper"
          print("staged Decodo recovery source imported")
          PY

          # EnvironmentFile values are literal systemd values, not shell code.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          PHARMONLINE_PUBLIC_API=required \
          PHARMONLINE_PUBLIC_API_TRANSPORT=decodo \
          PHARMONLINE_USE_DDP=0 \
          AI_FALLBACK_ENABLED=0 \
          SCRAPE_REPORT_EMAIL=0 \
          PYTHONDONTWRITEBYTECODE=1 \
          .venv/bin/python scripts/preflight_pharmonline_public_api.py
          REMOTE

      - name: Confirm isolated source cleanup after every outcome
        if: ${{ always() && env.REMOTE_BACKUP_DIR != '' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            "bash -s -- '$REMOTE_BACKUP_DIR' '$REMOTE_MAIN_SHA' '$REMOTE_PUBLIC_API_SHA' '$REMOTE_PREFLIGHT_SCRIPT_SHA'" <<'REMOTE'
          set -euo pipefail
          backup_dir=$1
          main_sha=$2
          public_api_sha=$3
          preflight_script_sha=$4
          case "$backup_dir" in
            /opt/pharmacy-monitor/.codex-decodo-preflight.*) ;;
            *)
              echo "unexpected remote Decodo backup path" >&2
              exit 1
              ;;
          esac
          if [ -f "$backup_dir/cleanup_complete" ]; then
            echo "isolated source cleanup confirmed"
            exit 0
          fi

          restore_one() {
            target=$1
            original=$2
            marker=$3
            staged_sha=$4
            label=$5
            if [ -f "$backup_dir/$marker" ]; then
              if [ -f "$target" ] && cmp -s -- "$original" "$target"; then
                return 0
              fi
              if [ -f "$target" ] && \
                [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
                echo "refusing to overwrite divergent $label during fallback rollback" >&2
                return 1
              fi
              rollback_tmp=$(mktemp "$(dirname "$target")/.${label}.rollback.XXXXXX") || return 1
              if ! cp -p -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! cmp -s -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! mv -f -- "$rollback_tmp" "$target"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              cmp -s -- "$original" "$target"
              return
            fi
            if [ ! -e "$target" ]; then
              return 0
            fi
            if [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
              echo "refusing to delete divergent $label during fallback rollback" >&2
              return 1
            fi
            rm -f -- "$target"
            test ! -e "$target"
          }

          restore_status=0
          restore_one /opt/pharmacy-monitor/src/main.py \
            "$backup_dir/original/src/main.py" src_main_py.preexisting "$main_sha" main \
            || restore_status=1
          restore_one /opt/pharmacy-monitor/src/scrapers/pharmonline_public_api.py \
            "$backup_dir/original/src/scrapers/pharmonline_public_api.py" \
            public_api_py.preexisting "$public_api_sha" pharmonline_public_api \
            || restore_status=1
          restore_one /opt/pharmacy-monitor/scripts/preflight_pharmonline_public_api.py \
            "$backup_dir/original/scripts/preflight_pharmonline_public_api.py" \
            preflight_script_py.preexisting "$preflight_script_sha" preflight_script \
            || restore_status=1
          test "$restore_status" -eq 0
          : > "$backup_dir/cleanup_complete"
          echo "fallback isolated source cleanup completed"
          REMOTE
