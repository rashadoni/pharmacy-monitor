name: Deploy to Hetzner

# Деплой на прод — ТОЛЬКО ручной триггер (workflow_dispatch), как scrape.yml.
# Прод-деплой требует явного per-deploy решения (см. CLAUDE.md / security),
# поэтому НЕ on:push. Запускать из вкладки Actions → "Run workflow" ПОСЛЕ того,
# как нужный коммит в origin/main и CI на нём зелёный (infra/deploy.sh на сервере
# делает `git reset --hard origin/main`, т.е. катит именно то, что в origin/main).
#
# Чтобы включить АВТО-деплой после зелёного CI — заменить триггер на:
#   on:
#     workflow_run:
#       workflows: ["Pharmacy Monitor CI"]
#       types: [completed]
#       branches: [main]
#   jobs: { deploy: { if: ${{ github.event.workflow_run.conclusion == 'success' }}, ... } }
#
# Использует существующий секрет SSH_PRIVATE_KEY (тот же ключ, что scrape.yml).
# Заходит как root: infra/deploy.sh делает `sudo systemctl restart/reload`,
# а у pm нет passwordless sudo.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::secret SSH_PRIVATE_KEY is empty/unset — cannot deploy"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.225.149.52 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (server pulls origin/main → migrate → restart → health-check)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 \
              root@46.225.149.52 \
              'cd /opt/pharmacy-monitor && bash infra/deploy.sh'
