name: Deploy to production

# Manual deploy (workflow_dispatch). Запускать из Actions → "Run workflow" ПОСЛЕ
# зелёного CI на нужном коммите. Прод-деплой = явное per-deploy решение (security).
#
# РЕАЛЬНОСТЬ ПРОДА (2026-05-30):
#   * /opt/pharmacy-monitor — это RSYNC-деплой, НЕ git-чекаут. Поэтому здесь rsync,
#     а НЕ `git reset --hard` (старый infra/deploy.sh так не работает — на проде нет
#     рабочего .git). Катит то, что в checkout этого workflow (= коммит, который
#     выбран для прогона).
#   * Используем существующий секрет SSH_PRIVATE_KEY (pm-scoped).
#   * pm НЕ имеет passwordless sudo по умолчанию. ОДНОРАЗОВЫЙ ПРЕРЕКВИЗИТ на сервере —
#     дать pm узкий sudo на два restart'а, иначе шаг restart упадёт:
#       echo 'pm ALL=(root) NOPASSWD: /usr/bin/systemctl restart pharmacy-monitor-api.service, /usr/bin/systemctl restart pharmacy-monitor-frontend.service' \
#         | sudo tee /etc/sudoers.d/pm-deploy && sudo chmod 440 /etc/sudoers.d/pm-deploy
#   * АЛЕМБИК ПО УМОЛЧАНИЮ НЕ ЗАПУСКАЕТСЯ: миграции включаются явным флагом
#     apply_migrations и только после проверенного backup. Каталог
#     migrations/versions синхронизируется с --delete; несколько heads
#     останавливают deploy.
#
# ПОРЯДОК (2026-10-07): СНАЧАЛА БАЗА, ПОТОМ КОД.
#   Таймеры запускают CLI из /opt/pharmacy-monitor весь день (вотчер очереди —
#   раз в минуту). Раньше код копировался до бэкапа и миграции, и ~50 секунд
#   новый код лежал на старой схеме: процесс, стартовавший в это окно, падал на
#   первом запросе к новой колонке. Теперь:
#     1. релиз (src, migrations, alembic.ini, backup.sh) кладётся в отдельный
#        каталог .deploy-stage.* — в живом каталоге не меняется ничего;
#     2. граф миграций проверяется там же; фронтенд собирается там же, отдельно
#        от работающего standalone-сервера и его изменяемого кэша;
#     3. бэкап и `alembic upgrade` исполняются из этого каталога, то есть
#        миграция видит src и env.py своего релиза, а не прошлого;
#     4. код копируется в живой каталог, только если ревизия базы равна голове
#        релиза.
#   Отказ ДО миграции оставляет прод как был. Отказ ПОСЛЕ неё (обрыв связи,
#   отмена, упавший rsync) оставляет новую схему под прошлым кодом — это то же
#   состояние, в котором выкладка и так проводит около минуты, и её можно
#   запустить заново: ревизия базы читается из самой базы, а не через файлы
#   миграций живого каталога. Вернуть прошлый коммит после миграции нельзя —
#   в нём нет ревизии базы; чинить новым коммитом.
#   В ЖИВОЙ КАТАЛОГ ИЗ migrations КЛАДЁТСЯ ТОЛЬКО versions/ — env.py и
#   alembic.ini этот workflow там НЕ трогает (решение владельца 2026-10-12).
#   env.py релиза берёт движок у storage.create_engine_hiding_statement_data и
#   рядом с src, который фабрику не знает, не импортируется. А откат выкладкой
#   прошлого коммита исполняет deploy.yml ТОГО коммита: коммит старше этого
#   порядка кладёт свой src/ и зовёт Alembic из живого каталога — с новым
#   env.py там выкладка коммита старше PR #86 падала бы на импорте после
#   копирования кода. Поэтому в живом каталоге остаётся env.py от 2026-08-23:
#   из src ему нужен один Base, он есть в любом релизе. Свои миграции workflow
#   исполняет из .deploy-stage.*, на env.py и src одного коммита. Цена — у
#   `alembic`, запущенного на сервере руками, нет ни предела ожидания
#   блокировки, ни защиты текста ошибки: docs/RUNBOOK.md, «Ручной alembic на
#   сервере». И всё это принадлежит выкладываемому коммиту, а не серверу:
#   ветку, в которой этого файла в таком виде нет, выложит её прежний
#   deploy.yml — код до схемы, `alembic upgrade` из живого каталога.
#   Миграция ждёт блокировку таблицы не дольше MIGRATION_LOCK_TIMEOUT_MS и
#   повторяется MIGRATION_LOCK_ATTEMPTS раз: пока она ждёт, за ней стоят все
#   запросы к этой таблице, в том числе чтения API. Предел — на ожидание, не на
#   саму миграцию: долгая миграция держит таблицу, пока не закончит.
#
#   ЧЕГО ЭТО ТРЕБУЕТ ОТ МИГРАЦИИ: между миграцией и рестартом на новой схеме
#   работает ПРОШЛЫЙ релиз — API из памяти (копирование кода и переключение
#   готового фронтенда), CLI с диска (секунды), сбор, начатый до выкладки, — до
#   своего конца. Миграция обязана быть с ним совместима: добавлять можно,
#   удалять и переименовывать то, что он читает или пишет, — только следующим
#   релизом после кода. Сторож — tests/test_migrations_backward_compatible.py.

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "After a verified backup, upgrade the production DB to the single Alembic head"
        type: boolean
        required: true
        default: false

jobs:
  deploy:
    name: rsync deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key (pm)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::secret SSH_PRIVATE_KEY is empty/unset — cannot deploy"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDVrem8NrMZMjV9cDiB8/8wOwOn1wrfSU7S5vfaLHM+R' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host 13.140.186.143' \
            '  ServerAliveInterval 30' \
            '  ServerAliveCountMax 6' \
            '  ConnectTimeout 15' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = \
            'SHA256:Hx7TYOZC2diIb6ZwI9LRv4bybasYCijb+lKnQQmGk/I'

      - name: Preflight production DB revision against checkout
        run: |
          set -euo pipefail
          # Straight from the database, not through `alembic current` in the
          # live directory: Alembic resolves the revision against the migration
          # files it finds there and refuses one it has no file for. That is
          # exactly the state a deploy leaves when it dies after its migration
          # and before the files are copied — and that deploy must be
          # re-runnable.
          # Its own engine, not storage.create_engine_hiding_statement_data:
          # nothing of this release is on the server yet, and the src that is
          # there may predate the factory. One statement, no parameters, one
          # table without people in it — a failure has no data to print. Do
          # not add queries here: tests/test_statement_data_stays_out_of_errors.py
          # allows this file one engine and this one statement.
          current_output=$(ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/pharmacy-monitor
          db_url=$(grep -m1 "^DATABASE_URL=" /etc/pharmacy-monitor/env | cut -d= -f2-)
          test -n "$db_url"
          DATABASE_URL="$db_url" .venv/bin/python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], hide_parameters=True)
          with engine.connect() as connection:
              for (revision,) in connection.execute(text("SELECT version_num FROM alembic_version")):
                  print(revision)
          PY
          REMOTE
          )
          printf '%s\n' "$current_output"
          current_count=$(printf '%s\n' "$current_output" | sed '/^[[:space:]]*$/d' | wc -l)
          if [ "$current_count" -ne 1 ]; then
            echo "::error::expected exactly one revision in alembic_version on production, found $current_count; refusing to deploy"
            exit 1
          fi
          current_revision=$(printf '%s\n' "$current_output" | awk 'NF {print $1}')
          # A pending migration with apply_migrations=false would rsync the new
          # code and restart it on the old schema: a new column in the models
          # fails every query that selects it, for the API and the scrapers.
          head_revision=$(python3 - "$current_revision" <<'PY'
          import ast
          import pathlib
          import sys

          revisions, parents = set(), set()
          for path in pathlib.Path("migrations/versions").glob("*.py"):
              if path.name == "__init__.py":
                  continue
              fields = {}
              # Inspect literals without importing migration code or requiring
              # Alembic on the runner. Type annotations are optional Python.
              for node in ast.parse(path.read_text(encoding="utf-8"), filename=str(path)).body:
                  targets = node.targets if isinstance(node, ast.Assign) else (
                      [node.target] if isinstance(node, ast.AnnAssign) else []
                  )
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                          if target.id in fields:
                              raise SystemExit(f"duplicate {target.id} declaration in {path.name}")
                          try:
                              fields[target.id] = ast.literal_eval(node.value)
                          except (ValueError, TypeError):
                              raise SystemExit(f"nonliteral {target.id} in {path.name}")
              revision, parent = fields.get("revision"), fields.get("down_revision")
              if set(fields) != {"revision", "down_revision"} or not isinstance(revision, str) or not revision:
                  raise SystemExit(f"invalid migration declarations in {path.name}")
              if parent is not None and (not isinstance(parent, str) or not parent):
                  raise SystemExit(f"unsupported down_revision in {path.name}")
              if revision in revisions:
                  raise SystemExit(f"duplicate migration revision {revision}")
              revisions.add(revision)
              if parent is not None:
                  parents.add(parent)
          current = sys.argv[1]
          if current not in revisions:
              raise SystemExit(f"::error::production DB revision {current} is absent from checkout; refusing rsync --delete")
          if parents - revisions:
              raise SystemExit(f"unknown parent revisions in checkout: {sorted(parents - revisions)}")
          heads = sorted(revisions - parents)
          if len(heads) != 1:
              raise SystemExit(f"expected one migration head in checkout, found {heads}")
          print(heads[0])
          PY
          )
          if [ "$current_revision" != "$head_revision" ] && [ "${{ inputs.apply_migrations }}" != "true" ]; then
            echo "::error::checkout is at migration $head_revision, production DB is at $current_revision — re-run with apply_migrations=true; refusing to put new code on the old schema"
            exit 1
          fi

      - name: Preflight deployment paths are writable
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'set -euo pipefail
            source_bad=$(find \
              /opt/pharmacy-monitor/src \
              /opt/pharmacy-monitor/migrations/versions \
              -xdev \
              \( -name __pycache__ -o -name "*.pyc" \) -prune -o \
              ! -writable -print -quit)
            if [ -n "$source_bad" ]; then
              printf "deployment path is not writable by pm: %s\n" "$source_bad" >&2
              exit 1
            fi

            frontend_bad=$(find /opt/pharmacy-monitor/frontend -xdev \
              \( -name node_modules -o -name .next -o -name test-results \
                 -o -name "*.tsbuildinfo" \) -prune -o \
              ! -writable -print -quit)
            if [ -n "$frontend_bad" ]; then
              printf "deployment path is not writable by pm: %s\n" "$frontend_bad" >&2
              exit 1
            fi'

      - name: Preflight least-privilege service restart
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'set -euo pipefail
            for service in \
              pharmacy-monitor-api.service \
              pharmacy-monitor-frontend.service
            do
              test "$(systemctl show --property User --value "$service")" = pm

              fragment=$(systemctl show --property FragmentPath --value "$service")
              test -n "$fragment"
              test "$(stat -c %U "$fragment")" = root
              test ! -w "$fragment"

              for dropin in $(systemctl show --property DropInPaths --value "$service")
              do
                test "$(stat -c %U "$dropin")" = root
                test ! -w "$dropin"
              done

              sudo -n -l /usr/bin/systemctl restart "$service" >/dev/null
            done'

      # --- Schema before code ---------------------------------------------
      # Until the database is at the revision this release expects, nothing in
      # /opt/pharmacy-monitor changes. The release is uploaded to a private
      # directory next to it and Alembic runs from there.
      - name: Stage release runtime (nothing live changes)
        id: stage
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          git ls-files -z -- src migrations alembic.ini infra/scripts/backup.sh frontend \
            ':!frontend/.env*' |
            xargs -0 sha256sum | LC_ALL=C sort > "$manifest"
          test -s "$manifest"

          work_dir=$(ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Leftovers of a run whose cleanup step never ran (the runner died).
          # deploy-prod concurrency allows one deploy at a time, so a day-old
          # directory cannot belong to a live one.
          find /opt/pharmacy-monitor -maxdepth 1 -type d -name '.deploy-stage.*' \
            -mmin +1440 -exec rm -rf -- {} +
          work_dir=$(mktemp -d /opt/pharmacy-monitor/.deploy-stage.XXXXXX)
          mkdir -p "$work_dir/incoming" "$work_dir/runtime/src" \
            "$work_dir/runtime/migrations" "$work_dir/runtime/infra/scripts" \
            "$work_dir/runtime/frontend"
          printf '%s' "$work_dir"
          REMOTE
          )
          if [[ ! "$work_dir" =~ ^/opt/pharmacy-monitor/\.deploy-stage\.[A-Za-z0-9]{6}$ ]]; then
            echo "::error::unexpected remote staging path"
            exit 1
          fi
          echo "work_dir=$work_dir" >> "$GITHUB_OUTPUT"

          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' --exclude='*.pyc' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            src/ "pm@13.140.186.143:$work_dir/runtime/src/"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' --exclude='*.pyc' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            migrations/ "pm@13.140.186.143:$work_dir/runtime/migrations/"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519" \
            alembic.ini "pm@13.140.186.143:$work_dir/runtime/alembic.ini"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519" \
            infra/scripts/backup.sh \
            "pm@13.140.186.143:$work_dir/runtime/infra/scripts/backup.sh"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='node_modules/' --exclude='.next/' --exclude='*.tsbuildinfo' \
            --exclude='test-results/' --exclude='.env*' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            frontend/ "pm@13.140.186.143:$work_dir/runtime/frontend/"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519" \
            "$manifest" "pm@13.140.186.143:$work_dir/incoming/source-manifest"

      - name: Verify staged migration graph has one head
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
        run: |
          set -euo pipefail
          if [[ ! "$WORK_DIR" =~ ^/opt/pharmacy-monitor/\.deploy-stage\.[A-Za-z0-9]{6}$ ]]; then
            echo "::error::unexpected remote staging path"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 "bash -s -- '$WORK_DIR'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          runtime_dir="$work_dir/runtime"
          cd "$runtime_dir"
          sha256sum --quiet -c "$work_dir/incoming/source-manifest"
          db_url=$(grep -m1 "^DATABASE_URL=" /etc/pharmacy-monitor/env | cut -d= -f2-)
          test -n "$db_url"
          # </dev/null: this script itself arrives on stdin (bash -s); a child
          # that read stdin would swallow the rest of it.
          staged_alembic() {
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" DATABASE_URL="$db_url" \
              /opt/pharmacy-monitor/.venv/bin/python -m alembic \
              -c "$runtime_dir/alembic.ini" "$@" </dev/null
          }
          heads=$(staged_alembic heads)
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | sed '/^[[:space:]]*$/d' | wc -l)" -eq 1
          staged_alembic current
          REMOTE

      - name: Build frontend in the private release stage
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$WORK_DIR" =~ ^/opt/pharmacy-monitor/\.deploy-stage\.[A-Za-z0-9]{6}$ ]] || \
             [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected release identity or staging path"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 \
            "timeout --signal=TERM --kill-after=30s 20m bash -s -- '$WORK_DIR' '$RELEASE_SHA'" <<'REMOTE'
          set -euo pipefail
          umask 077
          work_dir=$1
          release_sha=$2
          cd "$work_dir/runtime"
          sha256sum --quiet -c "$work_dir/incoming/source-manifest"
          cd frontend
          # Let Next load the same production build settings. These private
          # files never come from the checkout and are never evaluated by bash.
          for env_file in .env .env.local .env.production .env.production.local; do
            if [ -f "/opt/pharmacy-monitor/frontend/$env_file" ]; then
              cp -- "/opt/pharmacy-monitor/frontend/$env_file" "$env_file"
              chmod 600 "$env_file"
            fi
          done
          NODE_OPTIONS=--max-old-space-size=4096 pnpm install --frozen-lockfile </dev/null
          NODE_OPTIONS=--max-old-space-size=4096 pnpm build </dev/null
          test -s .next/BUILD_ID
          test -s .next/standalone/server.js
          test -d .next/static
          # Next's standalone output omits these assets by default. Publish a
          # self-contained generation for the existing server.js service.
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/
          if [ -d public ]; then
            cp -a public .next/standalone/
          fi
          for env_file in .env .env.local .env.production .env.production.local; do
            if [ -f "$env_file" ]; then
              cp -- "$env_file" ".next/standalone/$env_file"
              chmod 600 ".next/standalone/$env_file"
            fi
          done
          printf '%s\n' "$release_sha" > .next/DEPLOYED_SHA
          REMOTE

      - name: Verified backup + apply migrations (before any code is replaced)
        if: ${{ inputs.apply_migrations }}
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
          # How long one DDL statement may WAIT for its table lock; while it
          # waits, every other query on that table queues behind it. It does
          # not limit how long the lock is then HELD: the upgrade is one
          # transaction, so a slow migration (a backfill, an index, several
          # revisions at once) blocks readers of the tables it has already
          # altered until it commits.
          MIGRATION_LOCK_TIMEOUT_MS: "5000"
          MIGRATION_LOCK_ATTEMPTS: "3"
        run: |
          set -euo pipefail
          if [[ ! "$WORK_DIR" =~ ^/opt/pharmacy-monitor/\.deploy-stage\.[A-Za-z0-9]{6}$ ]]; then
            echo "::error::unexpected remote staging path"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 \
            "bash -s -- '$WORK_DIR' '$MIGRATION_LOCK_TIMEOUT_MS' '$MIGRATION_LOCK_ATTEMPTS'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          lock_timeout_ms=$2
          max_attempts=$3
          for number in "$lock_timeout_ms" "$max_attempts"; do
            case "$number" in
              ''|*[!0-9]*) echo 'lock timeout and attempts must be whole numbers' >&2; exit 1 ;;
            esac
          done
          test "$max_attempts" -ge 1
          runtime_dir="$work_dir/runtime"
          cd "$runtime_dir"
          sha256sum --quiet -c "$work_dir/incoming/source-manifest"
          db_url=$(grep -m1 "^DATABASE_URL=" /etc/pharmacy-monitor/env | cut -d= -f2-)
          test -n "$db_url"
          # migrations/env.py reads it and opens its connection with this
          # lock_timeout.
          export MIGRATION_LOCK_TIMEOUT_MS="$lock_timeout_ms"
          # </dev/null: this script itself arrives on stdin (bash -s); a child
          # that read stdin would swallow the rest of it.
          staged_alembic() {
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" DATABASE_URL="$db_url" \
              /opt/pharmacy-monitor/.venv/bin/python -m alembic \
              -c "$runtime_dir/alembic.ini" "$@" </dev/null
          }

          bash "$runtime_dir/infra/scripts/backup.sh" </dev/null

          # On PostgreSQL the whole upgrade is one transaction: an attempt that
          # times out on a lock changes nothing and can simply be repeated.
          upgrade_log=$(mktemp)
          trap 'rm -f "$upgrade_log"' EXIT
          attempt=1
          while :; do
            if staged_alembic upgrade head 2>&1 | tee "$upgrade_log"; then
              break
            fi
            if ! grep -q 'LockNotAvailable' "$upgrade_log"; then
              echo "::error::alembic upgrade failed. Code and services on the server were not touched; the previous release keeps running."
              exit 1
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::the migration could not take its table lock: $max_attempts attempts of $lock_timeout_ms ms each. A long transaction holds the table (a scrape, a report, the nightly pg_dump). Nothing was changed — schema, code and services are as before. Re-run the deploy when that work has finished."
              exit 75
            fi
            echo "::warning::migration lock timeout, attempt $attempt of $max_attempts; retrying in 10 s"
            attempt=$((attempt + 1))
            sleep 10
          done

          current=$(staged_alembic current | awk 'NF {print $1}')
          head=$(staged_alembic heads | awk 'NF {print $1}')
          test -n "$current"
          test "$current" = "$head"
          printf 'migration current=head=%s\n' "$current"
          REMOTE

      # The one invariant of this workflow, checked right before the action it
      # protects and independently of the two steps above.
      - name: Refuse to replace code unless the DB is at the staged head
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
        run: |
          set -euo pipefail
          if [[ ! "$WORK_DIR" =~ ^/opt/pharmacy-monitor/\.deploy-stage\.[A-Za-z0-9]{6}$ ]]; then
            echo "::error::unexpected remote staging path"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 "bash -s -- '$WORK_DIR'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          runtime_dir="$work_dir/runtime"
          cd "$runtime_dir"
          db_url=$(grep -m1 "^DATABASE_URL=" /etc/pharmacy-monitor/env | cut -d= -f2-)
          test -n "$db_url"
          # </dev/null: this script itself arrives on stdin (bash -s); a child
          # that read stdin would swallow the rest of it.
          staged_alembic() {
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" DATABASE_URL="$db_url" \
              /opt/pharmacy-monitor/.venv/bin/python -m alembic \
              -c "$runtime_dir/alembic.ini" "$@" </dev/null
          }
          current=$(staged_alembic current | awk 'NF {print $1}')
          head=$(staged_alembic heads | awk 'NF {print $1}')
          test -n "$head"
          if [ "$current" != "$head" ]; then
            echo "::error::production DB is at ${current:-no revision}, this release needs $head. Nothing on the server was changed. Re-run with apply_migrations=true; new code is never put on the old schema."
            exit 1
          fi
          printf 'schema ready for the new code: current=head=%s\n' "$head"
          REMOTE

      - name: Rsync code -> prod (src + frontend + canonical migrations)
        run: |
          set -euo pipefail
          # Migrations first: the database may already be ahead of the files
          # in the live directory, and until they catch up `alembic` run by
          # hand from /opt/pharmacy-monitor cannot name the current revision.
          # Only versions/. env.py and alembic.ini of the live directory are
          # left as they are, on purpose: this release's env.py needs this
          # release's src, and a rollback to an older commit — run by that
          # commit's deploy.yml, which calls Alembic from the live directory —
          # would put an older src next to it. See the header.
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='__pycache__/' --exclude='*.pyc' \
            migrations/versions/ pm@13.140.186.143:/opt/pharmacy-monitor/migrations/versions/
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='__pycache__/' --exclude='*.pyc' \
            src/ pm@13.140.186.143:/opt/pharmacy-monitor/src/
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='node_modules/' --exclude='.next/' --exclude='*.tsbuildinfo' --exclude='test-results/' --exclude='.env*' \
            frontend/ pm@13.140.186.143:/opt/pharmacy-monitor/frontend/
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='__pycache__/' --exclude='*.pyc' \
            frontend/src/ pm@13.140.186.143:/opt/pharmacy-monitor/frontend/src/
          # Root-owned systemd installation remains an explicit post-release
          # operation, but its versioned units and reconciliation script must
          # be present in the runtime checkout for that operation to be
          # reproducible.
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            infra/systemd/ pm@13.140.186.143:/opt/pharmacy-monitor/infra/systemd/
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            infra/scripts/ pm@13.140.186.143:/opt/pharmacy-monitor/infra/scripts/

      - name: Publish completed frontend + restart services
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$WORK_DIR" =~ ^/opt/pharmacy-monitor/\.deploy-stage\.[A-Za-z0-9]{6}$ ]] || \
             [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]] || [[ ! "$DEPLOY_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::error::unexpected release identity or staging path"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 \
            "timeout --signal=TERM --kill-after=30s 5m bash -s -- '$WORK_DIR' '$RELEASE_SHA' '$DEPLOY_RUN_ID' '$DEPLOY_RUN_ATTEMPT'" <<'REMOTE'
          set -euo pipefail
          umask 077
          work_dir=$1
          release_sha=$2
          run_id=$3
          run_attempt=$4
          staged_next="$work_dir/runtime/frontend/.next"
          test ! -L "$staged_next"
          test "$(cat "$staged_next/DEPLOYED_SHA")" = "$release_sha"
          test -s "$staged_next/BUILD_ID"
          test -s "$staged_next/standalone/server.js"
          test -d "$staged_next/standalone/.next/static"
          releases_dir=/opt/pharmacy-monitor/.frontend-releases
          test ! -L "$releases_dir"
          mkdir -p "$releases_dir"
          chmod 700 "$releases_dir"
          release_dir="$releases_dir/$release_sha-$run_id-$run_attempt"
          mkdir "$release_dir"
          mv -- "$staged_next" "$release_dir/.next"
          live_next=/opt/pharmacy-monitor/frontend/.next
          previous_next=''
          restore_first_transition() {
            result=$?
            if [ -n "$previous_next" ] && [ ! -e "$live_next" ] && [ ! -L "$live_next" ]; then
              mv -T -- "$previous_next" "$live_next"
            fi
            return "$result"
          }
          trap restore_first_transition EXIT
          ln -s "$release_dir/.next" "$work_dir/next-link"
          if [ -e "$live_next" ] && [ ! -L "$live_next" ]; then
            # One-time conversion from a real directory. Keep all previous
            # output; never recursively delete a running server's cache.
            previous_next="$releases_dir/previous-$run_id-$run_attempt"
            test ! -e "$previous_next"
            mv -T -- "$live_next" "$previous_next"
          fi
          # Later deploys replace only this symlink atomically. Node resolves
          # server.js to its generation; old requests keep their own cache.
          mv -Tf -- "$work_dir/next-link" "$live_next"
          sudo -n /usr/bin/systemctl restart pharmacy-monitor-api.service
          sudo -n /usr/bin/systemctl restart pharmacy-monitor-frontend.service
          # Retain generations after health checks too. Cleanup of old live
          # outputs needs a separate retention policy, not staging cleanup.
          REMOTE

      - name: Health check
        run: |
          set -euo pipefail
          sleep 5
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'set -euo pipefail
            # On a line of its own: as the left side of `&&` a failing curl
            # does not stop a `set -e` script, and a dead API passed this step
            # as long as the frontend answered. The retries give uvicorn the
            # time it needs to come up after the restart.
            curl -fsS --retry 5 --retry-delay 2 --retry-connrefused --max-time 10 \
              http://127.0.0.1:8080/health >/dev/null
            echo "API ok"
            curl -fsSL -o /dev/null -w "frontend HTTP %{http_code}\n" http://127.0.0.1:3000/ru/login
            curl -fsSL http://127.0.0.1:3000/ru/login | grep -q "<html lang=\"ru\""'

      - name: Remove staged release runtime
        if: ${{ always() && steps.stage.outputs.work_dir != '' }}
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
        run: |
          set -euo pipefail
          if [[ ! "$WORK_DIR" =~ ^/opt/pharmacy-monitor/\.deploy-stage\.[A-Za-z0-9]{6}$ ]]; then
            echo "::error::unexpected remote staging path"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 "rm -rf -- '$WORK_DIR'"
