name: Deploy to Hetzner

# Manual deploy (workflow_dispatch). Запускать из Actions → "Run workflow" ПОСЛЕ
# зелёного CI на нужном коммите. Прод-деплой = явное per-deploy решение (security).
#
# РЕАЛЬНОСТЬ ПРОДА (2026-05-30):
#   * /opt/pharmacy-monitor — это RSYNC-деплой, НЕ git-чекаут. Поэтому здесь rsync,
#     а НЕ `git reset --hard` (старый infra/deploy.sh так не работает — на проде нет
#     рабочего .git). Катит то, что в checkout этого workflow (= коммит, который
#     выбран для прогона).
#   * Используем существующий секрет SSH_PRIVATE_KEY (pm-scoped, тот же что scrape.yml).
#   * pm НЕ имеет passwordless sudo по умолчанию. ОДНОРАЗОВЫЙ ПРЕРЕКВИЗИТ на сервере —
#     дать pm узкий sudo на два restart'а, иначе шаг restart упадёт:
#       echo 'pm ALL=(root) NOPASSWD: /usr/bin/systemctl restart pharmacy-monitor-api.service, /usr/bin/systemctl restart pharmacy-monitor-frontend.service' \
#         | sudo tee /etc/sudoers.d/pm-deploy && sudo chmod 440 /etc/sudoers.d/pm-deploy
#   * АЛЕМБИК НЕ ЗАПУСКАЕТСЯ автоматически (осознанно): миграции — отдельное решение,
#     не на каждый деплой. Прод-схема консистентна (PG alembic_version=0008, схема
#     через 0009; upgrade head безопасен — 0009 идемпотентна). См. CLAUDE.md.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: rsync deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key (pm)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::secret SSH_PRIVATE_KEY is empty/unset — cannot deploy"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.225.149.52 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code -> prod (src + frontend source)
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='__pycache__/' --exclude='*.pyc' \
            src/ pm@46.225.149.52:/opt/pharmacy-monitor/src/
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='node_modules/' --exclude='.next/' --exclude='*.tsbuildinfo' --exclude='test-results/' \
            frontend/ pm@46.225.149.52:/opt/pharmacy-monitor/frontend/

      - name: Build frontend + restart services
        run: |
          ssh -i ~/.ssh/id_ed25519 pm@46.225.149.52 'set -e
            cd /opt/pharmacy-monitor/frontend
            NODE_OPTIONS=--max-old-space-size=4096 pnpm install --frozen-lockfile
            NODE_OPTIONS=--max-old-space-size=4096 pnpm build
            sudo systemctl restart pharmacy-monitor-api.service
            sudo systemctl restart pharmacy-monitor-frontend.service'

      - name: Health check
        run: |
          sleep 5
          ssh -i ~/.ssh/id_ed25519 pm@46.225.149.52 '
            curl -fsS http://127.0.0.1:8080/health >/dev/null && echo "API ok"
            curl -s -o /dev/null -w "frontend HTTP %{http_code}\n" http://127.0.0.1:3000/'
