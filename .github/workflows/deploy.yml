name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Compatibility input; ignored by Aloe-only hotfix"
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: aloe-only rsync deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned SSH key (pm)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '|1|tVfkqCdl1dxn7v0V+vFAb8AGGDU=|+mE7K9OBJQ7+XZPA8mu+uZrBQnE= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts

      - name: Backup and deploy Aloe scraper
        run: |
          set -euo pipefail
          remote_path=/opt/pharmacy-monitor/src/scrapers/aloe.py
          backup_path=/tmp/aloe.py.pre-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"

          aloe_state=$($ssh_base pm@46.225.149.52 \
            'systemctl is-active pharmacy-monitor-scrape@aloe.service || true')
          if [ "$aloe_state" = active ]; then
            echo "::error::Aloe scrape is active; refusing an in-place hotfix"
            exit 1
          fi

          backup_sha=$($ssh_base pm@46.225.149.52 \
            "set -euo pipefail; test -f '$remote_path'; test -w '$remote_path'; test ! -e '$backup_path'; cp --no-clobber -- '$remote_path' '$backup_path'; sha256sum '$backup_path'" \
            | awk '{print $1}')
          test -n "$backup_sha"
          printf 'BACKUP_PATH=%s\nBACKUP_SHA=%s\n' "$backup_path" "$backup_sha" >> "$GITHUB_ENV"

          rsync -z --checksum --inplace --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            src/scrapers/aloe.py "pm@46.225.149.52:$remote_path"

      - name: Verify Aloe scraper and API
        run: |
          set -euo pipefail
          remote_path=/opt/pharmacy-monitor/src/scrapers/aloe.py
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"
          local_sha=$(sha256sum src/scrapers/aloe.py | awk '{print $1}')
          remote_sha=$($ssh_base pm@46.225.149.52 "sha256sum '$remote_path'" | awk '{print $1}')
          printf 'local_sha=%s\nremote_sha=%s\nbackup=%s\n' \
            "$local_sha" "$remote_sha" "$BACKUP_PATH"
          test "$local_sha" = "$remote_sha"
          $ssh_base pm@46.225.149.52 \
            'cd /opt/pharmacy-monitor && PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -c "from src.scrapers.aloe import AloeScraper"'
          $ssh_base pm@46.225.149.52 \
            'curl -fsS http://127.0.0.1:8080/health >/dev/null && echo "API ok"'

      - name: Roll back Aloe scraper after failed deploy or verification
        if: ${{ failure() && env.BACKUP_PATH != '' }}
        run: |
          set -euo pipefail
          remote_path=/opt/pharmacy-monitor/src/scrapers/aloe.py
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"
          $ssh_base pm@46.225.149.52 \
            "set -euo pipefail; test -f '$BACKUP_PATH'; cp -- '$BACKUP_PATH' '$remote_path'"
          restored_sha=$($ssh_base pm@46.225.149.52 "sha256sum '$remote_path'" | awk '{print $1}')
          printf 'rollback_sha=%s\nexpected_backup_sha=%s\n' "$restored_sha" "$BACKUP_SHA"
          test "$restored_sha" = "$BACKUP_SHA"
          $ssh_base pm@46.225.149.52 \
            'cd /opt/pharmacy-monitor && PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -c "from src.scrapers.aloe import AloeScraper"'
