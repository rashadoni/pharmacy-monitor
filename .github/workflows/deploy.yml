name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Compatibility input; ignored by analytics.py-only hotfix"
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: analytics.py-only hotfix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.225.149.52 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup and deploy analytics
        run: |
          set -euo pipefail
          remote_path=/opt/pharmacy-monitor/src/analytics.py
          backup_path=/tmp/analytics.py.pre-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"

          backup_sha=$($ssh_base pm@46.225.149.52 \
            "set -euo pipefail; test -f '$remote_path'; test -w '$remote_path'; test ! -e '$backup_path'; cp --no-clobber -- '$remote_path' '$backup_path'; sha256sum '$backup_path'" \
            | awk '{print $1}')
          test -n "$backup_sha"
          printf 'BACKUP_PATH=%s\nBACKUP_SHA=%s\n' "$backup_path" "$backup_sha" >> "$GITHUB_ENV"

          rsync -z --checksum --inplace --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            src/analytics.py "pm@46.225.149.52:$remote_path"

      - name: Verify and restart API
        run: |
          set -euo pipefail
          remote_path=/opt/pharmacy-monitor/src/analytics.py
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"
          local_sha=$(sha256sum src/analytics.py | awk '{print $1}')
          remote_sha=$($ssh_base pm@46.225.149.52 "sha256sum '$remote_path'" | awk '{print $1}')
          test "$local_sha" = "$remote_sha"
          $ssh_base pm@46.225.149.52 \
            'cd /opt/pharmacy-monitor && PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m py_compile src/analytics.py'
          $ssh_base pm@46.225.149.52 \
            'sudo -n /usr/bin/systemctl restart pharmacy-monitor-api.service'
          sleep 5
          $ssh_base pm@46.225.149.52 \
            'curl -fsS http://127.0.0.1:8080/health >/dev/null && echo "API ok"'

      - name: Roll back after failed verification
        if: ${{ failure() && env.BACKUP_PATH != '' }}
        run: |
          set -euo pipefail
          remote_path=/opt/pharmacy-monitor/src/analytics.py
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"
          $ssh_base pm@46.225.149.52 \
            "set -euo pipefail; test -f '$BACKUP_PATH'; cp -- '$BACKUP_PATH' '$remote_path'"
          restored_sha=$($ssh_base pm@46.225.149.52 "sha256sum '$remote_path'" | awk '{print $1}')
          test "$restored_sha" = "$BACKUP_SHA"
          $ssh_base pm@46.225.149.52 \
            'sudo -n /usr/bin/systemctl restart pharmacy-monitor-api.service'
