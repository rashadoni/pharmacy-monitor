name: Probe Pharmonline public API (no persistence)

# The storefront's current React paginator calls public JSON endpoints rather
# than navigating its old HTML \`?page=N\` URL. This probe proves that Crawlbase
# can fetch those endpoints and that their direct product IDs still match the
# trusted DDP catalog. It never creates or changes a Run, Product, or snapshot.
on:
  workflow_dispatch:
    inputs:
      page_size:
        description: "Public API page size to test (100, 250, 500, or 1000; no persistence)"
        required: true
        default: "100"

permissions:
  contents: read

concurrency:
  group: pharmonline-public-api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.225.149.52 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Open read-only production Postgres tunnel
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -N -L 5433:localhost:5432 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 &
          echo "TUNNEL_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if nc -z localhost 5433 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "production Postgres tunnel did not come up" >&2
          exit 1

      - name: Verify current public API and DDP identity without writes
        env:
          DATABASE_URL: postgresql+psycopg://pm:${{ secrets.PG_PASS }}@localhost:5433/pharmacy_monitor
          CRAWLBASE_JS_TOKEN: ${{ secrets.CRAWLBASE_JS_TOKEN }}
          PROBE_PAGE_SIZE: ${{ inputs.page_size }}
        run: |
          set -euo pipefail
          test -n "$CRAWLBASE_JS_TOKEN"
          python - <<'PY'
          import asyncio
          import hashlib
          import html
          import json
          import math
          import os
          import re
          import secrets
          from urllib.parse import urlencode, urlsplit

          import httpx
          from sqlalchemy import select, text

          from src import storage
          from src.main import (
              _PHARMONLINE_DDP_AVAILABILITY_SOURCE,
              _PHARMONLINE_METEOR_ID_RE,
              _canonical_pharmonline_product_url,
          )


          BASE_URL = "https://pharmonline.az"
          SORT_BY = "name_asc"
          ALLOWED_PAGE_SIZES = {100, 250, 500, 1000}
          MAX_CRAWLBASE_ATTEMPTS = 2
          CRAWLBASE_SESSION = secrets.token_hex(16)
          ORIGIN_CONTEXT_HEADERS = ("cache-control", "vary", "cf-cache-status", "x-cache")
          ORIGIN_CONTEXTS: dict[str, set[str]] = {}
          TRANSIENT_TRANSPORT_RETRIES = 0
          try:
              GLOBAL_PAGE_SIZE = int(os.environ["PROBE_PAGE_SIZE"])
          except (KeyError, ValueError) as exc:
              raise SystemExit("PROBE_PAGE_SIZE must be an integer") from exc
          if GLOBAL_PAGE_SIZE not in ALLOWED_PAGE_SIZES:
              raise SystemExit(
                  "PROBE_PAGE_SIZE must be one of "
                  f"{', '.join(map(str, sorted(ALLOWED_PAGE_SIZES)))}"
              )


          def origin_context_evidence() -> str:
              if not ORIGIN_CONTEXTS:
                  return "none"
              return ",".join(
                  f"{resource}:{len(fingerprints)}"
                  for resource, fingerprints in sorted(ORIGIN_CONTEXTS.items())
              )


          def fail(message: str) -> None:
              raise SystemExit(
                  "Pharmonline public API probe failed: "
                  f"{message}; crawlbase_session=sticky, "
                  f"origin_contexts={origin_context_evidence()}, "
                  f"transport_retries={TRANSIENT_TRANSPORT_RETRIES}"
              )


          def record_origin_context(target_url: str, envelope: dict) -> None:
              """Retain only hashed cache evidence; never log provider cookies."""
              raw_headers = envelope.get("original_headers")
              if not isinstance(raw_headers, dict):
                  return
              headers = {
                  str(name).lower(): str(value).strip()
                  for name, value in raw_headers.items()
                  if value is not None and str(value).strip()
              }
              selected = tuple(
                  (name, headers[name])
                  for name in ORIGIN_CONTEXT_HEADERS
                  if name in headers
              )
              if not selected:
                  return
              fingerprint = hashlib.sha256(repr(selected).encode("utf-8")).hexdigest()[:12]
              ORIGIN_CONTEXTS.setdefault(urlsplit(target_url).path, set()).add(fingerprint)


          async def crawlbase_json(client: httpx.AsyncClient, target_url: str) -> dict | list:
              params = {
                  "token": os.environ["CRAWLBASE_JS_TOKEN"],
                  "url": target_url,
                  "request_headers": "accept:application/json",
                  "cookies_session": CRAWLBASE_SESSION,
                  "get_headers": "true",
                  "format": "json",
              }
              global TRANSIENT_TRANSPORT_RETRIES
              for attempt in range(1, MAX_CRAWLBASE_ATTEMPTS + 1):
                  try:
                      response = await client.get("https://api.crawlbase.com/", params=params)
                      break
                  except (httpx.TimeoutException, httpx.NetworkError) as exc:
                      if attempt == MAX_CRAWLBASE_ATTEMPTS:
                          fail(
                              "Crawlbase request failed after "
                              f"{attempt} attempts for {target_url}: {type(exc).__name__}"
                          )
                      TRANSIENT_TRANSPORT_RETRIES += 1
                      await asyncio.sleep(1)
                  except httpx.HTTPError as exc:
                      fail(f"Crawlbase request failed for {target_url}: {type(exc).__name__}")
              if response.status_code != 200:
                  fail(f"Crawlbase HTTP {response.status_code} for {target_url}")
              try:
                  envelope = response.json()
              except json.JSONDecodeError as exc:
                  fail(
                      "Crawlbase did not return a JSON envelope for "
                      f"{target_url}: {exc.msg}; prefix={response.text[:120]!r}"
                  )
              if not isinstance(envelope, dict):
                  fail(f"Crawlbase envelope is not an object for {target_url}")
              cb_status = str(envelope.get("cb_status") or "")
              original_status = str(envelope.get("original_status") or "")
              if cb_status != "200" or original_status != "200":
                  fail(
                      "Crawlbase/source status is not successful for "
                      f"{target_url}: cb_status={cb_status or '<missing>'}, "
                      f"original_status={original_status or '<missing>'}"
                  )
              body = envelope.get("body")
              if isinstance(body, dict):
                  payload = body
              elif isinstance(body, str):
                  raw_body = body
                  pre_match = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I | re.S)
                  if pre_match:
                      raw_body = html.unescape(pre_match.group(1))
                  try:
                      payload = json.loads(raw_body)
                  except json.JSONDecodeError as exc:
                      fail(
                          "Crawlbase public API body was not JSON for "
                          f"{target_url}: {exc.msg}; body_prefix={raw_body[:120]!r}"
                      )
              else:
                  fail(f"Crawlbase envelope has no usable body for {target_url}")
              if not isinstance(payload, (dict, list)):
                  fail(
                      "Crawlbase public API response has unsupported shape for "
                      f"{target_url}: {type(payload).__name__}"
                  )
              record_origin_context(target_url, envelope)
              return payload


          def rows_and_meta(payload: object, *, page: int) -> tuple[list[dict], int, int]:
              if not isinstance(payload, dict):
                  fail(f"page {page} payload must be an object: got={type(payload).__name__}")
              rows = payload.get("data")
              if not isinstance(rows, list) or not all(isinstance(row, dict) for row in rows):
                  fail(f"page {page} has invalid data rows")
              try:
                  total = int(payload["total"])
                  pages = int(payload["pages"])
              except (KeyError, TypeError, ValueError) as exc:
                  fail(f"page {page} lacks usable total/pages: {type(exc).__name__}")
              if total < 1 or pages < 1:
                  fail(f"page {page} has non-positive total/pages metadata")
              return rows, total, pages


          def ordered_records(rows: list[dict], *, page: int) -> tuple[tuple[str, str], ...]:
              records: list[tuple[str, str]] = []
              for row in rows:
                  external_id = str(row.get("_id") or "")
                  canonical_url = _canonical_pharmonline_product_url(
                      f"{BASE_URL}/product/{row.get('path') or ''}"
                  )
                  if _PHARMONLINE_METEOR_ID_RE.fullmatch(external_id) is None:
                      fail(f"page {page} contains an invalid product ID")
                  if canonical_url is None:
                      fail(f"page {page} contains an invalid product path")
                  records.append((external_id, canonical_url))
              ids = [external_id for external_id, _ in records]
              urls = [canonical_url for _, canonical_url in records]
              if len(set(ids)) != len(ids) or len(set(urls)) != len(urls):
                  fail(f"page {page} contains duplicate product identities")
              return tuple(records)


          async def main() -> None:
              def product_url(page: int) -> str:
                  query = urlencode(
                      {
                          "lng": "az",
                          "page": str(page),
                          "limit": str(GLOBAL_PAGE_SIZE),
                          "sortBy": SORT_BY,
                      }
                  )
                  return f"{BASE_URL}/api/products?{query}"

              async def read_page(
                  client: httpx.AsyncClient,
                  page: int,
                  *,
                  expected_total: int,
                  expected_pages: int,
              ) -> tuple[list[dict], tuple[tuple[str, str], ...]]:
                  rows, total, pages = rows_and_meta(
                      await crawlbase_json(client, product_url(page)), page=page
                  )
                  if total != expected_total or pages != expected_pages:
                      fail(
                          f"metadata changed on page {page}: got total={total},pages={pages}; "
                          f"expected total={expected_total},pages={expected_pages}"
                      )
                  expected_items = (
                      GLOBAL_PAGE_SIZE
                      if page < expected_pages
                      else expected_total - GLOBAL_PAGE_SIZE * (expected_pages - 1)
                  )
                  if len(rows) != expected_items:
                      fail(
                          f"page {page} size {len(rows)} does not equal expected {expected_items}"
                      )
                  return rows, ordered_records(rows, page=page)

              timeout = httpx.Timeout(120.0, connect=20.0)
              async with httpx.AsyncClient(timeout=timeout) as client:
                  first_rows, total, pages = rows_and_meta(
                      await crawlbase_json(client, product_url(1)), page=1
                  )
                  if pages != math.ceil(total / GLOBAL_PAGE_SIZE):
                      fail(
                          f"total/pages mismatch total={total}, pages={pages}, "
                          f"page_size={GLOBAL_PAGE_SIZE}"
                      )
                  sample_pages = tuple(
                      sorted({1, (pages + 1) // 2, min(85, pages), pages})
                  )
                  first_records = ordered_records(first_rows, page=1)
                  expected_first_items = (
                      GLOBAL_PAGE_SIZE
                      if pages > 1
                      else total
                  )
                  if len(first_records) != expected_first_items:
                      fail(
                          f"page 1 size {len(first_records)} does not equal "
                          f"expected {expected_first_items}"
                      )

                  sampled_records: dict[int, tuple[tuple[str, str], ...]] = {1: first_records}
                  for page in sample_pages:
                      if page == 1:
                          continue
                      _, records = await read_page(
                          client,
                          page,
                          expected_total=total,
                          expected_pages=pages,
                      )
                      sampled_records[page] = records

                  for page in sample_pages:
                      _, repeated_records = await read_page(
                          client,
                          page,
                          expected_total=total,
                          expected_pages=pages,
                      )
                      if repeated_records != sampled_records[page]:
                          fail(f"page {page} changed on immediate repeat")

              # Read-only DB evidence: selected API IDs and canonical paths must
              # agree with the DDP lineage, including immutable offer history.
              sample_rows = first_rows[:5]
              sample_ids = [str(row["_id"]) for row in sample_rows]
              expected_urls = {
                  product_id: _canonical_pharmonline_product_url(
                      f"{BASE_URL}/product/{row.get('path') or ''}"
                  )
                  for product_id, row in zip(sample_ids, sample_rows, strict=True)
              }
              if any(url is None for url in expected_urls.values()):
                  fail("first page sample contains an invalid canonical product URL")
              Session = storage.make_session()
              with Session() as session:
                  session.execute(text("SET TRANSACTION READ ONLY"))
                  try:
                      existing = session.scalars(
                          select(storage.Product).where(
                              storage.Product.tenant_id == 1,
                              storage.Product.site == "pharmonline",
                              storage.Product.external_id.in_(sample_ids),
                          )
                      ).all()
                      history_product_ids = set(
                          session.scalars(
                              select(storage.OfferObservation.product_id).where(
                                  storage.OfferObservation.tenant_id == 1,
                                  storage.OfferObservation.product_id.in_(
                                      [row.id for row in existing]
                                  ),
                                  storage.OfferObservation.availability_source
                                  == _PHARMONLINE_DDP_AVAILABILITY_SOURCE,
                              )
                          ).all()
                      )
                      trusted = {
                          str(row.external_id)
                          for row in existing
                          if (
                              row.availability_source == _PHARMONLINE_DDP_AVAILABILITY_SOURCE
                              or row.id in history_product_ids
                          )
                          and _canonical_pharmonline_product_url(row.url)
                          == expected_urls.get(str(row.external_id))
                      }
                  finally:
                      session.rollback()

              if trusted != set(sample_ids):
                  fail("public API sample did not map exactly to DDP identities")

              sample_keys = sorted(sample_rows[0])[:30]
              print(
                  "Pharmonline public API probe OK: "
                  f"sort_by={SORT_BY}, total={total}, pages={pages}, "
                  f"page_size={GLOBAL_PAGE_SIZE}, sampled_pages={','.join(map(str, sample_pages))}, "
                  "repeated_pages=identical, sample_ddp_identity=verified, "
                  f"origin_contexts={origin_context_evidence()}, "
                  f"transport_retries={TRANSIENT_TRANSPORT_RETRIES}, "
                  f"sample_fields={sample_keys}, database_transaction=read_only, persistence=none"
              )


          asyncio.run(main())
          PY

      - name: Close SSH tunnel
        if: always()
        run: |
          if [ -n "${TUNNEL_PID:-}" ]; then
            kill "$TUNNEL_PID" 2>/dev/null || true
          fi
