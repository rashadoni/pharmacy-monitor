name: Probe Pharmonline public API (no persistence)

# The storefront's current React paginator calls public JSON endpoints rather
# than navigating its old HTML \`?page=N\` URL. This probe proves that Crawlbase
# can fetch those endpoints and that their direct product IDs still match the
# trusted DDP catalog. It never creates or changes a Run, Product, or snapshot.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmonline-public-api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.225.149.52 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Open read-only production Postgres tunnel
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -N -L 5433:localhost:5432 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 &
          echo "TUNNEL_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if nc -z localhost 5433 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "production Postgres tunnel did not come up" >&2
          exit 1

      - name: Verify current public API and DDP identity without writes
        env:
          DATABASE_URL: postgresql+psycopg://pm:${{ secrets.PG_PASS }}@localhost:5433/pharmacy_monitor
          CRAWLBASE_JS_TOKEN: ${{ secrets.CRAWLBASE_JS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CRAWLBASE_JS_TOKEN"
          python - <<'PY'
          import asyncio
          import html
          import json
          import os
          import re
          from urllib.parse import urlencode

          import httpx
          from sqlalchemy import select, text

          from src import storage
          from src.main import (
              _PHARMONLINE_DDP_AVAILABILITY_SOURCE,
              _PHARMONLINE_METEOR_ID_RE,
              _canonical_pharmonline_product_url,
          )


          BASE_URL = "https://pharmonline.az"
          GLOBAL_PAGE_SIZE = 100


          async def crawlbase_json(target_url: str) -> dict | list:
              params = {
                  "token": os.environ["CRAWLBASE_JS_TOKEN"],
                  "url": target_url,
                  "request_headers": "accept:application/json",
                  # Ask Crawlbase for a metadata envelope.  With a JavaScript
                  # token a JSON target may be rendered in a browser, so the
                  # actual target body is intentionally read from ``body``
                  # rather than assuming the outer response is the catalog.
                  "format": "json",
              }
              async with httpx.AsyncClient(timeout=120.0) as client:
                  response = await client.get("https://api.crawlbase.com/", params=params)
              if response.status_code != 200:
                  raise SystemExit(
                      f"Crawlbase public API probe failed: http={response.status_code}"
                  )
              try:
                  envelope = json.loads(response.text)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      "Crawlbase public API probe did not return a JSON envelope: "
                      f"content_type={response.headers.get('content-type', '<missing>')}, "
                      f"cb_status={response.headers.get('cb_status', '<missing>')}, "
                      f"original_status={response.headers.get('original_status', '<missing>')}, "
                      f"body_prefix={response.text[:120]!r}"
                  ) from exc
              if not isinstance(envelope, dict):
                  raise SystemExit("Crawlbase public API envelope is not an object")
              body = envelope.get("body")
              if isinstance(body, dict):
                  payload = body
              elif isinstance(body, str):
                  # Chromium sometimes represents application/json as an HTML
                  # document with the raw source in <pre>.  Accept only that
                  # deterministic rendering form; otherwise fail closed.
                  raw_body = body
                  pre_match = re.search(r"<pre[^>]*>(.*?)</pre>", body, re.I | re.S)
                  if pre_match:
                      raw_body = html.unescape(pre_match.group(1))
                  try:
                      payload = json.loads(raw_body)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(
                          "Crawlbase public API body was not JSON: "
                          f"cb_status={envelope.get('cb_status', '<missing>')}, "
                          f"original_status={envelope.get('original_status', '<missing>')}, "
                          f"target_content_type={envelope.get('content_type', '<missing>')}, "
                          f"body_prefix={raw_body[:120]!r}"
                      ) from exc
              else:
                  raise SystemExit("Crawlbase public API envelope has no usable body")
              if not isinstance(payload, (dict, list)):
                  raise SystemExit(
                      "Crawlbase public API response has an unsupported JSON shape: "
                      f"{type(payload).__name__}"
                  )
              return payload


          def rows_and_meta(payload: dict) -> tuple[list[dict], int, int]:
              if not isinstance(payload, dict):
                  raise SystemExit(
                      "public products response must be an object: "
                      f"got={type(payload).__name__}"
                  )
              rows = payload.get("data")
              if not isinstance(rows, list) or not all(isinstance(row, dict) for row in rows):
                  raise SystemExit(
                      f"public products response has invalid data field: keys={sorted(payload)[:20]}"
                  )
              try:
                  total = int(payload["total"])
                  pages = int(payload["pages"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"public products response lacks usable total/pages: keys={sorted(payload)[:20]}"
                  ) from exc
              return rows, total, pages


          async def main() -> None:
              def product_url(
                  page: int,
                  *,
                  page_size: int,
              ) -> str:
                  query = {
                      "lng": "az",
                      "page": str(page),
                      "limit": str(page_size),
                      "sortBy": "price_asc",
                  }
                  return f"{BASE_URL}/api/products?{urlencode(query)}"

              global_payload = await crawlbase_json(
                  product_url(1, page_size=GLOBAL_PAGE_SIZE)
              )
              global_second_payload = await crawlbase_json(
                  product_url(2, page_size=GLOBAL_PAGE_SIZE)
              )
              global_rows, global_total, global_pages = rows_and_meta(global_payload)
              global_second_rows, global_second_total, global_second_pages = rows_and_meta(
                  global_second_payload
              )
              global_ids = {str(row.get("_id") or "") for row in global_rows}
              global_second_ids = {str(row.get("_id") or "") for row in global_second_rows}
              if (
                  not global_rows
                  or not global_second_rows
                  or global_total < len(global_rows)
                  or global_pages < 2
                  or global_total != global_second_total
                  or global_pages != global_second_pages
                  or len(global_ids) != len(global_rows)
                  or len(global_second_ids) != len(global_second_rows)
                  or global_ids & global_second_ids
                  or not all(
                      _PHARMONLINE_METEOR_ID_RE.fullmatch(value)
                      for value in global_ids | global_second_ids
                  )
              ):
                  raise SystemExit(
                      "public global catalog pagination is incomplete: "
                      f"page1=(items={len(global_rows)}, total={global_total}, pages={global_pages}), "
                      f"page2=(items={len(global_second_rows)}, total={global_second_total}, pages={global_second_pages}), "
                      f"overlap={len(global_ids & global_second_ids)}"
                  )

              # Read-only DB evidence: current API IDs and canonical paths must
              # agree with the pre-existing DDP catalogue before recovery code
              # is allowed to use this source.
              sample_rows = global_rows[:5]
              sample_ids = [str(row["_id"]) for row in sample_rows]
              Session = storage.make_session()
              with Session() as session:
                  session.execute(text("SET TRANSACTION READ ONLY"))
                  try:
                      existing = session.scalars(
                          select(storage.Product).where(
                              storage.Product.tenant_id == 1,
                              storage.Product.site == "pharmonline",
                              storage.Product.external_id.in_(sample_ids),
                          )
                      ).all()
                  finally:
                      session.rollback()

              expected_urls = {
                  product_id: _canonical_pharmonline_product_url(
                      f"{BASE_URL}/product/{row.get('path') or ''}"
                  )
                  for product_id, row in zip(sample_ids, sample_rows, strict=True)
              }
              trusted = {
                  str(row.external_id)
                  for row in existing
                  if row.availability_source == _PHARMONLINE_DDP_AVAILABILITY_SOURCE
                  and _canonical_pharmonline_product_url(row.url) == expected_urls.get(str(row.external_id))
              }
              if trusted != set(sample_ids):
                  raise SystemExit(
                      "public API sample did not map exactly to existing DDP identities"
                  )

              sample_keys = sorted(sample_rows[0])[:30]
              print(
                  "Pharmonline public API probe OK: "
                  f"global_total={global_total}, global_pages={global_pages}, "
                  f"global_page_size={len(global_rows)}, global_page_overlap={len(global_ids & global_second_ids)}, "
                  f"sample_fields={sample_keys}, database_transaction=read_only"
              )


          asyncio.run(main())
          PY

      - name: Close SSH tunnel
        if: always()
        run: |
          if [ -n "${TUNNEL_PID:-}" ]; then
            kill "$TUNNEL_PID" 2>/dev/null || true
          fi
