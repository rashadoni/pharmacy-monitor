name: Preflight full Pharmonline ScraperAPI public API recovery (no persistence)

# ScraperAPI credentials remain in the production EnvironmentFile. This stages
# the guarded source into an isolated temporary tree and runs two complete,
# read-only catalog proofs before a recovery can be considered.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PREFLIGHT to run the full read-only ScraperAPI proof"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: pharmonline-scraperapi-public-api-recovery
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require explicit confirmation and matching CI
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PREFLIGHT"
          ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          case "$ci_run_id" in
            ''|*[!0-9]*)
              echo "a successful Pharmacy Monitor CI run is required for this commit" >&2
              exit 1
              ;;
          esac
          echo "matching_ci_run_id=$ci_run_id"

      - uses: actions/checkout@v4

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Check production capacity and scraper state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          if systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service; then
            echo "refusing preflight: a Pharmonline scrape is already active" >&2
            exit 1
          fi
          REMOTE

      - name: Upload source and prove it from an isolated temporary tree
        run: |
          set -euo pipefail
          main_sha=$(sha256sum src/main.py | awk '{print $1}')
          public_api_sha=$(sha256sum src/scrapers/pharmonline_public_api.py | awk '{print $1}')
          preflight_script_sha=$(sha256sum scripts/preflight_pharmonline_public_api.py | awk '{print $1}')
          remote_work_dir=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          work_dir=$(mktemp -d /opt/pharmacy-monitor/.codex-scraperapi-preflight.XXXXXX)
          mkdir -p "$work_dir/incoming/src/scrapers" "$work_dir/incoming/scripts"
          printf '%s' "$work_dir"
          REMOTE
          )
          case "$remote_work_dir" in
            /opt/pharmacy-monitor/.codex-scraperapi-preflight.*) ;;
            *)
              echo "unexpected remote ScraperAPI preflight path" >&2
              exit 1
              ;;
          esac

          for file in \
            src/main.py \
            src/scrapers/pharmonline_public_api.py \
            scripts/preflight_pharmonline_public_api.py
          do
            case "$file" in
              src/main.py) expected_sha=$main_sha ;;
              src/scrapers/pharmonline_public_api.py) expected_sha=$public_api_sha ;;
              scripts/preflight_pharmonline_public_api.py) expected_sha=$preflight_script_sha ;;
            esac
            remote_file="$remote_work_dir/incoming/$file"
            rsync -z --checksum --no-perms --no-owner --no-group \
              -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
              "$file" "pm@46.225.149.52:$remote_file"
            remote_sha=$(ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              pm@46.225.149.52 "sha256sum '$remote_file'" | awk '{print $1}')
            test "$remote_sha" = "$expected_sha"
          done

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            "bash -s -- '$remote_work_dir' '$main_sha' '$public_api_sha' '$preflight_script_sha'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          main_sha=$2
          public_api_sha=$3
          preflight_script_sha=$4
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-scraperapi-preflight.*) ;;
            *)
              echo "unexpected remote ScraperAPI preflight path" >&2
              exit 1
              ;;
          esac

          runtime_dir="$work_dir/runtime"
          test "$(sha256sum "$work_dir/incoming/src/main.py" | awk '{print $1}')" = "$main_sha"
          test "$(sha256sum "$work_dir/incoming/src/scrapers/pharmonline_public_api.py" | awk '{print $1}')" = "$public_api_sha"
          test "$(sha256sum "$work_dir/incoming/scripts/preflight_pharmonline_public_api.py" | awk '{print $1}')" = "$preflight_script_sha"
          mkdir -p "$runtime_dir"
          cp -a -- /opt/pharmacy-monitor/src "$runtime_dir/src"
          mkdir -p "$runtime_dir/scripts"
          cp -p -- "$work_dir/incoming/src/main.py" "$runtime_dir/src/main.py"
          cp -p -- "$work_dir/incoming/src/scrapers/pharmonline_public_api.py" \
            "$runtime_dir/src/scrapers/pharmonline_public_api.py"
          cp -p -- "$work_dir/incoming/scripts/preflight_pharmonline_public_api.py" \
            "$runtime_dir/scripts/preflight_pharmonline_public_api.py"

          cd "$runtime_dir"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<PY
          import sys
          from pathlib import Path

          import httpx
          import src.main
          from src.main import _verify_pharmonline_public_api_identities
          from src.scrapers.pharmonline_public_api import PharmonlinePublicAPIScraper

          runtime = Path("$runtime_dir").resolve()
          assert Path(src.main.__file__).resolve().is_relative_to(runtime)
          assert callable(_verify_pharmonline_public_api_identities)
          assert PharmonlinePublicAPIScraper.__name__ == "PharmonlinePublicAPIScraper"
          print(
              "isolated ScraperAPI recovery source imported: "
              f"python={sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}, "
              f"httpx={httpx.__version__}"
          )
          PY

          # EnvironmentFile values are literal systemd values, not shell code.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          PHARMONLINE_PUBLIC_API=required \
          PHARMONLINE_PUBLIC_API_TRANSPORT=scraperapi \
          PHARMONLINE_USE_DDP=0 \
          AI_FALLBACK_ENABLED=0 \
          SCRAPE_REPORT_EMAIL=0 \
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH="$runtime_dir" \
          /opt/pharmacy-monitor/.venv/bin/python \
            "$runtime_dir/scripts/preflight_pharmonline_public_api.py"
          REMOTE
