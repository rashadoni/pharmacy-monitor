name: Probe Pharmonline direct JSON via ScraperAPI (no persistence)

# This deliberately makes only a small, read-only transport check on the
# production host, where the configured ScraperAPI key lives.  It does not
# open Postgres, invoke the scraper CLI, or change the service state.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROBE to test ScraperAPI's public-JSON path without persistence"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: pharmonline-scraperapi-json-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require explicit no-write probe confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PROBE"

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Verify ScraperAPI direct API stability without writes
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail

          # Do not spend proxy credits or contend with the scheduled
          # write-enabled job while a Pharmonline scrape is active.
          if systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service; then
            echo "refusing ScraperAPI probe: a Pharmonline scrape is already active" >&2
            exit 1
          fi

          test -r /etc/pharmacy-monitor/env
          cd /opt/pharmacy-monitor
          # A systemd EnvironmentFile is not a shell script: values can
          # contain '$'. Preserve them literally and never print them.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
          import asyncio
          import json
          import math
          import os
          import re
          import secrets
          from urllib.parse import quote, urlencode

          import httpx


          BASE_URL = "https://pharmonline.az"
          PAGE_SIZE = 100
          SORT_BY = "name_asc"
          ID_RE = re.compile(r"^[A-Za-z0-9]{17}$")


          def fail(message: str) -> None:
              raise SystemExit(f"ScraperAPI direct JSON probe failed: {message}")


          def product_url(page: int) -> str:
              return f"{BASE_URL}/api/products?" + urlencode(
                  {
                      "lng": "az",
                      "page": str(page),
                      "limit": str(PAGE_SIZE),
                      "sortBy": SORT_BY,
                  }
              )


          def records_and_metadata(
              payload: object, *, page: int
          ) -> tuple[tuple[tuple[str, str], ...], int, int]:
              if not isinstance(payload, dict):
                  fail(f"page {page} payload is not an object")
              rows = payload.get("data")
              if not isinstance(rows, list) or not all(isinstance(row, dict) for row in rows):
                  fail(f"page {page} has invalid data rows")
              try:
                  total = int(payload["total"])
                  pages = int(payload["pages"])
              except (KeyError, TypeError, ValueError):
                  fail(f"page {page} has invalid total/pages metadata")
              if total < 1 or pages < 1 or pages != math.ceil(total / PAGE_SIZE):
                  fail(f"page {page} has inconsistent total/pages metadata")
              expected_size = PAGE_SIZE if page < pages else total - PAGE_SIZE * (pages - 1)
              if len(rows) != expected_size:
                  fail(f"page {page} has {len(rows)} rows; expected {expected_size}")
              records: list[tuple[str, str]] = []
              for row in rows:
                  external_id = str(row.get("_id") or "")
                  path = str(row.get("path") or "").strip("/")
                  if ID_RE.fullmatch(external_id) is None or not path or "/" in path:
                      fail(f"page {page} has an invalid product identity")
                  records.append((external_id, path))
              if len(set(records)) != len(records):
                  fail(f"page {page} contains duplicate product identities")
              return tuple(records), total, pages


          async def read_page(
              client: httpx.AsyncClient,
              page: int,
              *,
              expected_total: int | None = None,
              expected_pages: int | None = None,
          ) -> tuple[tuple[tuple[str, str], ...], int, int]:
              try:
                  response = await client.get(
                      product_url(page),
                      headers={"accept": "application/json"},
                  )
              except httpx.HTTPError as exc:
                  # Do not stringify: proxy exceptions can contain credentials.
                  fail(f"page {page} transport error: {type(exc).__name__}")
              if response.status_code != 200:
                  fail(f"page {page} returned HTTP {response.status_code}")
              try:
                  payload = response.json()
              except json.JSONDecodeError:
                  fail(f"page {page} response is not JSON")
              records, total, pages = records_and_metadata(payload, page=page)
              if expected_total is not None and (total != expected_total or pages != expected_pages):
                  fail(
                      f"page {page} metadata changed: got total={total},pages={pages}; "
                      f"expected total={expected_total},pages={expected_pages}"
                  )
              return records, total, pages


          async def main() -> None:
              key = os.environ.get("SCRAPER_API_KEY", "")
              sites = {
                  value.strip()
                  for value in os.environ.get("SCRAPER_API_SITES", "").split(",")
                  if value.strip()
              }
              if not key or "pharmonline" not in sites:
                  fail("ScraperAPI is not configured for Pharmonline on production")

              # ScraperAPI proxy mode keeps a sticky exit for this unique
              # integer session. It is intentionally not combined with the
              # premium option, which ScraperAPI documents as incompatible
              # with sticky sessions.
              session_number = secrets.randbelow(2_000_000_000) + 1
              username = f"scraperapi.session_number={session_number}"
              proxy_url = (
                  f"http://{quote(username, safe='')}:{quote(key, safe='')}"
                  "@proxy-server.scraperapi.com:8001"
              )
              timeout = httpx.Timeout(45.0, connect=15.0)
              async with httpx.AsyncClient(
                  proxy=proxy_url,
                  timeout=timeout,
                  verify=False,
                  trust_env=False,
              ) as client:
                  first_records, total, pages = await read_page(client, 1)
                  sample_pages = tuple(sorted({1, (pages + 1) // 2, pages}))
                  for page in sample_pages:
                      if page == 1:
                          continue
                      await read_page(
                          client,
                          page,
                          expected_total=total,
                          expected_pages=pages,
                      )
                  repeated, _, _ = await read_page(
                      client,
                      1,
                      expected_total=total,
                      expected_pages=pages,
                  )
                  if repeated != first_records:
                      fail("page 1 changed on an immediate repeat")
              print(
                  "ScraperAPI direct JSON probe OK: "
                  f"total={total}, pages={pages}, page_size={PAGE_SIZE}, "
                  f"sticky_session=true, sampled_pages={','.join(map(str, sample_pages))}, "
                  "repeated_page_1=identical, database=not_opened, persistence=none"
              )


          asyncio.run(main())
          PY
          REMOTE
