name: CI2-lint-plus-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm
          POSTGRES_DB: pharmacy_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pm:pm@localhost:5432/pharmacy_monitor_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-very-long-not-for-prod
      PHARMACY_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (with dev)
        run: uv sync --frozen --all-groups
      - name: Run alembic migrations
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -q
