name: Plan Pharmonline Decodo public API reconciliation (no persistence)

# This is intentionally a separate gate from the normal public-API preflight:
# existing legacy rows are expected until the reconciliation has been proven.
# It makes two fresh catalog reads and produces only aggregate evidence.
#
# The transport is chosen here and nowhere else: the apply workflow reads it
# from this plan's evidence.  decodo is the default and the only transport
# that can prove an address change or a split.  direct is for the case when
# Decodo is down and the catalog has only plain admissions to make (a burst of
# new products): it reads the catalog once, from the production host itself,
# and the plan fails if anything but a plain admission is needed.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PLAN to run the read-only reconciliation proof"
        required: true
        default: ""
      transport:
        description: "decodo: any identity change. direct: plain admissions only, when Decodo is down"
        required: true
        type: choice
        default: decodo
        options:
          - decodo
          - direct

permissions:
  actions: read
  contents: read

concurrency:
  group: pharmonline-decodo-public-api-recovery
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require explicit confirmation and matching CI
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PLAN"
          ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          case "$ci_run_id" in
            ''|*[!0-9]*)
              echo "a successful Pharmacy Monitor CI run is required for this commit" >&2
              exit 1
              ;;
          esac
          echo "matching_ci_run_id=$ci_run_id"

      - uses: actions/checkout@v4

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDVrem8NrMZMjV9cDiB8/8wOwOn1wrfSU7S5vfaLHM+R' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:Hx7TYOZC2diIb6ZwI9LRv4bybasYCijb+lKnQQmGk/I'

      - name: Check production capacity and scraper state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          if systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service; then
            echo "refusing reconciliation plan: a Pharmonline scrape is already active" >&2
            exit 1
          fi
          REMOTE

      - name: Stage exact source and calculate the read-only reconciliation plan
        env:
          RECONCILIATION_TRANSPORT: ${{ inputs.transport }}
        run: |
          set -euo pipefail
          case "$RECONCILIATION_TRANSPORT" in
            decodo|direct) ;;
            *)
              echo "transport must be decodo or direct" >&2
              exit 1
              ;;
          esac
          source_manifest=$(mktemp)
          trap 'rm -f "$source_manifest"' EXIT
          git ls-files -z -- src scripts/reconcile_pharmonline_public_api_identities.py |
            xargs -0 sha256sum | LC_ALL=C sort > "$source_manifest"
          test -s "$source_manifest"
          source_manifest_sha=$(sha256sum "$source_manifest" | awk '{print $1}')
          echo "source_manifest_sha256=$source_manifest_sha"
          plan_evidence_dir=$(mktemp -d "$RUNNER_TEMP/pharmonline-reconciliation-plan.XXXXXX")
          cp -- "$source_manifest" "$plan_evidence_dir/source-manifest"
          printf '%s\n' "$source_manifest_sha" > "$plan_evidence_dir/source-manifest.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$plan_evidence_dir/commit-sha"
          echo "PLAN_EVIDENCE_DIR=$plan_evidence_dir" >> "$GITHUB_ENV"
          remote_work_dir=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          work_dir=$(mktemp -d /opt/pharmacy-monitor/.codex-decodo-reconciliation-plan.XXXXXX)
          mkdir -p "$work_dir/incoming" "$work_dir/runtime/src" "$work_dir/runtime/scripts"
          printf '%s' "$work_dir"
          REMOTE
          )
          case "$remote_work_dir" in
            /opt/pharmacy-monitor/.codex-decodo-reconciliation-plan.*) ;;
            *)
              echo "unexpected remote reconciliation plan path" >&2
              exit 1
              ;;
          esac
          echo "REMOTE_WORK_DIR=$remote_work_dir" >> "$GITHUB_ENV"

          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            src/ "pm@13.140.186.143:$remote_work_dir/runtime/src/"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            scripts/reconcile_pharmonline_public_api_identities.py \
            "pm@13.140.186.143:$remote_work_dir/runtime/scripts/reconcile_pharmonline_public_api_identities.py"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            "$source_manifest" "pm@13.140.186.143:$remote_work_dir/incoming/source-manifest"

          # A retryable Decodo failure deliberately sleeps for up to five
          # minutes. Keep this long-lived plan connection alive during that
          # quiet interval so the runner does not turn it into exit 255.
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            pm@13.140.186.143 \
            "bash -s -- '$remote_work_dir' '$source_manifest_sha' '$RECONCILIATION_TRANSPORT'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          source_manifest_sha=$2
          plan_transport=$3
          # Decodo settings are passed only with Decodo: a direct plan must not
          # depend on it.
          case "$plan_transport" in
            decodo)
              transport_env=(
                PHARMONLINE_PUBLIC_API_TRANSPORT=decodo
                DECODO_SITES=pharmonline
                PHARMONLINE_DECODO_BACKCONNECT_STICKY=1
              )
              ;;
            direct)
              # One attempt at every layer: the scraper's own whole-catalog
              # retry is pinned too, whatever the server environment says.
              transport_env=(
                PHARMONLINE_PUBLIC_API_TRANSPORT=direct
                PHARMONLINE_PUBLIC_API_CATALOG_ATTEMPTS=1
              )
              ;;
            *)
              echo "unexpected reconciliation plan transport" >&2
              exit 1
              ;;
          esac
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-decodo-reconciliation-plan.*) ;;
            *)
              echo "unexpected remote reconciliation plan path" >&2
              exit 1
              ;;
          esac
          runtime_dir="$work_dir/runtime"
          test "$(sha256sum "$work_dir/incoming/source-manifest" | awk '{print $1}')" = \
            "$source_manifest_sha"
          (cd "$runtime_dir" && sha256sum -c "$work_dir/incoming/source-manifest")
          cd "$runtime_dir"

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<PY
          import sys
          from pathlib import Path

          import src.main
          import src.run_lock
          import src.scrapers.pharmonline_public_api
          import src.storage
          from src.main import _diagnose_pharmonline_public_api_reconciliation

          runtime = Path("$runtime_dir").resolve()
          assert Path(src.main.__file__).resolve().is_relative_to(runtime)
          assert Path(src.storage.__file__).resolve().is_relative_to(runtime)
          assert Path(src.run_lock.__file__).resolve().is_relative_to(runtime)
          assert Path(src.scrapers.pharmonline_public_api.__file__).resolve().is_relative_to(runtime)
          script = runtime / "scripts/reconcile_pharmonline_public_api_identities.py"
          assert script.is_file() and script.resolve().is_relative_to(runtime)
          assert callable(_diagnose_pharmonline_public_api_reconciliation)
          print(
              "isolated reconciliation-plan source imported: "
              f"python={sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}, "
              f"script={script.relative_to(runtime)}"
          )
          PY

          # The apply workflow makes the same check before it writes.  Here it
          # saves a catalog read from this host and an approval that could not
          # be used.
          if [ "$plan_transport" = direct ]; then
            # Admissions written by a direct reconciliation carry their own
            # proof version.  The nightly timer runs the deployed code, not
            # this checkout: code that does not know that version treats the
            # admitted products as unknown and fails every night until it is
            # deployed.  Ask the deployed code itself, before the catalog is
            # read and before anything is written; anything but an explicit
            # yes refuses.  (No command substitution around the here-document:
            # bash 5.2 fails to parse one after a continued line.)  The answer
            # goes to a file in this run's own fresh work directory.
            deployed_code_answer="$work_dir/deployed-code-knows-direct"
            (
              cd /opt/pharmacy-monitor || exit 1
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/opt/pharmacy-monitor \
                /opt/pharmacy-monitor/.venv/bin/python - > "$deployed_code_answer" <<'PY'
          from pathlib import Path

          from src import main

          # The deployed copy, not the staged one and not an installed package.
          assert Path(main.__file__).resolve() == Path("/opt/pharmacy-monitor/src/main.py").resolve()
          rules = getattr(main, "_PHARMONLINE_PUBLIC_API_ADMISSION_RULES_BY_PROOF", {})
          print("yes" if "public_api_manual_direct_admission_v1" in rules else "no")
          PY
            ) || true
            if [ "$(cat "$deployed_code_answer" 2>/dev/null || true)" != yes ]; then
              echo "refusing direct reconciliation: the deployed code does not recognise direct admissions (public_api_manual_direct_admission_v1); deploy this commit with deploy.yml first, then dispatch again" >&2
              exit 1
            fi
            echo "deployed code recognises direct admissions"
          fi

          # EnvironmentFile values are literal systemd values, not shell code.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          env "${transport_env[@]}" \
          PHARMONLINE_PUBLIC_API=required \
          PHARMONLINE_PUBLIC_API_LOCK_WAIT_SECONDS=2700 \
          PHARMONLINE_PUBLIC_API_PLAN_EVIDENCE_PATH="$work_dir/plan-evidence.json" \
          PHARMONLINE_USE_DDP=0 \
          AI_FALLBACK_ENABLED=0 \
          SCRAPE_REPORT_EMAIL=0 \
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH="$runtime_dir" \
          /opt/pharmacy-monitor/.venv/bin/python \
            "$runtime_dir/scripts/reconcile_pharmonline_public_api_identities.py"
          REMOTE

          scp -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "pm@13.140.186.143:$remote_work_dir/plan-evidence.json" \
            "$plan_evidence_dir/reconciliation-plan.json"
          PLAN_EVIDENCE_FILE="$plan_evidence_dir/reconciliation-plan.json" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PLAN_EVIDENCE_FILE"])
          data = json.loads(path.read_text())
          required = {
              "version",
              "transport",
              "product_count",
              "catalog_fingerprint_sha256",
              "candidate_manifest_sha256",
              "metrics",
          }
          if set(data) != required:
              raise SystemExit("unexpected reconciliation plan evidence shape")
          transport = os.environ["RECONCILIATION_TRANSPORT"]
          if transport not in ("decodo", "direct"):
              raise SystemExit("reconciliation plan transport is invalid")
          if data["version"] != 3 or data["transport"] != transport:
              raise SystemExit("reconciliation plan evidence transport/version is invalid")
          if not isinstance(data["product_count"], int) or data["product_count"] < 9000:
              raise SystemExit("reconciliation plan evidence product count is invalid")
          for key in ("catalog_fingerprint_sha256", "candidate_manifest_sha256"):
              value = data[key]
              if not isinstance(value, str) or len(value) != 64 or any(
                  character not in "0123456789abcdef" for character in value
              ):
                  raise SystemExit(f"reconciliation plan evidence {key} is invalid")
          metrics = data["metrics"]
          if not isinstance(metrics, dict) or metrics.get("reconciliation_safe") != 1:
              raise SystemExit("reconciliation plan evidence is not safe")
          if transport == "direct":
              # A direct plan carries plain admissions only.  The script
              # refuses anything else itself; this is the second line, read
              # from the evidence that the apply workflow will be given.
              for key in (
                  "legacy_rekeys_ready",
                  "native_id_url_rebind",
                  "native_id_url_rebind_ready",
                  "native_id_url_rebind_redirect_ready",
                  "identity_splits_ready",
              ):
                  if type(metrics.get(key)) is not int or metrics[key] != 0:
                      raise SystemExit(
                          f"direct reconciliation plan has an identity transition: {key}"
                      )
          print(
              "aggregate reconciliation evidence retained: "
              f"products={data['product_count']}, version={data['version']}, "
              f"transport={transport}"
          )
          PY

      - name: Retain exact plan manifest
        if: ${{ success() && env.PLAN_EVIDENCE_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pharmonline-reconciliation-plan-evidence
          path: ${{ env.PLAN_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated read-only plan workspace
        if: ${{ always() && env.REMOTE_WORK_DIR != '' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 "bash -s -- '$REMOTE_WORK_DIR'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-decodo-reconciliation-plan.*) ;;
            *)
              echo "unexpected remote reconciliation plan cleanup path" >&2
              exit 1
              ;;
          esac
          rm -rf -- "$work_dir"
          REMOTE
