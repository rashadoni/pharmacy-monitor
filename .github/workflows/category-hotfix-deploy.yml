name: Deploy category comparison hotfix

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: api.py and analytics.py hotfix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 13.140.186.143 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup and deploy category comparison files
        run: |
          set -euo pipefail
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"
          backup_dir="/tmp/category-hotfix-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          $ssh_base pm@13.140.186.143 \
            "set -euo pipefail
             mkdir -- '$backup_dir'
             test -w /opt/pharmacy-monitor/src/api.py
             test -w /opt/pharmacy-monitor/src/analytics.py
             cp -- /opt/pharmacy-monitor/src/api.py '$backup_dir/api.py'
             cp -- /opt/pharmacy-monitor/src/analytics.py '$backup_dir/analytics.py'"
          printf 'BACKUP_DIR=%s\n' "$backup_dir" >> "$GITHUB_ENV"

          for file in api.py analytics.py
          do
            rsync -z --checksum --inplace --no-perms --no-owner --no-group \
              -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
              "src/$file" "pm@13.140.186.143:/opt/pharmacy-monitor/src/$file"
          done

      - name: Verify, restart API, and health check
        run: |
          set -euo pipefail
          ssh_base="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15"

          for file in api.py analytics.py
          do
            local_sha=$(sha256sum "src/$file" | awk '{print $1}')
            remote_sha=$($ssh_base pm@13.140.186.143 \
              "sha256sum '/opt/pharmacy-monitor/src/$file'" | awk '{print $1}')
            test "$local_sha" = "$remote_sha"
          done

          $ssh_base pm@13.140.186.143 \
            'cd /opt/pharmacy-monitor &&
             PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m py_compile src/api.py src/analytics.py &&
             sudo -n /usr/bin/systemctl restart pharmacy-monitor-api.service'
          sleep 5
          $ssh_base pm@13.140.186.143 \
            'curl -fsS http://127.0.0.1:8080/health >/dev/null && echo "API ok"'

      - name: Category comparison production smoke
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            'set -euo pipefail
             cd /opt/pharmacy-monitor
             db_url=$(grep -m1 "^DATABASE_URL=" /etc/pharmacy-monitor/env | cut -d= -f2-)
             test -n "$db_url"
             DATABASE_URL="$db_url" .venv/bin/python -c "
          from sqlalchemy import func, select
          from src import analytics, storage
          Session = storage.make_session()
          with Session() as session:
              tenant_ids = session.scalars(select(storage.TenantUser.tenant_id).distinct()).all()
              for tenant_id in tenant_ids:
                  matches = session.scalar(
                      select(func.count()).select_from(storage.Match).where(
                          storage.Match.tenant_id == tenant_id
                      )
                  )
                  rows = analytics.category_comparison(
                      session,
                      client_site=\"pharmonline\",
                      tenant_id=tenant_id,
                      canonical=True,
                  )
                  print(
                      f\"tenant={tenant_id} matches={matches} category_rows={len(rows)} \"
                      f\"matched_skus={sum(row.matched_skus for row in rows)}\"
                  )
          "'

      - name: Roll back after failed verification
        if: ${{ failure() && env.BACKUP_DIR != '' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            "set -euo pipefail
             cp -- '$BACKUP_DIR/api.py' /opt/pharmacy-monitor/src/api.py
             cp -- '$BACKUP_DIR/analytics.py' /opt/pharmacy-monitor/src/analytics.py
             sudo -n /usr/bin/systemctl restart pharmacy-monitor-api.service"
