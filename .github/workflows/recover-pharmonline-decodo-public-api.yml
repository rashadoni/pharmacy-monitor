name: Reconcile and recover Pharmonline catalog via verified Decodo public API

# This is the only write-enabled Decodo route.  It never replaces the running
# production source tree.  A successful exact-commit, read-only reconciliation
# plan is required first; the job then stages its own verified source, retains a
# production DB backup, creates the additive audit schema, performs the guarded
# in-place legacy ID rekey, and only then publishes a verified full catalog.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECONCILE to apply the proven Decodo reconciliation"
        required: true
        default: ""
      plan_run_id:
        description: "Successful no-write Decodo reconciliation-plan run ID for this commit"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: pharmonline-decodo-public-api-recovery
  cancel-in-progress: false

jobs:
  reconcile-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Require explicit reconciliation confirmation and matching plan
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RECONCILE"
          case "$PLAN_RUN_ID" in
            ''|*[!0-9]*)
              echo "plan_run_id must be a numeric GitHub Actions run ID" >&2
              exit 1
              ;;
          esac
          metadata=$(gh run view "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,workflowName,headSha \
            --jq '[.conclusion, .workflowName, .headSha] | @tsv')
          IFS=$'\t' read -r conclusion workflow_name head_sha <<EOF
          $metadata
          EOF
          test "$conclusion" = "success"
          test "$workflow_name" = \
            "Plan Pharmonline Decodo public API reconciliation (no persistence)"
          test "$head_sha" = "$GITHUB_SHA"
          ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          case "$ci_run_id" in
            ''|*[!0-9]*)
              echo "a successful Pharmacy Monitor CI run is required for this commit" >&2
              exit 1
              ;;
          esac
          echo "matching_ci_run_id=$ci_run_id"

      - uses: actions/checkout@v4

      - name: Download and verify the exact plan manifest
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan_evidence_dir=$(mktemp -d "$RUNNER_TEMP/pharmonline-reconciliation-plan-evidence.XXXXXX")
          gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pharmonline-reconciliation-plan-evidence \
            --dir "$plan_evidence_dir"
          test "$(tr -d '\r\n' < "$plan_evidence_dir/commit-sha")" = "$GITHUB_SHA"
          expected_plan_manifest_sha=$(tr -d '\r\n' < "$plan_evidence_dir/source-manifest.sha256")
          test "$expected_plan_manifest_sha" = \
            "$(sha256sum "$plan_evidence_dir/source-manifest" | awk '{print $1}')"

          current_plan_manifest=$(mktemp)
          trap 'rm -f "$current_plan_manifest"' EXIT
          git ls-files -z -- src scripts/reconcile_pharmonline_public_api_identities.py |
            xargs -0 sha256sum | LC_ALL=C sort > "$current_plan_manifest"
          cmp -s -- "$plan_evidence_dir/source-manifest" "$current_plan_manifest"
          PLAN_EVIDENCE_FILE="$plan_evidence_dir/reconciliation-plan.json" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["PLAN_EVIDENCE_FILE"]).read_text())
          required = {
              "version",
              "transport",
              "product_count",
              "catalog_fingerprint_sha256",
              "candidate_manifest_sha256",
              "metrics",
          }
          if set(data) != required or data["version"] != 3 or data["transport"] != "decodo":
              raise SystemExit("approved reconciliation plan evidence is invalid")
          if not isinstance(data["product_count"], int) or data["product_count"] < 9500:
              raise SystemExit("approved reconciliation plan product count is invalid")
          for key in ("catalog_fingerprint_sha256", "candidate_manifest_sha256"):
              value = data[key]
              if not isinstance(value, str) or len(value) != 64 or any(
                  character not in "0123456789abcdef" for character in value
              ):
                  raise SystemExit(f"approved reconciliation plan {key} is invalid")
          metrics = data["metrics"]
          if not isinstance(metrics, dict) or metrics.get("reconciliation_safe") != 1:
              raise SystemExit("approved reconciliation plan is not safe")
          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a") as output:
              output.write(
                  "PLAN_CATALOG_FINGERPRINT_SHA256="
                  f"{data['catalog_fingerprint_sha256']}\n"
              )
              output.write(
                  "PLAN_CANDIDATE_MANIFEST_SHA256="
                  f"{data['candidate_manifest_sha256']}\n"
              )
              output.write(f"PLAN_PRODUCT_COUNT={data['product_count']}\n")
          print(
              "exact aggregate reconciliation plan evidence verified: "
              f"products={data['product_count']}"
          )
          PY
          echo "verified_plan_manifest_sha256=$expected_plan_manifest_sha"

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Check production capacity and writer state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          for unit in \
            pharmacy-monitor-scrape@pharmonline.service \
            pharmacy-monitor-health.service
          do
            if systemctl is-active --quiet "$unit"; then
              echo "refusing reconciliation: $unit is active" >&2
              exit 1
            fi
          done
          REMOTE

      - name: Stage source, back up production, reconcile, and recover catalog
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          plan_manifest=$(mktemp)
          source_manifest=$(mktemp)
          trap 'rm -f "$plan_manifest" "$source_manifest"' EXIT
          git ls-files -z -- src scripts/reconcile_pharmonline_public_api_identities.py |
            xargs -0 sha256sum | LC_ALL=C sort > "$plan_manifest"
          git ls-files -z -- \
            src \
            migrations \
            templates \
            scripts/reconcile_pharmonline_public_api_identities.py \
            alembic.ini |
            xargs -0 sha256sum | LC_ALL=C sort > "$source_manifest"
          test -s "$plan_manifest"
          test -s "$source_manifest"
          source_manifest_sha=$(sha256sum "$source_manifest" | awk '{print $1}')
          echo "apply_source_manifest_sha256=$source_manifest_sha"

          remote_work_dir=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          work_dir=$(mktemp -d /opt/pharmacy-monitor/.codex-decodo-reconciliation-apply.XXXXXX)
          mkdir -p "$work_dir/incoming" "$work_dir/runtime/src" \
            "$work_dir/runtime/scripts" "$work_dir/runtime/migrations" \
            "$work_dir/runtime/templates"
          printf '%s' "$work_dir"
          REMOTE
          )
          case "$remote_work_dir" in
            /opt/pharmacy-monitor/.codex-decodo-reconciliation-apply.*) ;;
            *)
              echo "unexpected remote reconciliation apply path" >&2
              exit 1
              ;;
          esac
          echo "REMOTE_WORK_DIR=$remote_work_dir" >> "$GITHUB_ENV"
          echo "REMOTE_SOURCE_MANIFEST_SHA=$source_manifest_sha" >> "$GITHUB_ENV"

          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            src/ "pm@46.225.149.52:$remote_work_dir/runtime/src/"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            migrations/ "pm@46.225.149.52:$remote_work_dir/runtime/migrations/"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            templates/ "pm@46.225.149.52:$remote_work_dir/runtime/templates/"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            scripts/reconcile_pharmonline_public_api_identities.py \
            "pm@46.225.149.52:$remote_work_dir/runtime/scripts/reconcile_pharmonline_public_api_identities.py"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            alembic.ini "pm@46.225.149.52:$remote_work_dir/runtime/alembic.ini"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            "$plan_manifest" "pm@46.225.149.52:$remote_work_dir/incoming/plan-source-manifest"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            "$source_manifest" "pm@46.225.149.52:$remote_work_dir/incoming/source-manifest"

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            pm@46.225.149.52 \
            "bash -s -- '$remote_work_dir' '$source_manifest_sha' '$PLAN_RUN_ID' '$PLAN_CATALOG_FINGERPRINT_SHA256' '$PLAN_CANDIDATE_MANIFEST_SHA256' '$PLAN_PRODUCT_COUNT'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          source_manifest_sha=$2
          plan_run_id=$3
          expected_plan_fingerprint=$4
          expected_plan_manifest=$5
          expected_plan_product_count=$6
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-decodo-reconciliation-apply.*) ;;
            *)
              echo "unexpected remote reconciliation apply path" >&2
              exit 1
              ;;
          esac
          if [[ ! "$expected_plan_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid approved catalog fingerprint" >&2
            exit 1
          fi
          if [[ ! "$expected_plan_manifest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid approved candidate manifest" >&2
            exit 1
          fi
          case "$expected_plan_product_count" in
            ''|*[!0-9]*) echo "invalid approved product count" >&2; exit 1 ;;
          esac
          runtime_dir="$work_dir/runtime"
          test "$(sha256sum "$work_dir/incoming/source-manifest" | awk '{print $1}')" = \
            "$source_manifest_sha"
          (cd "$runtime_dir" && sha256sum -c "$work_dir/incoming/plan-source-manifest")
          (cd "$runtime_dir" && sha256sum -c "$work_dir/incoming/source-manifest")
          echo "exact isolated reconciliation source manifests verified"
          cd "$runtime_dir"

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<PY
          import sys
          from pathlib import Path

          import src.main
          import src.run_lock
          import src.scrapers.pharmonline_public_api
          import src.storage

          runtime = Path("$runtime_dir").resolve()
          for module in (
              src.main,
              src.storage,
              src.run_lock,
              src.scrapers.pharmonline_public_api,
          ):
              assert Path(module.__file__).resolve().is_relative_to(runtime)
          script = runtime / "scripts/reconcile_pharmonline_public_api_identities.py"
          assert script.is_file() and script.resolve().is_relative_to(runtime)
          print(
              "isolated Decodo reconciliation source imported: "
              f"python={sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}, "
              f"script={script.relative_to(runtime)}"
          )
          PY

          # EnvironmentFile values are literal systemd values, not shell code.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          backup_path="$work_dir/production-before-reconciliation.dump"
          BACKUP_PATH="$backup_path" PYTHONDONTWRITEBYTECODE=1 \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          backup_path = Path(os.environ["BACKUP_PATH"])
          database_url = os.environ.get("DATABASE_URL", "")
          if not database_url:
              raise SystemExit("DATABASE_URL is required for a production backup")
          url = make_url(database_url)
          if not url.database:
              raise SystemExit("DATABASE_URL does not identify a database")
          engine = create_engine(database_url, pool_pre_ping=True)
          try:
              with engine.connect() as connection:
                  database_size = int(
                      connection.scalar(text("SELECT pg_database_size(current_database())"))
                  )
          finally:
              engine.dispose()
          free_bytes = shutil.disk_usage(backup_path.parent).free
          safety_margin_bytes = 1024 * 1024 * 1024
          if free_bytes < database_size + safety_margin_bytes:
              raise SystemExit(
                  "insufficient disk for immutable production backup: "
                  f"free_bytes={free_bytes}, database_bytes={database_size}"
              )
          if shutil.which("pg_dump") is None:
              raise SystemExit("pg_dump is required before reconciliation")
          env = os.environ.copy()
          if url.host:
              env["PGHOST"] = url.host
          if url.port:
              env["PGPORT"] = str(url.port)
          if url.username:
              env["PGUSER"] = url.username
          if url.password is not None:
              env["PGPASSWORD"] = url.password
          if url.query.get("sslmode"):
              env["PGSSLMODE"] = url.query["sslmode"]
          subprocess.run(
              [
                  "pg_dump",
                  "--format=custom",
                  "--no-owner",
                  "--no-privileges",
                  f"--file={backup_path}",
                  url.database,
              ],
              check=True,
              env=env,
          )
          if not backup_path.is_file() or backup_path.stat().st_size < 1:
              raise SystemExit("production backup was not created")
          print(
              "immutable production backup created: "
              f"database_bytes={database_size}, backup_bytes={backup_path.stat().st_size}"
          )
          PY

          cd "$runtime_dir"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python -m alembic -c "$runtime_dir/alembic.ini" upgrade head
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python -m alembic -c "$runtime_dir/alembic.ini" current | \
            grep -F '0021_public_api_quarantines'

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          from src import storage
          from src.main import _pharmonline_public_api_recovery_tables_available

          Session = storage.make_session()
          with Session() as session:
              if not _pharmonline_public_api_recovery_tables_available(session):
                  raise SystemExit("reconciliation audit schema is not available after migration")
          print("reconciliation audit schema verified")
          PY

          PHARMONLINE_PUBLIC_API=required \
          PHARMONLINE_PUBLIC_API_TRANSPORT=decodo \
          PHARMONLINE_DECODO_BACKCONNECT_STICKY=1 \
          PHARMONLINE_PUBLIC_API_LOCK_WAIT_SECONDS=2700 \
          PHARMONLINE_USE_DDP=0 \
          AI_FALLBACK_ENABLED=0 \
          SCRAPE_REPORT_EMAIL=0 \
          PHARMONLINE_PUBLIC_API_SOURCE_MANIFEST_SHA256="$source_manifest_sha" \
          PHARMONLINE_PUBLIC_API_PREFLIGHT_RUN_REF="$plan_run_id" \
          PHARMONLINE_PUBLIC_API_EXPECTED_PLAN_CATALOG_FINGERPRINT_SHA256="$expected_plan_fingerprint" \
          PHARMONLINE_PUBLIC_API_EXPECTED_PLAN_MANIFEST_SHA256="$expected_plan_manifest" \
          PHARMONLINE_PUBLIC_API_EXPECTED_PLAN_PRODUCT_COUNT="$expected_plan_product_count" \
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH="$runtime_dir" \
          /opt/pharmacy-monitor/.venv/bin/python \
            "$runtime_dir/scripts/reconcile_pharmonline_public_api_identities.py" --apply

          # The guarded apply intentionally reads the full public catalog twice
          # before it writes.  Give the first-party API a complete cooling
          # window before the independent, persisted full-catalog run below:
          # a third back-to-back full pass has previously been rate-limited.
          # This is a wait only; no producer lock or database transaction is
          # kept open, and the final run still proves its own catalog before it
          # can publish data.
          decodo_publish_cooldown_seconds=1860
          echo "Decodo verified-source cooldown before catalog publication: ${decodo_publish_cooldown_seconds}s"
          sleep "$decodo_publish_cooldown_seconds"

          before_run_id=$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          from sqlalchemy import text

          from src import storage

          Session = storage.make_session()
          with Session() as session:
              print(
                  session.execute(
                      text("SELECT COALESCE(MAX(id), 0) FROM runs WHERE tenant_id = 1")
                  ).scalar_one()
              )
          PY
          )
          case "$before_run_id" in
            ''|*[!0-9]*)
              echo "could not determine prior production run ID" >&2
              exit 1
              ;;
          esac

          publish_attempt=1
          publish_succeeded=0
          while [ "$publish_attempt" -le 3 ]; do
            echo "verified catalog publication attempt ${publish_attempt}/3"
            if PHARMONLINE_PUBLIC_API=required \
              PHARMONLINE_PUBLIC_API_TRANSPORT=decodo \
              PHARMONLINE_DECODO_BACKCONNECT_STICKY=1 \
              PHARMONLINE_PUBLIC_API_REQUIRE_CATALOG_BASELINE=required \
              PHARMONLINE_USE_DDP=0 \
              AI_FALLBACK_ENABLED=0 \
              SCRAPE_REPORT_EMAIL=0 \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH="$runtime_dir" \
              /opt/pharmacy-monitor/.venv/bin/python -m src.main run \
                --site pharmonline \
                --mode public_api \
                --dry-run \
                --no-alerts
            then
              publish_succeeded=1
              break
            fi
            if [ "$publish_attempt" -lt 3 ]; then
              echo "verified catalog publication attempt failed; waiting 60s before a fresh Decodo session" >&2
              sleep 60
            fi
            publish_attempt=$((publish_attempt + 1))
          done
          test "$publish_succeeded" -eq 1

          BEFORE_RUN_ID="$before_run_id" PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$runtime_dir" /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          import json
          import os

          from sqlalchemy import text

          from src import storage

          before_run_id = int(os.environ["BEFORE_RUN_ID"])
          Session = storage.make_session()
          with Session() as session:
              audit_count = int(
                  session.scalar(
                      text(
                          "SELECT COUNT(*) "
                          "FROM pharmonline_public_api_identity_reconciliations "
                          "WHERE tenant_id = 1"
                      )
                  )
                  or 0
              )
              quarantine_count = int(
                  session.scalar(
                      text(
                          "SELECT COUNT(*) "
                          "FROM pharmonline_public_api_identity_quarantines "
                          "WHERE tenant_id = 1"
                      )
                  )
                  or 0
              )
              catalog_floor = int(
                  session.scalar(
                      text(
                          "SELECT COALESCE(MAX(minimum_catalog_item_count), 0) "
                          "FROM pharmonline_public_api_catalog_baselines "
                          "WHERE tenant_id = 1"
                      )
                  )
                  or 0
              )
              row = session.execute(
                  text(
                      """
                      SELECT id, status, catalog_scope, catalog_verified,
                             catalog_verification_reason, products_scraped,
                             products_per_site, run_quality
                      FROM runs
                      WHERE tenant_id = 1
                        AND full_catalog_sites = 'pharmonline'
                        AND id > :before_run_id
                      ORDER BY id DESC
                      LIMIT 1
                      """
                  ),
                  {"before_run_id": before_run_id},
              ).mappings().one_or_none()

          if row is None:
              raise SystemExit("no Pharmonline full-catalog run was created")
          quality = row["run_quality"] or {}
          site_quality = (quality.get("sites") or {}).get("pharmonline") or {}
          evidence = {
              "run_id": row["id"],
              "status": row["status"],
              "catalog_scope": row["catalog_scope"],
              "catalog_verified": bool(row["catalog_verified"]),
              "catalog_verification_reason": row["catalog_verification_reason"],
              "products_scraped": row["products_scraped"],
              "pharmonline_products": (row["products_per_site"] or {}).get("pharmonline"),
              "quality_status": site_quality.get("status"),
              "full_catalog_verified": quality.get("full_catalog_verified"),
              "reconciliation_audit_records": audit_count,
              "quarantine_audit_records": quarantine_count,
              "public_api_catalog_floor": catalog_floor,
          }
          print("Recovered Pharmonline Decodo evidence: " + json.dumps(evidence, sort_keys=True))
          if (
              row["status"] != "ok"
              or row["catalog_scope"] != "full"
              or not row["catalog_verified"]
              or quality.get("full_catalog_verified") is not True
              or site_quality.get("status") != "ok"
              or int(row["products_scraped"] or 0) < 1
              or catalog_floor < 1
          ):
              raise SystemExit("reconciliation did not produce a verified successful catalog")
          PY

          : > "$work_dir/reconciliation-and-catalog-recovery-verified"
          echo "verified Decodo reconciliation and catalog recovery completed"
          REMOTE

      - name: Retain recovery evidence and immutable backup
        if: ${{ always() && env.REMOTE_WORK_DIR != '' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            "bash -s -- '$REMOTE_WORK_DIR' '$REMOTE_SOURCE_MANIFEST_SHA'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          source_manifest_sha=$2
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-decodo-reconciliation-apply.*) ;;
            *)
              echo "unexpected remote reconciliation apply path" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$work_dir/incoming/source-manifest" ]; then
            echo "recovery staging did not complete; no production backup was created" >&2
            exit 0
          fi
          test "$(sha256sum "$work_dir/incoming/source-manifest" | awk '{print $1}')" = \
            "$source_manifest_sha"
          test -f "$work_dir/production-before-reconciliation.dump"
          if [ -f "$work_dir/reconciliation-and-catalog-recovery-verified" ]; then
            echo "verified recovery evidence and immutable backup retained"
          else
            echo "recovery did not complete; staged evidence and backup retained for audit" >&2
          fi
          REMOTE
