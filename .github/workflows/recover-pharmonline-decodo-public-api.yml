name: Recover Pharmonline catalog via verified Decodo public API

# The only write-enabled Decodo path. It can run only after the matching full
# no-write Decodo preflight on the same commit and a successful CI run.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECOVER to start the verified Decodo recovery"
        required: true
        default: ""
      preflight_run_id:
        description: "Successful Decodo no-write preflight run ID for this commit"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: pharmonline-decodo-public-api-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require explicit recovery confirmation and matching preflight
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RECOVER"
          case "$PREFLIGHT_RUN_ID" in
            ''|*[!0-9]*)
              echo "preflight_run_id must be a numeric GitHub Actions run ID" >&2
              exit 1
              ;;
          esac
          metadata=$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,workflowName,headSha \
            --jq '[.conclusion, .workflowName, .headSha] | @tsv')
          IFS=$'\t' read -r conclusion workflow_name head_sha <<EOF
          $metadata
          EOF
          test "$conclusion" = "success"
          test "$workflow_name" = \
            "Preflight full Pharmonline Decodo public API recovery (no persistence)"
          test "$head_sha" = "$GITHUB_SHA"
          ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          case "$ci_run_id" in
            ''|*[!0-9]*)
              echo "a successful Pharmacy Monitor CI run is required for this commit" >&2
              exit 1
              ;;
          esac
          echo "matching_ci_run_id=$ci_run_id"

      - uses: actions/checkout@v4

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Check production capacity and exact staged source
        run: |
          set -euo pipefail
          local_sha=$(sha256sum src/scrapers/pharmonline_public_api.py | awk '{print $1}')
          remote_sha=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            "sha256sum /opt/pharmacy-monitor/src/scrapers/pharmonline_public_api.py" | awk '{print $1}')
          test "$local_sha" = "$remote_sha"
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          if systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service; then
            echo "refusing recovery: a Pharmonline scrape is already active" >&2
            exit 1
          fi
          REMOTE

      - name: Run guarded full Decodo public-API recovery
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/pharmacy-monitor
          # Preserve dollar signs and other literal credential characters.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          PHARMONLINE_PUBLIC_API=required \
          PHARMONLINE_PUBLIC_API_TRANSPORT=decodo \
          PHARMONLINE_USE_DDP=0 \
          AI_FALLBACK_ENABLED=0 \
          SCRAPE_REPORT_EMAIL=0 \
          PYTHONDONTWRITEBYTECODE=1 \
          .venv/bin/pharmacy-monitor run \
            --site pharmonline \
            --mode public_api \
            --dry-run \
            --no-alerts
          REMOTE

      - name: Verify recovered run directly in production Postgres
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/pharmacy-monitor
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
          import json
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  row = connection.execute(
                      text(
                          """
                          SELECT id, status, catalog_scope, catalog_verified,
                                 catalog_verification_reason, products_scraped,
                                 products_per_site, run_quality
                          FROM runs
                          WHERE tenant_id = 1
                            AND full_catalog_sites = 'pharmonline'
                          ORDER BY id DESC
                          LIMIT 1
                          """
                      )
                  ).mappings().one_or_none()
          finally:
              engine.dispose()

          if row is None:
              raise SystemExit("no Pharmonline full-catalog run was created")
          quality = row["run_quality"] or {}
          site_quality = (quality.get("sites") or {}).get("pharmonline") or {}
          evidence = {
              "run_id": row["id"],
              "status": row["status"],
              "catalog_scope": row["catalog_scope"],
              "catalog_verified": bool(row["catalog_verified"]),
              "catalog_verification_reason": row["catalog_verification_reason"],
              "products_scraped": row["products_scraped"],
              "pharmonline_products": (row["products_per_site"] or {}).get("pharmonline"),
              "quality_status": site_quality.get("status"),
              "full_catalog_verified": quality.get("full_catalog_verified"),
          }
          print("Recovered Pharmonline Decodo run evidence: " + json.dumps(evidence, sort_keys=True))
          if (
              row["status"] != "ok"
              or row["catalog_scope"] != "full"
              or not row["catalog_verified"]
              or quality.get("full_catalog_verified") is not True
              or site_quality.get("status") != "ok"
              or int(row["products_scraped"] or 0) < 1
          ):
              raise SystemExit("recovery did not produce a verified successful Pharmonline catalog")
          PY
          REMOTE
