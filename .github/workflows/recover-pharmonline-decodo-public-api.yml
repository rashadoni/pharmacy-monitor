name: Recover Pharmonline catalog via verified Decodo public API

# The only write-enabled Decodo path. It can run only after the matching full
# no-write Decodo preflight on the same commit and a successful CI run.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECOVER to start the verified Decodo recovery"
        required: true
        default: ""
      preflight_run_id:
        description: "Successful Decodo no-write preflight run ID for this commit"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: pharmonline-decodo-public-api-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require explicit recovery confirmation and matching preflight
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RECOVER"
          case "$PREFLIGHT_RUN_ID" in
            ''|*[!0-9]*)
              echo "preflight_run_id must be a numeric GitHub Actions run ID" >&2
              exit 1
              ;;
          esac
          metadata=$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,workflowName,headSha \
            --jq '[.conclusion, .workflowName, .headSha] | @tsv')
          IFS=$'\t' read -r conclusion workflow_name head_sha <<EOF
          $metadata
          EOF
          test "$conclusion" = "success"
          test "$workflow_name" = \
            "Preflight full Pharmonline Decodo public API recovery (no persistence)"
          test "$head_sha" = "$GITHUB_SHA"
          ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          case "$ci_run_id" in
            ''|*[!0-9]*)
              echo "a successful Pharmacy Monitor CI run is required for this commit" >&2
              exit 1
              ;;
          esac
          echo "matching_ci_run_id=$ci_run_id"

      - uses: actions/checkout@v4

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '46.225.149.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDiyv64pOCygWfx5xW3BwnwXJeHsUr/dMcTNNi+mLLPg' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:K84ezzdCeEVG96tL85e55p87BUjZzV1qnK1Tqfrnfhc'

      - name: Check production capacity and scraper state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          for unit in \
            pharmacy-monitor-scrape@pharmonline.service \
            pharmacy-monitor-health.service
          do
            if systemctl is-active --quiet "$unit"; then
              echo "refusing recovery: $unit is active" >&2
              exit 1
            fi
          done
          REMOTE

      - name: Back up and upload exact Decodo recovery source off-path
        run: |
          set -euo pipefail
          main_sha=$(sha256sum src/main.py | awk '{print $1}')
          public_api_sha=$(sha256sum src/scrapers/pharmonline_public_api.py | awk '{print $1}')
          echo "REMOTE_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          echo "REMOTE_PUBLIC_API_SHA=$public_api_sha" >> "$GITHUB_ENV"
          remote_backup=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/pharmacy-monitor
          backup_dir=$(mktemp -d /opt/pharmacy-monitor/.codex-decodo-recovery.XXXXXX)
          mkdir -p "$backup_dir/original/src/scrapers" \
            "$backup_dir/staged/src/scrapers"

          backup_one() {
            relative_path=$1
            marker=$2
            target="/opt/pharmacy-monitor/$relative_path"
            original="$backup_dir/original/$relative_path"
            if [ -f "$target" ]; then
              cp -p -- "$target" "$original"
              : > "$backup_dir/$marker"
            fi
          }

          backup_one src/main.py src_main_py.preexisting
          backup_one src/scrapers/pharmonline_public_api.py public_api_py.preexisting
          printf '%s' "$backup_dir"
          REMOTE
          )
          case "$remote_backup" in
            /opt/pharmacy-monitor/.codex-decodo-recovery.*) ;;
            *)
              echo "unexpected remote Decodo recovery backup path" >&2
              exit 1
              ;;
          esac
          echo "REMOTE_BACKUP_DIR=$remote_backup" >> "$GITHUB_ENV"

          for file in src/main.py src/scrapers/pharmonline_public_api.py
          do
            case "$file" in
              src/main.py) local_sha=$main_sha ;;
              src/scrapers/pharmonline_public_api.py) local_sha=$public_api_sha ;;
            esac
            remote_stage="$remote_backup/staged/$file"
            rsync -z --checksum --no-perms --no-owner --no-group \
              -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
              "$file" "pm@46.225.149.52:$remote_stage"
            remote_sha=$(ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              pm@46.225.149.52 "sha256sum '$remote_stage'" | awk '{print $1}')
            test "$local_sha" = "$remote_sha"
          done

      - name: Atomically activate and run verified Decodo recovery
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            "bash -s -- '$REMOTE_BACKUP_DIR' '$REMOTE_MAIN_SHA' '$REMOTE_PUBLIC_API_SHA'" <<'REMOTE'
          set -euo pipefail
          backup_dir=$1
          main_sha=$2
          public_api_sha=$3
          case "$backup_dir" in
            /opt/pharmacy-monitor/.codex-decodo-recovery.*) ;;
            *)
              echo "unexpected remote Decodo recovery backup path" >&2
              exit 1
              ;;
          esac

          rollback_one() {
            target=$1
            original=$2
            marker=$3
            staged_sha=$4
            label=$5
            if [ -f "$backup_dir/$marker" ]; then
              if [ -f "$target" ] && cmp -s -- "$original" "$target"; then
                return 0
              fi
              if [ -f "$target" ] && \
                [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
                echo "refusing to overwrite divergent $label during rollback" >&2
                return 1
              fi
              rollback_tmp=$(mktemp "$(dirname "$target")/.${label}.rollback.XXXXXX") || return 1
              if ! cp -p -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! cmp -s -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! mv -f -- "$rollback_tmp" "$target"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              cmp -s -- "$original" "$target"
              return
            fi
            if [ ! -e "$target" ]; then
              return 0
            fi
            if [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
              echo "refusing to delete divergent $label during rollback" >&2
              return 1
            fi
            rm -f -- "$target"
            test ! -e "$target"
          }

          retain_source=0
          cleanup() {
            original_status=$?
            trap - EXIT HUP INT TERM
            if [ "$retain_source" -eq 1 ]; then
              : > "$backup_dir/deployed_source_retained"
              exit "$original_status"
            fi
            set +e
            rollback_status=0
            rollback_one /opt/pharmacy-monitor/src/main.py \
              "$backup_dir/original/src/main.py" src_main_py.preexisting "$main_sha" main \
              || rollback_status=1
            rollback_one /opt/pharmacy-monitor/src/scrapers/pharmonline_public_api.py \
              "$backup_dir/original/src/scrapers/pharmonline_public_api.py" \
              public_api_py.preexisting "$public_api_sha" pharmonline_public_api \
              || rollback_status=1
            if [ "$rollback_status" -eq 0 ]; then
              : > "$backup_dir/rollback_complete"
            fi
            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            exit "$rollback_status"
          }
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap cleanup EXIT

          for unit in \
            pharmacy-monitor-scrape@pharmonline.service \
            pharmacy-monitor-health.service
          do
            if systemctl is-active --quiet "$unit"; then
              echo "refusing recovery: $unit is active" >&2
              exit 1
            fi
          done

          activate_one() {
            staged=$1
            target=$2
            expected_sha=$3
            test -f "$staged"
            test "$(sha256sum "$staged" | awk '{print $1}')" = "$expected_sha"
            test "$(stat -c '%d' "$(dirname "$staged")")" = \
              "$(stat -c '%d' "$(dirname "$target")")"
            mv -f -- "$staged" "$target"
            test "$(sha256sum "$target" | awk '{print $1}')" = "$expected_sha"
          }

          activate_one "$backup_dir/staged/src/main.py" \
            /opt/pharmacy-monitor/src/main.py "$main_sha"
          activate_one "$backup_dir/staged/src/scrapers/pharmonline_public_api.py" \
            /opt/pharmacy-monitor/src/scrapers/pharmonline_public_api.py "$public_api_sha"

          cd /opt/pharmacy-monitor
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
          from src.main import _verify_pharmonline_public_api_identities
          from src.scrapers.pharmonline_public_api import PharmonlinePublicAPIScraper

          assert callable(_verify_pharmonline_public_api_identities)
          assert PharmonlinePublicAPIScraper.__name__ == "PharmonlinePublicAPIScraper"
          print("staged Decodo recovery source imported")
          PY

          # EnvironmentFile values are literal systemd values, not shell code.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}
            export "$key=$value"
          done < /etc/pharmacy-monitor/env

          before_run_id=$(PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
          from sqlalchemy import text

          from src import storage

          Session = storage.make_session()
          with Session() as session:
              print(
                  session.execute(
                      text("SELECT COALESCE(MAX(id), 0) FROM runs WHERE tenant_id = 1")
                  ).scalar_one()
              )
          PY
          )
          case "$before_run_id" in
            ''|*[!0-9]*)
              echo "could not determine prior production run ID" >&2
              exit 1
              ;;
          esac

          PHARMONLINE_PUBLIC_API=required \
          PHARMONLINE_PUBLIC_API_TRANSPORT=decodo \
          PHARMONLINE_USE_DDP=0 \
          AI_FALLBACK_ENABLED=0 \
          SCRAPE_REPORT_EMAIL=0 \
          PYTHONDONTWRITEBYTECODE=1 \
          .venv/bin/pharmacy-monitor run \
            --site pharmonline \
            --mode public_api \
            --dry-run \
            --no-alerts

          BEFORE_RUN_ID="$before_run_id" PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
          import json
          import os

          from sqlalchemy import text

          from src import storage

          before_run_id = int(os.environ["BEFORE_RUN_ID"])
          Session = storage.make_session()
          with Session() as session:
              row = session.execute(
                      text(
                          """
                          SELECT id, status, catalog_scope, catalog_verified,
                                 catalog_verification_reason, products_scraped,
                                 products_per_site, run_quality
                          FROM runs
                          WHERE tenant_id = 1
                            AND full_catalog_sites = 'pharmonline'
                            AND id > :before_run_id
                          ORDER BY id DESC
                          LIMIT 1
                          """
                      ),
                      {"before_run_id": before_run_id},
                  ).mappings().one_or_none()

          if row is None:
              raise SystemExit("no Pharmonline full-catalog run was created")
          quality = row["run_quality"] or {}
          site_quality = (quality.get("sites") or {}).get("pharmonline") or {}
          evidence = {
              "run_id": row["id"],
              "status": row["status"],
              "catalog_scope": row["catalog_scope"],
              "catalog_verified": bool(row["catalog_verified"]),
              "catalog_verification_reason": row["catalog_verification_reason"],
              "products_scraped": row["products_scraped"],
              "pharmonline_products": (row["products_per_site"] or {}).get("pharmonline"),
              "quality_status": site_quality.get("status"),
              "full_catalog_verified": quality.get("full_catalog_verified"),
          }
          print("Recovered Pharmonline Decodo run evidence: " + json.dumps(evidence, sort_keys=True))
          if (
              row["status"] != "ok"
              or row["catalog_scope"] != "full"
              or not row["catalog_verified"]
              or quality.get("full_catalog_verified") is not True
              or site_quality.get("status") != "ok"
              or int(row["products_scraped"] or 0) < 1
          ):
              raise SystemExit("recovery did not produce a verified successful Pharmonline catalog")
          PY

          retain_source=1
          : > "$backup_dir/deployed_source_retained"
          echo "verified Decodo recovery source retained"
          REMOTE

      - name: Confirm source pair after every recovery outcome
        if: ${{ always() && env.REMOTE_BACKUP_DIR != '' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@46.225.149.52 \
            "bash -s -- '$REMOTE_BACKUP_DIR' '$REMOTE_MAIN_SHA' '$REMOTE_PUBLIC_API_SHA'" <<'REMOTE'
          set -euo pipefail
          backup_dir=$1
          main_sha=$2
          public_api_sha=$3
          case "$backup_dir" in
            /opt/pharmacy-monitor/.codex-decodo-recovery.*) ;;
            *)
              echo "unexpected remote Decodo recovery backup path" >&2
              exit 1
              ;;
          esac
          if [ -f "$backup_dir/deployed_source_retained" ]; then
            echo "verified Decodo recovery source retained"
            exit 0
          fi
          if [ -f "$backup_dir/rollback_complete" ]; then
            echo "recovery source rollback confirmed"
            exit 0
          fi

          rollback_one() {
            target=$1
            original=$2
            marker=$3
            staged_sha=$4
            label=$5
            if [ -f "$backup_dir/$marker" ]; then
              if [ -f "$target" ] && cmp -s -- "$original" "$target"; then
                return 0
              fi
              if [ -f "$target" ] && \
                [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
                echo "refusing to overwrite divergent $label during fallback rollback" >&2
                return 1
              fi
              rollback_tmp=$(mktemp "$(dirname "$target")/.${label}.rollback.XXXXXX") || return 1
              if ! cp -p -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! cmp -s -- "$original" "$rollback_tmp"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              if ! mv -f -- "$rollback_tmp" "$target"; then
                rm -f -- "$rollback_tmp"
                return 1
              fi
              cmp -s -- "$original" "$target"
              return
            fi
            if [ ! -e "$target" ]; then
              return 0
            fi
            if [ "$(sha256sum "$target" | awk '{print $1}')" != "$staged_sha" ]; then
              echo "refusing to delete divergent $label during fallback rollback" >&2
              return 1
            fi
            rm -f -- "$target"
            test ! -e "$target"
          }

          rollback_status=0
          rollback_one /opt/pharmacy-monitor/src/main.py \
            "$backup_dir/original/src/main.py" src_main_py.preexisting "$main_sha" main \
            || rollback_status=1
          rollback_one /opt/pharmacy-monitor/src/scrapers/pharmonline_public_api.py \
            "$backup_dir/original/src/scrapers/pharmonline_public_api.py" \
            public_api_py.preexisting "$public_api_sha" pharmonline_public_api \
            || rollback_status=1
          test "$rollback_status" -eq 0
          : > "$backup_dir/rollback_complete"
          echo "fallback recovery source rollback completed"
          REMOTE
