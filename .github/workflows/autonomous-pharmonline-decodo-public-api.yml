name: Autonomous Pharmonline Decodo catalog refresh

# This is the durable production path after the guarded public-API recovery.
# It intentionally runs from a checksum-verified, isolated checkout on the
# production host: a scheduled job must never depend on a manually staged
# recovery directory, nor silently fall back to the legacy DDP scraper.

on:
  schedule:
    # Недельный ритм, решение владельца 2026-10-06: полный каталог собирается раз
    # в неделю, по понедельникам. Это ЖИВОЙ путь pharmonline — systemd-таймер
    # pharmacy-monitor-scrape@pharmonline остался легаси, и прод обновляется
    # именно отсюда (сверено по Product.last_seen_at против времени прогонов).
    # Час разнесён с systemd-таймерами. GitHub Actions считает в UTC; его
    # планировщик регулярно опаздывает на часы, но день не сдвигает.
    #
    # Ритм продублирован в src/cadence.py — пороги «данные устарели» выводятся
    # оттуда. Меняешь расписание здесь — меняй и там.
    - cron: "20 03 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Shared with the guarded manual recovery workflow.  A scheduled refresh
  # must never race a recovery operator for the same verified source and DB.
  group: pharmonline-decodo-public-api-recovery
  cancel-in-progress: false

jobs:
  refresh:
    name: Verify and refresh full Pharmonline catalog
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Require successful CI for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ci_run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci-pipeline.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          case "$ci_run_id" in
            ''|null|*[!0-9]*)
              echo 'no successful CI run exists for this exact source revision' >&2
              exit 1
              ;;
          esac
          echo "verified_ci_run_id=$ci_run_id"

      - name: Set up pinned production SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDVrem8NrMZMjV9cDiB8/8wOwOn1wrfSU7S5vfaLHM+R' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = \
            'SHA256:Hx7TYOZC2diIb6ZwI9LRv4bybasYCijb+lKnQQmGk/I'

      - name: Verify the legacy timer is safely redirected to public API
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          timer=pharmacy-monitor-scrape@pharmonline.timer
          service=pharmacy-monitor-scrape@pharmonline.service
          marker=/opt/pharmacy-monitor/data/pharmonline-public-api-autonomous-v1
          test -f "$marker"
          test "$(cat "$marker")" = 'pharmonline_public_api_autonomous_v1'
          cd /opt/pharmacy-monitor
          env -u PYTHONPATH -u PHARMONLINE_PUBLIC_API_AUTONOMOUS_MARKER \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          from pathlib import Path

          from src import main

          expected = Path('/opt/pharmacy-monitor/src/main.py').resolve()
          actual = Path(main.__file__).resolve()
          assert actual == expected, f'expected deployed main.py {expected}, got {actual}'
          assert main._pharmonline_public_api_autonomous_mode_requested(
              ['pharmonline'], 'auto'
          )
          PY
          if systemctl is-active --quiet "$service"; then
            echo 'Pharmonline systemd scrape is active; refusing overlapping refresh' >&2
            exit 1
          fi
          echo "systemd_timer_state=$(systemctl is-enabled "$timer" 2>/dev/null || true)"
          echo 'systemd timer dispatch is redirected to verified public API'
          REMOTE

      - name: Check production capacity and avoid an overlapping writer
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          test -r /etc/pharmacy-monitor/env
          test -x /opt/pharmacy-monitor/.venv/bin/python

          # The legacy timer has been handed off above.  Keep this second check
          # so an operator-started service cannot consume proxy capacity in
          # parallel with the scheduled verified pass.
          if systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service; then
            echo 'Pharmonline systemd scrape is active; autonomous refresh deferred' >&2
            exit 75
          fi
          REMOTE

      - name: Stage checksum-verified runtime source
        id: stage
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          git ls-files -z -- src migrations templates alembic.ini |
            xargs -0 sha256sum | LC_ALL=C sort > "$manifest"
          test -s "$manifest"

          work_dir=$(ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 'mktemp -d /opt/pharmacy-monitor/.codex-pharmonline-auto.XXXXXX')
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-pharmonline-auto.*) ;;
            *) echo 'unexpected remote staging path' >&2; exit 1 ;;
          esac
          echo "work_dir=$work_dir" >> "$GITHUB_OUTPUT"
          echo "REMOTE_WORK_DIR=$work_dir" >> "$GITHUB_ENV"

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            "mkdir -p '$work_dir/runtime/src' '$work_dir/runtime/migrations' '$work_dir/runtime/templates' '$work_dir/incoming'"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            src/ "pm@13.140.186.143:$work_dir/runtime/src/"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            migrations/ "pm@13.140.186.143:$work_dir/runtime/migrations/"
          rsync -az --checksum --delete --no-perms --no-owner --no-group \
            --exclude='__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            templates/ "pm@13.140.186.143:$work_dir/runtime/templates/"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            alembic.ini "pm@13.140.186.143:$work_dir/runtime/alembic.ini"
          rsync -z --checksum --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15" \
            "$manifest" "pm@13.140.186.143:$work_dir/incoming/source-manifest"

      - name: Run guarded Decodo refresh with bounded fresh-session retries
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            pm@13.140.186.143 \
            "bash -s -- '$WORK_DIR'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-pharmonline-auto.*) ;;
            *) echo 'unexpected remote staging path' >&2; exit 1 ;;
          esac
          runtime_dir="$work_dir/runtime"
          cleanup() {
            rm -rf -- "$work_dir"
          }
          trap cleanup EXIT

          cd "$runtime_dir"
          sha256sum -c "$work_dir/incoming/source-manifest"

          # systemd EnvironmentFile syntax is literal KEY=VALUE, not shell
          # source.  Parse it without evaluating its contents.
          load_environment_file() {
            # systemd reads EnvironmentFile as literal NAME=VALUE lines, never as
            # shell, and this step log is public.  Nothing read from the file is
            # ever printed: the loop below has no stderr, so neither bash nor a
            # trace can speak from inside it, and a refusal names the line number
            # and nothing else.  The price: a fatal bash error inside the loop ends
            # the script without a word, so keep every branch of it under test.
            # A line is exported only if it means here what it means to systemd,
            # which drops spaces, tabs and CR around the line, the name and the
            # value and takes one pair of quotes off the value.  A line systemd
            # would skip (no "=", a bad name) or read differently (other quoting,
            # a backslash) stops the run: that is what a torn value looks like.
            # tests/test_workflow_env_file_loader.py runs this text; every workflow
            # carries the same copy, so change them together.
            local env_file=$1 env_number=0 env_refusal="" env_line="" env_name="" env_value=""
            local env_cr env_ws env_sq
            env_cr=$(printf "\r")
            env_ws=$(printf " \t")$env_cr
            env_sq=$(printf "\047")
            while IFS= read -r env_line || [ -n "$env_line" ]; do
              env_number=$((env_number + 1))
              env_line=${env_line#"${env_line%%[!"$env_ws"]*}"}
              env_line=${env_line%"${env_line##*[!"$env_ws"]}"}
              case "$env_line" in
                "") continue ;;
                *"$env_cr"*) env_refusal="a carriage return inside the line"; break ;;
                \#*|\;*) continue ;;
                *=*) ;;
                *) env_refusal="not NAME=VALUE"; break ;;
              esac
              env_name=${env_line%%=*}
              env_name=${env_name%"${env_name##*[!"$env_ws"]}"}
              env_value=${env_line#*=}
              env_value=${env_value#"${env_value%%[!"$env_ws"]*}"}
              if ! [[ $env_name =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                env_refusal="the name is not a variable name"; break
              fi
              case "$env_value" in
                \"*\")
                  env_value=${env_value#\"}
                  env_value=${env_value%\"}
                  case "$env_value" in
                    *[\"\\]*) env_refusal="quoting systemd reads differently"; break ;;
                  esac ;;
                "$env_sq"*"$env_sq")
                  env_value=${env_value#"$env_sq"}
                  env_value=${env_value%"$env_sq"}
                  case "$env_value" in
                    *"$env_sq"*) env_refusal="quoting systemd reads differently"; break ;;
                  esac ;;
                \"*|"$env_sq"*)
                  env_refusal="quoting systemd reads differently"; break ;;
                *\\*)
                  env_refusal="a backslash systemd reads differently"; break ;;
              esac
              # Some names cannot carry a value from the file.  env_* is the state
              # of this function; PS4 and BASH_* reconfigure the running shell
              # (BASH_ARGV0 renames it in every later message).  Under a name bash
              # holds as a number (OPTIND, SECONDS, UID) the value would be computed,
              # that is executed, instead of stored.  A read-only name (SHELLOPTS)
              # ends bash on the spot, hence the subshell first.  And bash keeps its
              # own value for the names it computes (GROUPS), so what was exported
              # is read back.
              env_refusal="the name belongs to bash or to this loader"
              case "$env_name" in
                env_*|BASH_*|PS4) break ;;
              esac
              if [[ -v $env_name && ${!env_name@a} == *i* ]]; then
                break
              fi
              (export "$env_name=$env_value") || break
              export "$env_name=$env_value" || break
              [[ ${!env_name-} == "$env_value" ]] || break
              env_refusal=""
            # A directory opens like a file and then reads as an empty one.
            done 2> /dev/null < "$env_file" && [ -f "$env_file" ] ||
              env_refusal="the file cannot be read"
            if [ -n "$env_refusal" ]; then
              echo "EnvironmentFile line $env_number: $env_refusal" >&2
              exit 1
            fi
          }
          load_environment_file /etc/pharmacy-monitor/env

          current=$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python -m alembic \
              -c "$runtime_dir/alembic.ini" current | awk 'NF {print $1}')
          head=$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python -m alembic \
              -c "$runtime_dir/alembic.ini" heads | awk 'NF {print $1}')
          test -n "$current"
          test "$current" = "$head"

          before_run_id=$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          from sqlalchemy import text
          from src import storage

          Session = storage.make_session()
          with Session() as session:
              print(session.execute(
                  text("SELECT COALESCE(MAX(id), 0) FROM runs WHERE tenant_id = 1")
              ).scalar_one())
          PY
          )
          case "$before_run_id" in
            ''|*[!0-9]*) echo 'could not determine prior run ID' >&2; exit 1 ;;
          esac

          # The scraper owns the bounded retry loop. It discards an entire
          # rejected snapshot, recreates all sticky Decodo contexts and only
          # then retries. Running three separate CLI commands here used to
          # create three failed Run records (and three customer-facing health
          # incidents) for one transient source fluctuation.
          succeeded=0
          echo 'autonomous verified catalog attempt (internally bounded to three fresh snapshots)'
          if PHARMONLINE_PUBLIC_API=required \
            PHARMONLINE_PUBLIC_API_TRANSPORT=direct \
            PHARMONLINE_PUBLIC_API_CATALOG_ATTEMPTS=3 \
            PHARMONLINE_PUBLIC_API_CATALOG_RETRY_DELAY_SECONDS=60 \
            PHARMONLINE_PUBLIC_API_REQUIRE_CATALOG_BASELINE=required \
            PHARMONLINE_USE_DDP=0 \
            AI_FALLBACK_ENABLED=0 \
            SCRAPE_REPORT_EMAIL=0 \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$runtime_dir" \
            /opt/pharmacy-monitor/.venv/bin/python -m src.main run \
              --site pharmonline \
              --mode public_api
          then
            succeeded=1
          fi

          # Firecrawl is an explicit, budgeted whole-catalog fallback, never
          # a silent substitute for Decodo.  It runs only after the scraper
          # has exhausted its three fresh Decodo snapshots, and only when the production
          # EnvironmentFile contains both its key and this exact opt-in.
          if [ "$succeeded" -ne 1 ]; then
            case "${PHARMONLINE_PUBLIC_API_FIRECRAWL_FALLBACK:-}" in
              1|true|yes|required)
                if [ -n "${FIRECRAWL_API_KEY:-}" ]; then
                  echo 'Decodo attempts exhausted; trying one verified Firecrawl catalog' >&2
                  if PHARMONLINE_PUBLIC_API=required \
                    PHARMONLINE_PUBLIC_API_TRANSPORT=firecrawl \
                    PHARMONLINE_PUBLIC_API_REQUIRE_CATALOG_BASELINE=required \
                    PHARMONLINE_USE_DDP=0 \
                    AI_FALLBACK_ENABLED=0 \
                    SCRAPE_REPORT_EMAIL=0 \
                    PYTHONDONTWRITEBYTECODE=1 \
                    PYTHONPATH="$runtime_dir" \
                    /opt/pharmacy-monitor/.venv/bin/python -m src.main run \
                      --site pharmonline \
                      --mode public_api
                  then
                    succeeded=1
                  fi
                else
                  echo 'Firecrawl fallback requested but no API key is configured' >&2
                fi
                ;;
              *)
                echo 'Decodo attempts exhausted; Firecrawl fallback is disabled' >&2
                ;;
            esac
          fi
          test "$succeeded" -eq 1

          BEFORE_RUN_ID="$before_run_id" PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$runtime_dir" /opt/pharmacy-monitor/.venv/bin/python - <<'PY'
          import os
          from sqlalchemy import text

          from src import storage

          before_run_id = int(os.environ["BEFORE_RUN_ID"])
          Session = storage.make_session()
          with Session() as session:
              row = session.execute(
                  text(
                      """
                      SELECT id, status, catalog_scope, catalog_verified,
                             catalog_verification_reason, products_scraped,
                             products_per_site, run_quality
                      FROM runs
                      WHERE tenant_id = 1
                        AND full_catalog_sites = 'pharmonline'
                        AND id > :before_run_id
                      ORDER BY id DESC
                      LIMIT 1
                      """
                  ),
                  {"before_run_id": before_run_id},
              ).mappings().one_or_none()
          if row is None:
              raise SystemExit('no new Pharmonline full-catalog run was created')
          quality = row["run_quality"] or {}
          site_quality = (quality.get("sites") or {}).get("pharmonline") or {}
          if (
              row["status"] != "ok"
              or row["catalog_scope"] != "full"
              or not row["catalog_verified"]
              or quality.get("mode") != "public_api"
              or quality.get("full_catalog_verified") is not True
              or site_quality.get("status") != "ok"
              or int(row["products_scraped"] or 0) < 1
          ):
              raise SystemExit('new catalog run did not meet the verified-full-catalog contract')
          print(
              'autonomous Pharmonline catalog verified: '
              f'run_id={row["id"]} products={row["products_scraped"]} '
              f'reason={row["catalog_verification_reason"]}'
          )
          PY
          REMOTE

      - name: Remove isolated runtime staging
        if: ${{ always() && steps.stage.outputs.work_dir != '' }}
        env:
          WORK_DIR: ${{ steps.stage.outputs.work_dir }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            pm@13.140.186.143 "bash -s -- '$WORK_DIR'" <<'REMOTE'
          set -euo pipefail
          work_dir=$1
          case "$work_dir" in
            /opt/pharmacy-monitor/.codex-pharmonline-auto.*) ;;
            *) echo 'unexpected remote staging path' >&2; exit 1 ;;
          esac
          if [ -d "$work_dir" ]; then
            rm -rf -- "$work_dir"
          fi
          REMOTE
