name: Test Minimal

# Diagnostic workflow — Phase 6.4 task #36 follow-up.
# Если этот workflow выполняется (имеет jobs + non-zero duration) — значит
# billing OK, ci.yml имеет специфическую проблему. Если 0-sec / 0 jobs —
# billing quota issue.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    name: Hello World
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: |
          echo "Hello from GitHub Actions"
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
      - name: Check uv install
        run: |
          pip install uv 2>&1 | tail -2
          uv --version
