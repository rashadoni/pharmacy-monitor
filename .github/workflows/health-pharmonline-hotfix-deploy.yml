name: Diagnose or deploy health and Pharmonline hotfix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only production diagnosis, or backed-up code-only deploy"
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - deploy

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  production:
    name: Production ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDVrem8NrMZMjV9cDiB8/8wOwOn1wrfSU7S5vfaLHM+R' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          host_fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          test "$host_fingerprint" = \
            'SHA256:Hx7TYOZC2diIb6ZwI9LRv4bybasYCijb+lKnQQmGk/I'

      - name: Preflight production resources
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 \
            "bash -s -- ${{ inputs.mode }}" <<'REMOTE'
          set -euo pipefail
          mode=$1
          min_available_kib=$((4 * 1024 * 1024))
          max_swap_kib=$((2 * 1024 * 1024))
          min_disk_kib=$((4 * 1024 * 1024))
          # Leave at least 1 GiB below the configured 8 GiB user.slice high-water mark.
          max_user_slice_bytes=$((7 * 1024 * 1024 * 1024))

          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)
          sleep 5
          swap_after_kib=$(free -k | awk '/^Swap:/ {print $3}')

          printf 'available_ram_kib=%s required_kib=%s\n' \
            "$available_kib" "$min_available_kib"
          printf 'swap_before_kib=%s swap_after_kib=%s maximum_kib=%s\n' \
            "$swap_before_kib" "$swap_after_kib" "$max_swap_kib"
          printf 'disk_available_kib=%s required_kib=%s\n' \
            "$disk_available_kib" "$min_disk_kib"
          printf 'user_slice_bytes=%s conservative_limit_bytes=%s\n' \
            "$user_slice_bytes" "$max_user_slice_bytes"

          test "$available_kib" -ge "$min_available_kib"
          test "$swap_after_kib" -le "$max_swap_kib"
          test "$swap_after_kib" -le "$swap_before_kib"
          test "$disk_available_kib" -ge "$min_disk_kib"
          test "$user_slice_bytes" -lt "$max_user_slice_bytes"
          test -r /etc/pharmacy-monitor/env
          test -r /opt/pharmacy-monitor/src/health.py
          test -r /opt/pharmacy-monitor/src/main.py
          test -r /opt/pharmacy-monitor/src/notifier.py
          test -r /opt/pharmacy-monitor/src/storage.py
          test -r /opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py

          if [ "$mode" = deploy ]; then
            if systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service; then
              printf 'refusing deploy: Pharmonline scrape is active\n' >&2
              exit 1
            fi
            test -w /opt/pharmacy-monitor/data
            test -w /opt/pharmacy-monitor/src
            test -w /opt/pharmacy-monitor/src/scrapers
            test -w /opt/pharmacy-monitor/src/health.py
            test -w /opt/pharmacy-monitor/src/main.py
            test -w /opt/pharmacy-monitor/src/notifier.py
            test -w /opt/pharmacy-monitor/src/storage.py
            test -w /opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py
          fi
          REMOTE

      - name: Diagnose units, health state, database, and DDP startup
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/pharmacy-monitor

          printf '== selected unit state ==\n'
          systemctl show \
            pharmacy-monitor-health.timer \
            pharmacy-monitor-health.service \
            pharmacy-monitor-scrape@pharmonline.timer \
            pharmacy-monitor-scrape@pharmonline.service \
            -p Id -p LoadState -p ActiveState -p SubState -p UnitFileState \
            -p Result -p ExecMainStatus -p LastTriggerUSec \
            -p NextElapseUSecRealtime -p FragmentPath -p DropInPaths

          printf '== safe effective timer directives ==\n'
          for unit in \
            pharmacy-monitor-health.timer \
            pharmacy-monitor-scrape@pharmonline.timer
          do
            printf '[%s]\n' "$unit"
            systemctl cat "$unit" --no-pager |
              sed -n -E '/^[[:space:]]*(OnCalendar|RandomizedDelaySec|Persistent)=/p'
          done

          printf '== safe effective service directives ==\n'
          for unit in \
            pharmacy-monitor-health.service \
            pharmacy-monitor-scrape@pharmonline.service
          do
            printf '[%s]\n' "$unit"
            systemctl cat "$unit" --no-pager |
              sed -n -E '/^[[:space:]]*(User|Group|WorkingDirectory|EnvironmentFile|ExecStart|ReadWritePaths)=/p'
          done

          printf '== safe production configuration ==\n'
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import re

          env_path = Path("/etc/pharmacy-monitor/env")
          entries: dict[str, str] = {}
          for raw_line in env_path.read_text().splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              entries[key.strip()] = value.strip().strip("\"'")

          numeric_keys = (
              "PHARMONLINE_DDP_OPEN_TIMEOUT",
              "PHARMONLINE_DDP_CONNECT_ATTEMPTS",
              "PHARMONLINE_DDP_CONNECT_BACKOFF",
              "PHARMONLINE_DDP_CONNECT_BACKOFF_MAX",
              "PHARMONLINE_DDP_CALL_ATTEMPTS",
              "PHARMONLINE_DDP_CALL_RETRY_BACKOFF",
          )
          presence_only_keys = (
              "DECODO_USERNAME",
              "DECODO_PASSWORD",
              "DECODO_HOST",
              "DECODO_PORTS",
              "IPROYAL_USERNAME",
              "IPROYAL_PASSWORD",
              "IPROYAL_HOST",
              "IPROYAL_COUNTRY",
              "BRIGHTDATA_USERNAME",
              "BRIGHTDATA_PASSWORD",
              "BRIGHTDATA_HOST",
              "BRIGHTDATA_COUNTRY",
              "CRAWLBASE_NORMAL_TOKEN",
              "CRAWLBASE_JS_TOKEN",
              "SCRAPER_API_KEY",
              "SCRAPER_API_COUNTRY",
              "FIRECRAWL_API_KEY",
              "HTTP_PROXY",
              "HTTPS_PROXY",
              "ALL_PROXY",
              "SCRAPE_PROXY",
              "HEALTH_ALERT_STATE_FILE",
          )

          ddp_enabled = entries.get("PHARMONLINE_USE_DDP", "<unset>").lower()
          if ddp_enabled not in {"0", "1", "true", "false", "yes", "no", "<unset>"}:
              ddp_enabled = "<set-nonstandard>"
          print(f"PHARMONLINE_USE_DDP={ddp_enabled}")
          decodo_sites = {item.strip() for item in entries.get("DECODO_SITES", "").split(",")}
          iproyal_sites = {item.strip() for item in entries.get("IPROYAL_SITES", "").split(",")}
          brightdata_sites = {
              item.strip() for item in entries.get("BRIGHTDATA_SITES", "").split(",")
          }
          crawlbase_sites = {
              item.strip() for item in entries.get("CRAWLBASE_SITES", "").split(",")
          }
          scraperapi_sites = {
              item.strip() for item in entries.get("SCRAPER_API_SITES", "").split(",")
          }
          print(f"DECODO_SITES includes pharmonline={'pharmonline' in decodo_sites}")
          print(f"IPROYAL_SITES includes pharmonline={'pharmonline' in iproyal_sites}")
          print(f"BRIGHTDATA_SITES includes pharmonline={'pharmonline' in brightdata_sites}")
          print(f"CRAWLBASE_SITES includes pharmonline={'pharmonline' in crawlbase_sites}")
          print(f"SCRAPER_API_SITES includes pharmonline={'pharmonline' in scraperapi_sites}")
          for key in numeric_keys:
              value = entries.get(key)
              if value is None:
                  print(f"{key}=<unset; code default applies>")
              elif re.fullmatch(r"[0-9]+(?:\.[0-9]+)?", value):
                  print(f"{key}={value}")
              else:
                  print(f"{key}=<set-nonnumeric>")
          for key in presence_only_keys:
              print(f"{key}=<set>" if entries.get(key) else f"{key}=<unset>")
          PY

          printf '== health alert state metadata ==\n'
          .venv/bin/python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          import stat

          default_path = "/opt/pharmacy-monitor/data/health_alert_state.json"
          configured_path = default_path
          for raw_line in Path("/etc/pharmacy-monitor/env").read_text().splitlines():
              line = raw_line.strip()
              if line.startswith("HEALTH_ALERT_STATE_FILE="):
                  configured_path = line.split("=", 1)[1].strip().strip("\"'") or default_path
                  break

          path = Path(configured_path)
          allowed_root = Path("/opt/pharmacy-monitor/data").resolve()
          try:
              resolved = path.resolve()
          except OSError:
              resolved = path
          if resolved != allowed_root and allowed_root not in resolved.parents:
              print("state_path_scope=outside-approved-data-root")
              raise SystemExit(0)
          if not path.exists():
              print("state_exists=false")
              raise SystemExit(0)

          metadata = path.stat()
          print("state_exists=true")
          print(f"state_mode={stat.filemode(metadata.st_mode)}")
          print(f"state_size_bytes={metadata.st_size}")
          print(
              "state_mtime_utc="
              f"{datetime.fromtimestamp(metadata.st_mtime, tz=timezone.utc).isoformat()}"
          )
          try:
              state = json.loads(path.read_text())
          except (OSError, ValueError, TypeError):
              print("state_json_valid=false")
          else:
              if not isinstance(state, dict):
                  print("state_json_valid=false")
                  print("state_json_shape=non_object")
                  raise SystemExit(0)
              signature = str(state.get("signature") or "")

              def safe_timestamp(key: str) -> str:
                  value = str(state.get(key) or "")
                  return value[:64] if re.fullmatch(r"[0-9T:+.Z-]{1,64}", value) else (
                      "<missing>" if not value else "<set-invalid>"
                  )

              print("state_json_valid=true")
              print(f"state_version={state.get('version', 1)}")
              print(f"state_status={state.get('status', '<legacy>')}")
              print(f"state_last_sent_at={safe_timestamp('last_sent_at')}")
              print(f"state_legacy_sent_at={safe_timestamp('sent_at')}")
              print(f"state_incident_started_at={safe_timestamp('incident_started_at')}")
              print(f"state_recovered_at={safe_timestamp('recovered_at')}")
              print(f"state_signature_present={bool(signature)}")
              print(f"state_signature_bytes={len(signature.encode())}")
              print(f"state_signature_sha256={sha256(signature.encode()).hexdigest()}")
          PY

          printf '== latest Pharmonline catalog attempt ==\n'
          .venv/bin/python - <<'PY'
          from contextlib import redirect_stderr, redirect_stdout
          from hashlib import sha256
          import io
          import os
          import re

          from dotenv import load_dotenv
          from sqlalchemy import desc, select, text

          load_dotenv("/etc/pharmacy-monitor/env", override=True)

          from src import storage


          def redact(value: object) -> str:
              rendered = str(value or "").replace("\n", " ")
              for key in (
                  "DATABASE_URL",
                  "DECODO_USERNAME",
                  "DECODO_PASSWORD",
                  "DECODO_HOST",
                  "IPROYAL_USERNAME",
                  "IPROYAL_PASSWORD",
                  "IPROYAL_HOST",
                  "FIRECRAWL_API_KEY",
              ):
                  sensitive = os.getenv(key, "")
                  if len(sensitive) >= 4:
                      rendered = rendered.replace(sensitive, "[redacted-value]")
              rendered = re.sub(
                  r"[a-z][a-z0-9+.-]*://\S+",
                  "[redacted-url]",
                  rendered,
                  flags=re.I,
              )
              rendered = re.sub(
                  r"\b[^\s:@]+:[^\s@]+@[^\s]+",
                  "[redacted-credentials]",
                  rendered,
              )
              return rendered[:500]


          def run_fields(run):
              if run is None:
                  return None
              status = str(run.status or "")
              if status not in {"ok", "degraded", "failed"}:
                  status = "nonstandard"
              reason = redact(run.catalog_verification_reason)
              error = redact(run.error_message)
              return {
                  "id": int(run.id),
                  "started_at": run.started_at,
                  "finished_at": run.finished_at,
                  "status": status,
                  "catalog_scope": "full",
                  "catalog_verified": bool(run.catalog_verified),
                  "reason": reason,
                  "product_count": int(run.products_scraped or 0),
                  "error": error,
                  "error_sha256": sha256(error.encode()).hexdigest(),
              }


          captured = io.StringIO()
          try:
              with redirect_stdout(captured), redirect_stderr(captured):
                  Session = storage.make_session()
                  with Session() as session:
                      # First SQL statement: enforce a server-side read-only transaction.
                      session.execute(text("SET TRANSACTION READ ONLY"))
                      # Do not require run_quality: startup failures can be terminal
                      # before that JSON envelope is created.  Stream newest terminal
                      # full runs and apply exact CSV membership in Python.
                      candidates = session.scalars(
                          select(storage.Run)
                          .where(
                              storage.Run.tenant_id == 1,
                              storage.Run.status != "running",
                              storage.Run.finished_at.is_not(None),
                              storage.Run.catalog_scope == "full",
                              storage.Run.full_catalog_sites.is_not(None),
                          )
                          .order_by(
                              desc(storage.Run.finished_at),
                              desc(storage.Run.id),
                          )
                      ).yield_per(100)
                      latest_run = None
                      successful = None
                      for candidate in candidates:
                          declared_sites = {
                              site.strip()
                              for site in (
                                  candidate.full_catalog_sites or ""
                              ).split(",")
                              if site.strip()
                          }
                          if "pharmonline" not in declared_sites:
                              continue
                          if latest_run is None:
                              latest_run = candidate
                          if (
                              successful is None
                              and candidate.status == "ok"
                              and bool(candidate.catalog_verified)
                          ):
                              successful = candidate
                          if latest_run is not None and successful is not None:
                              break
                      latest = run_fields(latest_run)
                      successful_fields = run_fields(successful)
                      session.rollback()
          except Exception as exc:
              print("latest_attempt_query=failed")
              print(f"latest_attempt_error_type={type(exc).__name__}")
              raise SystemExit(1) from None

          if latest is None:
              print("latest_attempt=missing")
          else:
              print(f"id={latest['id']}")
              print(f"started_at={latest['started_at']}")
              print(f"finished_at={latest['finished_at']}")
              print(f"status={latest['status']}")
              print(f"catalog_scope={latest['catalog_scope']}")
              print(f"catalog_verified={latest['catalog_verified']}")
              print(f"catalog_verification_reason={latest['reason'] or '<none>'}")
              print(f"product_count={latest['product_count']}")
              print(f"error={latest['error'] or '<none>'}")
              print(f"error_sha256={latest['error_sha256']}")

          if successful_fields is None:
              print("last_successful_full_attempt=missing")
          else:
              duration_seconds = (
                  successful_fields["finished_at"]
                  - successful_fields["started_at"]
              ).total_seconds()
              print(f"last_successful_full_id={successful_fields['id']}")
              print(
                  "last_successful_full_started_at="
                  f"{successful_fields['started_at']}"
              )
              print(
                  "last_successful_full_finished_at="
                  f"{successful_fields['finished_at']}"
              )
              print(f"last_successful_full_duration_seconds={duration_seconds:.1f}")
          PY

          printf '== bounded production DDP startup probe ==\n'
          timeout 85s .venv/bin/python - <<'PY'
          import asyncio
          from contextlib import redirect_stderr, redirect_stdout
          import io
          import os
          import time

          from dotenv import load_dotenv
          import websockets

          load_dotenv("/etc/pharmacy-monitor/env", override=True)

          from src.scrapers.base import fatal_proxy_reason
          from src.scrapers.pharmonline_ddp import (
              SOCKJS_BASE,
              _DDPClient,
              _decodo_ports_list,
              _decodo_proxy_factory,
              _iproyal_httpx_proxy,
              _new_sockjs_path,
          )


          SAFE_HTTP_STATUSES = frozenset(
              {
                  400,
                  401,
                  402,
                  403,
                  404,
                  407,
                  408,
                  409,
                  425,
                  426,
                  429,
                  500,
                  501,
                  502,
                  503,
                  504,
                  520,
                  521,
                  522,
                  523,
                  524,
              }
          )


          def safe_http_status(error: BaseException) -> int | None:
              """Extract only an allow-listed status, never exception text."""
              current: BaseException | None = error
              seen: set[int] = set()
              while current is not None and id(current) not in seen:
                  seen.add(id(current))
                  candidates = [getattr(current, "status_code", None)]
                  response = getattr(current, "response", None)
                  candidates.append(getattr(response, "status_code", None))
                  for candidate in candidates:
                      try:
                          status = int(candidate)
                      except (TypeError, ValueError):
                          continue
                      if status in SAFE_HTTP_STATUSES:
                          return status
                  current = current.__cause__ or current.__context__
              return None


          def decodo_rotating_proxy_factory():
              """Reuse configured Decodo credentials with official rotating port."""
              previous_ports = os.environ.get("DECODO_PORTS")
              os.environ["DECODO_PORTS"] = "30000"
              try:
                  return _decodo_proxy_factory()
              finally:
                  if previous_ports is None:
                      os.environ.pop("DECODO_PORTS", None)
                  else:
                      os.environ["DECODO_PORTS"] = previous_ports


          async def probe(
              proxy_factory,
              provider: str,
              attempt_budget: int,
          ) -> tuple[str, str, str, int, float]:
              if proxy_factory is None:
                  return provider, "failed", "proxy_provider_not_configured", 0, 0.0

              # Process-local bounds only. A failed Decodo startup rotates through
              # every configured standard sticky session, capped at ten attempts.
              os.environ["PHARMONLINE_DDP_OPEN_TIMEOUT"] = "4"
              os.environ["PHARMONLINE_DDP_CONNECT_ATTEMPTS"] = str(attempt_budget)
              os.environ["PHARMONLINE_DDP_CONNECT_BACKOFF"] = "0"
              os.environ["PHARMONLINE_DDP_CONNECT_BACKOFF_MAX"] = "0"
              os.environ["PHARMONLINE_DDP_CALL_ATTEMPTS"] = "1"

              client = _DDPClient(
                  lambda: SOCKJS_BASE + _new_sockjs_path(),
                  proxy_url=proxy_factory,
              )
              started = time.monotonic()
              try:
                  await asyncio.wait_for(
                      client.__aenter__(),
                      timeout=min(attempt_budget * 4 + 5, 45),
                  )
              except Exception as exc:
                  fatal_reason = fatal_proxy_reason(exc)
                  http_status = safe_http_status(exc)
                  if fatal_reason:
                      reason = fatal_reason
                  elif http_status == 403:
                      reason = "http_403_forbidden"
                  elif http_status is not None:
                      reason = f"http_status_{http_status}"
                  elif isinstance(exc, (TimeoutError, asyncio.TimeoutError)):
                      reason = "opening_handshake_timeout"
                  else:
                      reason = "transient_connection_failure"
                  return (
                      provider,
                      "failed",
                      f"{type(exc).__name__}:{reason}",
                      attempt_budget,
                      time.monotonic() - started,
                  )
              finally:
                  try:
                      await asyncio.wait_for(client.__aexit__(None, None, None), timeout=5)
                  except Exception:
                      pass
              return (
                  provider,
                  "ok",
                  "ddp_handshake_completed",
                  attempt_budget,
                  time.monotonic() - started,
              )


          async def single_handshake_once(
              proxy_url,
              *,
              configured: bool = True,
          ) -> tuple[str, float]:
              """One four-second handshake returning only a normalized class."""
              started = time.monotonic()
              if not configured:
                  return "not_configured", time.monotonic() - started

              # All overrides live only for this diagnostic Python process.
              os.environ["PHARMONLINE_DDP_OPEN_TIMEOUT"] = "4"
              os.environ["PHARMONLINE_DDP_CONNECT_ATTEMPTS"] = "1"
              os.environ["PHARMONLINE_DDP_CONNECT_BACKOFF"] = "0"
              os.environ["PHARMONLINE_DDP_CONNECT_BACKOFF_MAX"] = "0"
              client = None
              try:
                  client = _DDPClient(
                      lambda: SOCKJS_BASE + _new_sockjs_path(),
                      proxy_url=proxy_url,
                  )
                  await asyncio.wait_for(client.__aenter__(), timeout=4)
              except Exception as exc:
                  fatal_reason = fatal_proxy_reason(exc)
                  http_status = safe_http_status(exc)
                  if fatal_reason is not None:
                      result_class = (
                          f"proxy_http_{http_status}"
                          if http_status in {402, 407}
                          else "proxy_rejected"
                      )
                  elif http_status == 403:
                      result_class = "http_403"
                  elif http_status is not None:
                      result_class = f"http_{http_status}"
                  elif isinstance(exc, (TimeoutError, asyncio.TimeoutError)):
                      result_class = "timeout"
                  elif isinstance(
                      exc,
                      (
                          OSError,
                          ConnectionError,
                          websockets.exceptions.WebSocketException,
                      ),
                  ):
                      result_class = "network_or_upstream"
                  else:
                      result_class = "internal_error"
                  handshake_elapsed = time.monotonic() - started
              else:
                  result_class = "ok"
                  handshake_elapsed = time.monotonic() - started
              finally:
                  if client is not None:
                      try:
                          await asyncio.wait_for(
                              client.__aexit__(None, None, None), timeout=2
                          )
                      except Exception:
                          pass
              return result_class, handshake_elapsed


          async def iproyal_probe_once() -> tuple[str, float]:
              """Resolve configured IPRoyal once without persisting site flags."""
              previous_sites = os.environ.get("IPROYAL_SITES")
              probe_sites = {
                  site.strip()
                  for site in (previous_sites or "").split(",")
                  if site.strip()
              }
              probe_sites.add("pharmonline")
              os.environ["IPROYAL_SITES"] = ",".join(sorted(probe_sites))
              try:
                  proxy = _iproyal_httpx_proxy()
              except Exception:
                  return "internal_error", 0.0
              finally:
                  if previous_sites is None:
                      os.environ.pop("IPROYAL_SITES", None)
                  else:
                      os.environ["IPROYAL_SITES"] = previous_sites
              return await single_handshake_once(
                  proxy,
                  configured=proxy is not None,
              )


          async def iproyal_password_country_probe_once() -> tuple[str, float]:
              """Test the documented IPRoyal country suffix without changing prod env.

              IPRoyal encodes residential targeting in the password component.
              This process-local probe distinguishes a bad target route from an
              old username-suffix configuration without printing credentials.
              """
              keys = ("IPROYAL_SITES", "IPROYAL_COUNTRY", "IPROYAL_PASSWORD")
              previous = {key: os.environ.get(key) for key in keys}
              country = (previous["IPROYAL_COUNTRY"] or "").strip().lower()
              password = previous["IPROYAL_PASSWORD"] or ""
              if not country or not password:
                  return "not_applicable", 0.0

              sites = {
                  site.strip()
                  for site in (previous["IPROYAL_SITES"] or "").split(",")
                  if site.strip()
              }
              sites.add("pharmonline")
              os.environ["IPROYAL_SITES"] = ",".join(sorted(sites))
              os.environ["IPROYAL_COUNTRY"] = ""
              if "_country-" not in password:
                  os.environ["IPROYAL_PASSWORD"] = f"{password}_country-{country}"
              try:
                  proxy = _iproyal_httpx_proxy()
              except Exception:
                  return "internal_error", 0.0
              finally:
                  for key, value in previous.items():
                      if value is None:
                          os.environ.pop(key, None)
                      else:
                          os.environ[key] = value
              return await single_handshake_once(
                  proxy,
                  configured=proxy is not None,
              )


          async def direct_probe_once() -> tuple[str, float]:
              """Connect directly without constructing any proxy URL."""
              proxy_env_keys = (
                  "HTTP_PROXY",
                  "HTTPS_PROXY",
                  "ALL_PROXY",
                  "WS_PROXY",
                  "WSS_PROXY",
                  "http_proxy",
                  "https_proxy",
                  "all_proxy",
                  "ws_proxy",
                  "wss_proxy",
              )
              previous = {key: os.environ.get(key) for key in proxy_env_keys}
              for key in proxy_env_keys:
                  os.environ.pop(key, None)
              try:
                  return await single_handshake_once(None)
              finally:
                  for key, value in previous.items():
                      if value is not None:
                          os.environ[key] = value


          async def decodo_generic_rotating_probe_once() -> tuple[str, float]:
              """Resolve Decodo's generic rotating gateway, then restore env."""
              keys = ("DECODO_HOST", "DECODO_PORTS", "DECODO_SITES")
              previous = {key: os.environ.get(key) for key in keys}
              probe_sites = {
                  site.strip()
                  for site in (previous["DECODO_SITES"] or "").split(",")
                  if site.strip()
              }
              probe_sites.add("pharmonline")
              os.environ["DECODO_HOST"] = "gate.decodo.com"
              os.environ["DECODO_PORTS"] = "7000"
              os.environ["DECODO_SITES"] = ",".join(sorted(probe_sites))
              try:
                  proxy_factory = _decodo_proxy_factory()
              except Exception:
                  return "internal_error", 0.0
              finally:
                  for key, value in previous.items():
                      if value is None:
                          os.environ.pop(key, None)
                      else:
                          os.environ[key] = value
              return await single_handshake_once(
                  proxy_factory,
                  configured=proxy_factory is not None,
              )


          async def run_probes():
              decodo = _decodo_proxy_factory()
              iproyal = None if decodo else _iproyal_httpx_proxy()
              proxy_factory = decodo or iproyal
              provider = "decodo" if decodo else "iproyal" if iproyal else "unconfigured"
              attempt_budget = (
                  min(max(len(_decodo_ports_list()), 1), 10) if decodo else 1
              )
              configured = await probe(proxy_factory, provider, attempt_budget)

              if not decodo:
                  rotating = (
                      "decodo_rotating_30000",
                      "not_applicable",
                      "decodo_not_selected",
                      0,
                      0.0,
                  )
              elif configured[1] == "ok":
                  rotating = (
                      "decodo_rotating_30000",
                      "skipped",
                      "configured_pool_ok",
                      0,
                      0.0,
                  )
              elif "HTTP 402" in configured[2] or "HTTP 407" in configured[2]:
                  rotating = (
                      "decodo_rotating_30000",
                      "skipped",
                      "account_or_auth_failure",
                      0,
                      0.0,
                  )
              else:
                  rotating = await probe(
                      decodo_rotating_proxy_factory(),
                      "decodo_rotating_30000",
                      1,
                  )
              iproyal_diagnostic = await iproyal_probe_once()
              iproyal_password_country_diagnostic = (
                  await iproyal_password_country_probe_once()
              )
              direct_diagnostic = await direct_probe_once()
              decodo_generic_diagnostic = (
                  await decodo_generic_rotating_probe_once()
              )
              return (
                  configured,
                  rotating,
                  iproyal_diagnostic,
                  iproyal_password_country_diagnostic,
                  direct_diagnostic,
                  decodo_generic_diagnostic,
              )


          # Suppress dependency/structlog output because endpoints may appear in
          # third-party exceptions. Emit only the allow-listed fields below.
          captured = io.StringIO()
          with redirect_stdout(captured), redirect_stderr(captured):
              (
                  configured,
                  rotating,
                  iproyal_diagnostic,
                  iproyal_password_country_diagnostic,
                  direct_diagnostic,
                  decodo_generic_diagnostic,
              ) = asyncio.run(run_probes())
          print(f"configured_provider={configured[0]}")
          print(f"configured_result={configured[1]}")
          print(f"configured_reason={configured[2]}")
          print(f"configured_attempt_budget={configured[3]}")
          print(f"configured_elapsed_seconds={configured[4]:.2f}")
          print("rotating_port=30000")
          print(f"rotating_result={rotating[1]}")
          print(f"rotating_reason={rotating[2]}")
          print(f"rotating_attempt_budget={rotating[3]}")
          print(f"rotating_elapsed_seconds={rotating[4]:.2f}")
          print(f"iproyal_probe_class={iproyal_diagnostic[0]}")
          print(f"iproyal_probe_elapsed_seconds={iproyal_diagnostic[1]:.2f}")
          print(
              "iproyal_password_country_probe_class="
              f"{iproyal_password_country_diagnostic[0]}"
          )
          print(
              "iproyal_password_country_probe_elapsed_seconds="
              f"{iproyal_password_country_diagnostic[1]:.2f}"
          )
          print(f"direct_probe_class={direct_diagnostic[0]}")
          print(f"direct_probe_elapsed_seconds={direct_diagnostic[1]:.2f}")
          print(f"decodo_generic_probe_class={decodo_generic_diagnostic[0]}")
          print(
              "decodo_generic_probe_elapsed_seconds="
              f"{decodo_generic_diagnostic[1]:.2f}"
          )
          PY
          REMOTE

      - name: Backup and deploy Python hotfix files with rollback
        id: deploy
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          deploy_id=gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          backup_dir=/opt/pharmacy-monitor/data/hotfix-backups/hotfix-$deploy_id/src
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 \
            "bash -s -- $deploy_id" <<'REMOTE'
          set -euo pipefail
          deploy_id=$1
          [[ "$deploy_id" =~ ^gha-[0-9]+-[0-9]+$ ]]
          backup_dir=/opt/pharmacy-monitor/data/hotfix-backups/hotfix-$deploy_id/src
          mkdir -p "$backup_dir/scrapers"
          cp -p /opt/pharmacy-monitor/src/health.py "$backup_dir/health.py"
          cp -p /opt/pharmacy-monitor/src/main.py "$backup_dir/main.py"
          cp -p /opt/pharmacy-monitor/src/notifier.py "$backup_dir/notifier.py"
          cp -p /opt/pharmacy-monitor/src/storage.py "$backup_dir/storage.py"
          cp -p /opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py \
            "$backup_dir/scrapers/pharmonline_ddp.py"
          cmp -s /opt/pharmacy-monitor/src/health.py "$backup_dir/health.py"
          cmp -s /opt/pharmacy-monitor/src/main.py "$backup_dir/main.py"
          cmp -s /opt/pharmacy-monitor/src/notifier.py "$backup_dir/notifier.py"
          cmp -s /opt/pharmacy-monitor/src/storage.py "$backup_dir/storage.py"
          cmp -s /opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py \
            "$backup_dir/scrapers/pharmonline_ddp.py"
          printf 'backup=%s\n' "$backup_dir"
          REMOTE
          printf 'backup_dir=%s\n' "$backup_dir" >> "$GITHUB_OUTPUT"

          rollback() {
            original_rc=$?
            trap - ERR INT TERM
            set +e
            printf 'deploy failed; restoring backup in compatible reverse order\n' >&2
            ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 \
              "bash -s -- $backup_dir" <<'ROLLBACK'
          set -u
          backup_dir=$1
          [[ "$backup_dir" =~ ^/opt/pharmacy-monitor/data/hotfix-backups/hotfix-gha-[0-9]+-[0-9]+/src$ ]] \
            || { printf 'invalid backup path; rollback refused\n' >&2; exit 1; }
          rollback_failed=0
          restore_file() {
            source_file=$1
            target_file=$2
            if ! test -r "$source_file"; then
              printf 'rollback source missing: %s\n' "$source_file" >&2
              return 1
            fi
            temp_file=$(mktemp "${target_file}.rollback.XXXXXX") || return 1
            if ! cp -p "$source_file" "$temp_file" \
              || ! cmp -s "$source_file" "$temp_file" \
              || ! mv -f "$temp_file" "$target_file" \
              || ! cmp -s "$source_file" "$target_file"
            then
              rm -f -- "$temp_file"
              return 1
            fi
          }
          # Inverse of rollout: restore the old caller first.  Never downgrade
          # dependencies while the new caller remains live.
          if restore_file "$backup_dir/main.py" /opt/pharmacy-monitor/src/main.py; then
            restore_file "$backup_dir/scrapers/pharmonline_ddp.py" \
              /opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py || rollback_failed=1
            restore_file "$backup_dir/health.py" /opt/pharmacy-monitor/src/health.py \
              || rollback_failed=1
            restore_file "$backup_dir/storage.py" /opt/pharmacy-monitor/src/storage.py \
              || rollback_failed=1
            restore_file "$backup_dir/notifier.py" /opt/pharmacy-monitor/src/notifier.py \
              || rollback_failed=1
          else
            printf 'main rollback failed; keeping new dependencies in place\n' >&2
            rollback_failed=1
          fi
          cd /opt/pharmacy-monitor
          .venv/bin/python -m py_compile \
            src/main.py src/scrapers/pharmonline_ddp.py src/health.py src/storage.py \
            src/notifier.py \
            || rollback_failed=1
          if [ "$rollback_failed" -ne 0 ]; then
            printf 'automatic rollback incomplete; backup=%s\n' "$backup_dir" >&2
            exit 1
          fi
          printf 'automatic rollback complete; backup=%s\n' "$backup_dir" >&2
          ROLLBACK
            rollback_rc=$?
            set -e
            if [ "$rollback_rc" -ne 0 ]; then
              printf 'automatic rollback command failed\n' >&2
            fi
            if [ "$original_rc" -eq 0 ]; then original_rc=1; fi
            exit "$original_rc"
          }
          # Repeat the active gate immediately before the first live write.
          # Unknown/missing/transitional unit state fails closed.
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          require_inactive() {
            unit=$1
            load_state=$(systemctl show "$unit" -p LoadState --value)
            active_state=$(systemctl show "$unit" -p ActiveState --value)
            test "$load_state" = loaded
            case "$active_state" in
              inactive|failed) ;;
              *)
                printf 'refusing deploy: %s state=%s\n' "$unit" "$active_state" >&2
                exit 1
                ;;
            esac
          }
          require_inactive pharmacy-monitor-scrape@pharmonline.service
          require_inactive pharmacy-monitor-health.service
          REMOTE

          trap rollback ERR INT TERM
          # Dependencies first; main.py (the caller) is always published last.
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_ed25519" \
            src/notifier.py pm@13.140.186.143:/opt/pharmacy-monitor/src/notifier.py
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_ed25519" \
            src/storage.py pm@13.140.186.143:/opt/pharmacy-monitor/src/storage.py
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_ed25519" \
            src/health.py pm@13.140.186.143:/opt/pharmacy-monitor/src/health.py
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_ed25519" \
            src/scrapers/pharmonline_ddp.py \
            pm@13.140.186.143:/opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_ed25519" \
            src/main.py pm@13.140.186.143:/opt/pharmacy-monitor/src/main.py
          trap - ERR INT TERM

