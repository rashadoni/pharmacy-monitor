              print("readonly_health_check=invalid_status")
              raise SystemExit(1)
          issue_codes = []
          for issue in report.issues:
              if issue.severity not in {"ok", "warning", "critical"}:
                  raise SystemExit(1)
              if not re.fullmatch(r"[a-z0-9_]{1,80}", issue.code):
                  raise SystemExit(1)
              issue_codes.append(issue.code)
          last_status = report.last_run_status
          if last_status not in {None, "running", "ok", "degraded", "failed"}:
              last_status = "nonstandard"
