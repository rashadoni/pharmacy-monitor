          print(f"health_last_run_id={report.last_run_id}")
          print(f"health_last_run_status={last_status}")
          print(f"health_issue_count={len(issue_codes)}")
          print(f"health_issue_codes={','.join(issue_codes)}")
          PY

          printf '== bounded post-deploy DDP handshake probe ==\n'
          timeout 55s .venv/bin/python - <<'PY'
          import asyncio
          from contextlib import redirect_stderr, redirect_stdout
          import io
          import os
          import time

          captured = io.StringIO()
          try:
              with redirect_stdout(captured), redirect_stderr(captured):
                  from dotenv import load_dotenv
                  import websockets

                  load_dotenv("/etc/pharmacy-monitor/env", override=True)

                  from src.scrapers.base import fatal_proxy_reason
                  from src.scrapers.pharmonline_ddp import (
                      SOCKJS_BASE,
                      _DDPClient,
                      _decodo_ports_list,
                      _decodo_proxy_factory,
                      _iproyal_httpx_proxy,
                      _new_sockjs_path,
                  )

                  async def post_deploy_probe():
                      decodo = _decodo_proxy_factory()
                      iproyal = None if decodo else _iproyal_httpx_proxy()
                      proxy_factory = decodo or iproyal
                      provider = (
                          "decodo"
                          if decodo
                          else "iproyal"
                          if iproyal
                          else "unconfigured"
                      )
                      attempts = (
                          min(max(len(_decodo_ports_list()), 1), 10)
                          if decodo
                          else 1
                      )
                      if proxy_factory is None:
                          return (
                              provider,
                              "external_config",
                              "proxy_provider_not_configured",
                              0,
                              0.0,
                          )

                      os.environ["PHARMONLINE_DDP_OPEN_TIMEOUT"] = "4"
                      os.environ["PHARMONLINE_DDP_CONNECT_ATTEMPTS"] = str(attempts)
                      os.environ["PHARMONLINE_DDP_CONNECT_BACKOFF"] = "0"
                      os.environ["PHARMONLINE_DDP_CONNECT_BACKOFF_MAX"] = "0"
                      started = time.monotonic()
                      client = None
                      try:
                          client = _DDPClient(
                              lambda: SOCKJS_BASE + _new_sockjs_path(),
                              proxy_url=proxy_factory,
                          )
                          await asyncio.wait_for(
                              client.__aenter__(),
                              timeout=min(attempts * 4 + 5, 45),
                          )
                      except Exception as exc:
                          fatal_reason = fatal_proxy_reason(exc)
                          known_external = isinstance(
                              exc,
                              (
                                  TimeoutError,
                                  asyncio.TimeoutError,
                                  OSError,
                                  ConnectionError,
                                  websockets.exceptions.WebSocketException,
                              ),
                          )
                          if fatal_reason is not None:
                              result = "external_failure"
                              reason = "proxy_access_or_configuration_rejected"
                          elif known_external:
                              result = "external_failure"
                              reason = "upstream_or_network_unavailable"
                          else:
                              result = "internal_error"
                              reason = type(exc).__name__
                          return (
                              provider,
                              result,
                              reason,
                              attempts,
                              time.monotonic() - started,
                          )
                      finally:
                          if client is not None:
                              try:
                                  await asyncio.wait_for(
                                      client.__aexit__(None, None, None), timeout=5
                                  )
                              except Exception:
                                  pass
                      return (
                          provider,
                          "ok",
                          "ddp_handshake_completed",
                          attempts,
                          time.monotonic() - started,
                      )

                  provider, result, reason, attempts, elapsed = asyncio.run(
                      post_deploy_probe()
                  )
          except BaseException as exc:
              print("post_probe_result=internal_error")
              print(f"post_probe_internal_error_type={type(exc).__name__}")
              raise SystemExit(1) from None

          if (
              provider not in {"decodo", "iproyal", "unconfigured"}
              or result
              not in {"ok", "external_failure", "external_config", "internal_error"}
              or not isinstance(attempts, int)
              or attempts < 0
          ):
              print("post_probe_result=internal_error")
              print("post_probe_internal_error_type=MalformedProbeResult")
              raise SystemExit(1)
          print(f"post_probe_provider={provider}")
          print(f"post_probe_result={result}")
          print(f"post_probe_reason={reason}")
          print(f"post_probe_attempt_budget={attempts}")
          print(f"post_probe_elapsed_seconds={elapsed:.2f}")
          if result == "internal_error":
              print("post_probe_gate=failed_internal")
              raise SystemExit(1)
          if result == "ok":
              print("post_probe_gate=passed")
          else:
              print("post_probe_gate=warning_external")
          PY
          REMOTE
          trap - ERR INT TERM

      - name: Retry rollback after failed deploy or verification
        id: rollback_retry
        if: ${{ always() && inputs.mode == 'deploy' && (steps.deploy.outcome == 'failure' || steps.deploy.outcome == 'cancelled' || (steps.deploy.outcome == 'success' && steps.verify.outcome != 'success')) }}
        env:
          BACKUP_DIR: /opt/pharmacy-monitor/data/hotfix-backups/hotfix-gha-${{ github.run_id }}-${{ github.run_attempt }}/src
        run: |
          set -euo pipefail
          backup_dir=$BACKUP_DIR
          [[ "$backup_dir" =~ ^/opt/pharmacy-monitor/data/hotfix-backups/hotfix-gha-[0-9]+-[0-9]+/src$ ]]
          ssh -i ~/.ssh/id_ed25519 pm@13.140.186.143 \
            "bash -s -- $backup_dir" <<'ROLLBACK'
          set -u
          backup_dir=$1
          [[ "$backup_dir" =~ ^/opt/pharmacy-monitor/data/hotfix-backups/hotfix-gha-[0-9]+-[0-9]+/src$ ]] \
            || { printf 'invalid backup path; rollback retry refused\n' >&2; exit 1; }

          backup_complete=1
          for source_file in \
            "$backup_dir/main.py" \
            "$backup_dir/scrapers/pharmonline_ddp.py" \
            "$backup_dir/health.py" \
            "$backup_dir/storage.py" \
            "$backup_dir/notifier.py"
          do
            if ! test -r "$source_file"; then
              printf 'rollback retry source missing: %s\n' "$source_file" >&2
              backup_complete=0
            fi
          done
          if [ "$backup_complete" -eq 0 ]; then
            printf 'rollback retry: no completed backup; no live writes were started\n'
            exit 0
          fi

          # A pre-write gate failure needs no live rewrite.  This also makes
          # cleanup an idempotent retry after a successful trap rollback.
          if cmp -s "$backup_dir/main.py" /opt/pharmacy-monitor/src/main.py \
            && cmp -s "$backup_dir/scrapers/pharmonline_ddp.py" \
              /opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py \
            && cmp -s "$backup_dir/health.py" /opt/pharmacy-monitor/src/health.py \
            && cmp -s "$backup_dir/storage.py" /opt/pharmacy-monitor/src/storage.py \
            && cmp -s "$backup_dir/notifier.py" /opt/pharmacy-monitor/src/notifier.py
          then
            printf 'rollback retry: live files already match backup\n'
            exit 0
          fi

          rollback_failed=0
          restore_file() {
            source_file=$1
            target_file=$2
            temp_file=$(mktemp "${target_file}.rollback.XXXXXX") || return 1
            if ! cp -p "$source_file" "$temp_file" \
              || ! cmp -s "$source_file" "$temp_file" \
              || ! mv -f "$temp_file" "$target_file" \
              || ! cmp -s "$source_file" "$target_file"
            then
              rm -f -- "$temp_file"
              return 1
            fi
          }

          # Preserve compatibility: dependencies move back only after main.py.
          if restore_file "$backup_dir/main.py" /opt/pharmacy-monitor/src/main.py; then
            restore_file "$backup_dir/scrapers/pharmonline_ddp.py" \
              /opt/pharmacy-monitor/src/scrapers/pharmonline_ddp.py || rollback_failed=1
            restore_file "$backup_dir/health.py" /opt/pharmacy-monitor/src/health.py \
              || rollback_failed=1
            restore_file "$backup_dir/storage.py" /opt/pharmacy-monitor/src/storage.py \
              || rollback_failed=1
            restore_file "$backup_dir/notifier.py" /opt/pharmacy-monitor/src/notifier.py \
              || rollback_failed=1
          else
            printf 'main rollback retry failed; keeping new dependencies\n' >&2
            rollback_failed=1
          fi
          cd /opt/pharmacy-monitor
          .venv/bin/python -m py_compile \
            src/main.py src/scrapers/pharmonline_ddp.py src/health.py src/storage.py \
            src/notifier.py \
            || rollback_failed=1
          if [ "$rollback_failed" -ne 0 ]; then
            printf 'rollback retry incomplete; backup=%s\n' "$backup_dir" >&2
            exit 1
          fi
          printf 'rollback retry complete; backup=%s\n' "$backup_dir"
          ROLLBACK
