name: Recover interrupted empty catalog run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Empty interrupted Run ID to close"
        required: true
        default: "671"
      restart_api:
        description: "Restart API after recovery so health uses current code"
        required: true
        type: boolean
        default: false

concurrency:
  group: production-run-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate requested run ID
        id: input
        env:
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          case "$REQUESTED_RUN_ID" in
            ''|*[!0-9]*)
              echo "run_id must be a positive integer" >&2
              exit 1
              ;;
          esac
          test "$REQUESTED_RUN_ID" -gt 0
          printf 'run_id=%s\n' "$REQUESTED_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Set up production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            '13.140.186.143 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDVrem8NrMZMjV9cDiB8/8wOwOn1wrfSU7S5vfaLHM+R' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Preflight production and verify no scraper is active
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            pm@13.140.186.143 'bash -s' <<'REMOTE'
          set -euo pipefail
          available_kib=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          swap_before_kib=$(free -k | awk '/^Swap:/ {print $3}')
          disk_available_kib=$(df -Pk /opt/pharmacy-monitor | awk 'NR==2 {print $4}')
          user_slice_bytes=$(systemctl show user.slice -p MemoryCurrent --value)

          test "$available_kib" -ge $((4 * 1024 * 1024))
          test "$swap_before_kib" -le $((2 * 1024 * 1024))
          test "$disk_available_kib" -ge $((4 * 1024 * 1024))
          test "$user_slice_bytes" -lt $((7 * 1024 * 1024 * 1024))
          ! systemctl is-active --quiet pharmacy-monitor-scrape@pharmonline.service
          ! pgrep -f 'pharmacy-monitor (run|scrape|intraday-tick|rematch)( |$)' >/dev/null 2>&1
          REMOTE

      - name: Close only an empty interrupted Pharmonline run
        env:
          RUN_ID: ${{ steps.input.outputs.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            pm@13.140.186.143 "bash -s -- '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          run_id=$1
          cd /opt/pharmacy-monitor

          load_environment_file() {
            # systemd reads EnvironmentFile as literal NAME=VALUE lines, never as
            # shell, and this step log is public.  Nothing read from the file is
            # ever printed: the loop below has no stderr, so neither bash nor a
            # trace can speak from inside it, and a refusal names the line number
            # and nothing else.  The price: a fatal bash error inside the loop ends
            # the script without a word, so keep every branch of it under test.
            # A line is exported only if it means here what it means to systemd,
            # which drops spaces, tabs and CR around the line, the name and the
            # value and takes one pair of quotes off the value.  A line systemd
            # would skip (no "=", a bad name) or read differently (other quoting,
            # a backslash) stops the run: that is what a torn value looks like.
            # tests/test_workflow_env_file_loader.py runs this text; every workflow
            # carries the same copy, so change them together.
            local env_file=$1 env_number=0 env_refusal="" env_line="" env_name="" env_value=""
            local env_cr env_ws env_sq
            env_cr=$(printf "\r")
            env_ws=$(printf " \t")$env_cr
            env_sq=$(printf "\047")
            while IFS= read -r env_line || [ -n "$env_line" ]; do
              env_number=$((env_number + 1))
              env_line=${env_line#"${env_line%%[!"$env_ws"]*}"}
              env_line=${env_line%"${env_line##*[!"$env_ws"]}"}
              case "$env_line" in
                "") continue ;;
                *"$env_cr"*) env_refusal="a carriage return inside the line"; break ;;
                \#*|\;*) continue ;;
                *=*) ;;
                *) env_refusal="not NAME=VALUE"; break ;;
              esac
              env_name=${env_line%%=*}
              env_name=${env_name%"${env_name##*[!"$env_ws"]}"}
              env_value=${env_line#*=}
              env_value=${env_value#"${env_value%%[!"$env_ws"]*}"}
              if ! [[ $env_name =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                env_refusal="the name is not a variable name"; break
              fi
              case "$env_value" in
                \"*\")
                  env_value=${env_value#\"}
                  env_value=${env_value%\"}
                  case "$env_value" in
                    *[\"\\]*) env_refusal="quoting systemd reads differently"; break ;;
                  esac ;;
                "$env_sq"*"$env_sq")
                  env_value=${env_value#"$env_sq"}
                  env_value=${env_value%"$env_sq"}
                  case "$env_value" in
                    *"$env_sq"*) env_refusal="quoting systemd reads differently"; break ;;
                  esac ;;
                \"*|"$env_sq"*)
                  env_refusal="quoting systemd reads differently"; break ;;
                *\\*)
                  env_refusal="a backslash systemd reads differently"; break ;;
              esac
              # Some names cannot carry a value from the file.  env_* is the state
              # of this function; PS4 and BASH_* reconfigure the running shell
              # (BASH_ARGV0 renames it in every later message).  Under a name bash
              # holds as a number (OPTIND, SECONDS, UID) the value would be computed,
              # that is executed, instead of stored.  A read-only name (SHELLOPTS)
              # ends bash on the spot, hence the subshell first.  And bash keeps its
              # own value for the names it computes (GROUPS), so what was exported
              # is read back.
              env_refusal="the name belongs to bash or to this loader"
              case "$env_name" in
                env_*|BASH_*|PS4) break ;;
              esac
              if [[ -v $env_name && ${!env_name@a} == *i* ]]; then
                break
              fi
              (export "$env_name=$env_value") || break
              export "$env_name=$env_value" || break
              [[ ${!env_name-} == "$env_value" ]] || break
              env_refusal=""
            # A directory opens like a file and then reads as an empty one.
            done 2> /dev/null < "$env_file" && [ -f "$env_file" ] ||
              env_refusal="the file cannot be read"
            if [ -n "$env_refusal" ]; then
              echo "EnvironmentFile line $env_number: $env_refusal" >&2
              exit 1
            fi
          }
          load_environment_file /etc/pharmacy-monitor/env

          RUN_ID="$run_id" PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
          import os
          from sqlalchemy import func, select

          from src import storage
          from src.storage import utcnow

          run_id = int(os.environ["RUN_ID"])
          storage.init_db()
          Session = storage.make_session()

          with Session() as session:
              run = session.get(storage.Run, run_id)
              if run is None:
                  raise SystemExit("requested run is absent")

              if run.status != "running" or run.finished_at is not None:
                  print(f"run_id={run.id} already_terminal=true status={run.status}")
                  raise SystemExit(0)

              sites = {item for item in (run.full_catalog_sites or "").split(",") if item}
              snapshots = session.scalar(
                  select(func.count())
                  .select_from(storage.PriceSnapshot)
                  .where(storage.PriceSnapshot.run_id == run.id)
              )
              if (
                  run.catalog_scope != "full"
                  or sites != {"pharmonline"}
                  or int(run.products_scraped or 0) != 0
                  or int(snapshots or 0) != 0
              ):
                  raise SystemExit("refusing to close a non-empty or non-Pharmonline run")

              quality = dict(run.run_quality or {})
              quality["full_catalog_verified"] = False
              quality["financially_eligible"] = False
              quality["recovery"] = {
                  "reason": "cancelled unsafe legacy fallback before data collection",
                  "recovered_at": utcnow().isoformat(),
              }
              run.run_quality = quality
              run.status = "failed"
              run.finished_at = utcnow()
              run.catalog_verified = False
              run.catalog_verification_reason = "cancelled_unsafe_legacy_fallback"
              run.error_message = (
                  "cancelled unsafe legacy fallback before data collection; "
                  "no snapshots were written"
              )
              session.commit()
              print(
                  f"run_id={run.id} status={run.status} "
                  f"products_scraped={run.products_scraped} snapshots={snapshots}"
              )
          PY
          REMOTE

      - name: Verify public health reports the attempt as failed
        if: ${{ !inputs.restart_api }}
        env:
          RUN_ID: ${{ steps.input.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          run_id = int(os.environ["RUN_ID"])
          with urllib.request.urlopen("https://leaddrive.cloud/health", timeout=30) as response:
              health = json.load(response)
          sites = health.get("product_policy", {}).get("sites", [])
          pharm = next((row for row in sites if row.get("site") == "pharmonline"), None)
          if pharm is None:
              raise SystemExit("pharmonline is absent from health response")
          print(
              "pharmonline latest attempt:",
              pharm.get("latest_full_attempt_id"),
              pharm.get("latest_full_attempt_status"),
              pharm.get("latest_full_attempt_reason"),
          )
          if pharm.get("latest_full_attempt_id") != run_id:
              raise SystemExit("health did not expose the recovered run")
          if pharm.get("latest_full_attempt_status") != "failed":
              raise SystemExit("recovered run was not reported as failed")
          PY

      - name: Restart API and verify truthful health status
        if: ${{ inputs.restart_api }}
        env:
          RUN_ID: ${{ steps.input.outputs.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            pm@13.140.186.143 \
            'set -euo pipefail
             sudo -n /usr/bin/systemctl restart pharmacy-monitor-api.service
             sleep 5
             curl --fail --silent --show-error --max-time 30 http://127.0.0.1:8080/health >/dev/null'

          python - <<'PY'
          import json
          import os
          import urllib.request

          run_id = int(os.environ["RUN_ID"])
          with urllib.request.urlopen("https://leaddrive.cloud/health", timeout=30) as response:
              health = json.load(response)
          sites = health.get("product_policy", {}).get("sites", [])
          pharm = next((row for row in sites if row.get("site") == "pharmonline"), None)
          if pharm is None:
              raise SystemExit("pharmonline is absent from health response")
          print(
              "pharmonline latest attempt:",
              pharm.get("latest_full_attempt_id"),
              pharm.get("latest_full_attempt_status"),
              pharm.get("latest_full_attempt_reason"),
          )
          print(
              "public health:",
              health.get("status"),
              health.get("full_catalog_status"),
              health.get("full_catalog_verified"),
          )
          if pharm.get("latest_full_attempt_id") != run_id:
              raise SystemExit("health did not expose the recovered run")
          if pharm.get("latest_full_attempt_status") != "failed":
              raise SystemExit("recovered run was not reported as failed")
          if health.get("full_catalog_status") != "failed":
              raise SystemExit("health did not report the failed catalog attempt")
          if health.get("full_catalog_verified") is not False:
              raise SystemExit("health incorrectly reports the catalog as verified")
          PY
